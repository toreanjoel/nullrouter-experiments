  },
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.85, this.ctx.currentTime, 0.1); },
  update(camDistToShore) {
    if (!this.started) return;
    const t = this.ctx.currentTime, A = Atmo;
    const gustNow = 1 + 0.25 * Math.sin(U.uTime.value * 0.8) * Math.sin(U.uTime.value * 0.31 + 2);
    const ws = A.windSpeed * gustNow;
    this.windF.frequency.setTargetAtTime(120 + ws * 30, t, 0.25);
    this.windG.gain.setTargetAtTime(Math.min(0.85, Math.pow(ws / 24, 1.3) * 0.55 + 0.015), t, 0.3);
    this.whistleF.frequency.setTargetAtTime(650 + ws * 38, t, 0.4);
    this.whistleG.gain.setTargetAtTime(smoothstep(12, 26, ws) * 0.07, t, 0.4);
    const cold = smoothstep(2, -1, A.T0);
    const rain = A.precipView * (1 - 0.85 * cold);
    this.rainG.gain.setTargetAtTime(Math.min(0.6, rain * 0.55), t, 0.4);
    this.rainLP.frequency.setTargetAtTime(5000 + rain * 4000, t, 0.5);
    const prox = 1 - smoothstep(1500, 9000, camDistToShore);
    const swell = Math.pow(0.5 + 0.5 * Math.sin(U.uTime.value * Math.PI * 2 / 8.5), 2);
    this.surfG.gain.setTargetAtTime((0.04 + 0.025 * A.waveAmp) * prox * (0.35 + 0.65 * swell), t, 0.25);
    this.surfF.frequency.setTargetAtTime(380 + A.waveAmp * 40, t, 0.5);
  },
  thunder(dist) {
    if (!this.started || this.ctx.state !== 'running') return;
    const ctx = this.ctx, r = this.rng, t0 = ctx.currentTime + dist / 343;   // sound travels at 343 m/s
    const near = 1 - smoothstep(700, 4500, dist), vol = 1.5 / (1 + dist / 1600);
    if (near > 0.03) {
      const s = ctx.createBufferSource(); s.buffer = this.white;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 700;
      const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol * near * 1.3, t0 + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0008, t0 + 0.4 + near * 0.3);
      s.connect(hp); hp.connect(g); g.connect(this.master); s.start(t0, r.next() * 3); s.stop(t0 + 1);
    }
    const s2 = ctx.createBufferSource(); s2.buffer = this.brown;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = lerp(900, 150, smoothstep(500, 9000, dist)); lp.Q.value = 0.9;
    const g2 = ctx.createGain(); const far = smoothstep(800, 9000, dist);
    g2.gain.setValueAtTime(0, t0);
    g2.gain.linearRampToValueAtTime(vol * (0.6 + 0.4 * near), t0 + 0.06 + far * 0.6);
    let tt = t0 + 0.3 + far * 0.6;
    const rolls = 3 + r.int(4);
    for (let k = 0; k < rolls; k++) { tt += r.range(0.35, 1.0) * (1 + far); g2.gain.setTargetAtTime(vol * r.range(0.25, 0.85) * (1 - k / (rolls + 1)), tt, 0.18 + far * 0.3); }
    const end = tt + 1.5 + far * 2.5;
    g2.gain.setTargetAtTime(0, tt + 0.3, 0.6 + far);
    s2.connect(lp); lp.connect(g2); g2.connect(this.master); s2.start(t0, r.next() * 2); s2.stop(end + 2);
  },
};

/* =====================================================================================
   UI — the collapsible control panel: time of day, time speed, season, temperature /
   humidity / wind sliders (the atmosphere eases toward them), weather buttons that steer
   the front model, seed + new island, erosion reset / speed / pause, a debug overlay
   that colours the terrain by one layer, the readout, and the mute button.
   ===================================================================================== */
const $ = id => document.getElementById(id);
const compass = deg => ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'][Math.round(((deg % 360) + 360) % 360 / 22.5) % 16];
const UI = {
  t: 0, dragTod: false,
  init() {
    $('panelHead').onclick = () => $('panel').classList.toggle('collapsed');
    const bind = (id, fn, fmt) => { const el = $(id); const f = () => { fn(parseFloat(el.value)); if (fmt) $(id + 'V').textContent = fmt(parseFloat(el.value)); }; el.addEventListener('input', f); f(); };
    const tod = $('tod');
    tod.addEventListener('pointerdown', () => this.dragTod = true);
    addEventListener('pointerup', () => this.dragTod = false);
    tod.addEventListener('input', () => { Atmo.hour = parseFloat(tod.value); });
    $('tspeed').onchange = e => Atmo.timeSpeed = parseFloat(e.target.value);
    $('season').onchange = e => Atmo.setSeason(e.target.value);
    bind('tempOff', v => Atmo.userT = v, v => (v > 0 ? '+' : '') + v.toFixed(1) + '°');
    bind('humBias', v => Atmo.userRH = v, v => (v > 0 ? '+' : '') + v + '%');
    bind('windMul', v => Atmo.userWind = v, v => Math.round(v * 100) + '%');
    bind('windDir', v => Atmo.userDirFrom = v, v => compass(v));
    bind('erodeSpeed', v => Sim.erodeSpeed = v, v => v.toFixed(1) + '×');
    document.querySelectorAll('#wxBtns button').forEach(b => b.onclick = () => { Atmo.setWeather(b.dataset.wx); this.refreshButtons(); });
    $('seed').value = new URLSearchParams(location.hash.slice(1)).get('seed') || 'island';
    $('seed').addEventListener('keydown', e => { if (e.key === 'Enter') newIsland($('seed').value.trim() || 'island'); });
    $('newIsland').onclick = () => newIsland($('seed').value.trim() || 'island');
    $('randSeed').onclick = () => { const w = ['gale', 'reef', 'tern', 'kelp', 'brine', 'cairn', 'fjord', 'puffin', 'swell', 'tide', 'drift', 'basalt']; const s = w[Math.floor(Math.random() * w.length)] + '-' + Math.floor(Math.random() * 9999); $('seed').value = s; newIsland(s); };
    $('resetErosion').onclick = () => { Layers.upload(World.island, Atmo.T0); warmUp(20); };
    $('pauseErosion').onclick = () => { Sim.paused = !Sim.paused; $('pauseErosion').classList.toggle('on', Sim.paused); $('pauseErosion').textContent = Sim.paused ? 'Erosion paused' : 'Pause erosion'; };
    $('rainTest').onclick = () => { Atmo.setWeather('storm'); $('erodeSpeed').value = 3; $('erodeSpeed').dispatchEvent(new Event('input')); this.refreshButtons(); };
    $('quality').onclick = () => { Quality.cycle(); };
    $('debugLayer').onchange = e => { U.uDebug.value = parseFloat(e.target.value); const on = U.uDebug.value < 0.5; Flora.grass.visible = Flora.tree.visible = Flora.rock.visible = on; };
    $('mute').onclick = e => { e.stopPropagation(); if (!Sound.started) { Sound.start(); Sound.setMuted(false); } else Sound.setMuted(!Sound.muted); this.refreshMute(); };
    const first = () => { if (!Sound.started) { Sound.start(); this.refreshMute(); } $('hint').textContent = 'Drag to orbit · scroll to zoom'; };
    addEventListener('pointerdown', first, { once: true });
    this.refreshButtons();
  },
  applyControls() {
    Atmo.timeSpeed = parseFloat($('tspeed').value); Atmo.setSeason($('season').value);
    const s = SEASONS[Atmo.seasonKey]; Atmo.base = s.base; Atmo.seaT = s.sea; Atmo.decl = s.decl;
    ['tempOff', 'humBias', 'windMul', 'windDir', 'erodeSpeed'].forEach(id => $(id).dispatchEvent(new Event('input')));
    Atmo.windDir = (Atmo.userDirFrom + 180) * Math.PI / 180;
  },
  refreshButtons() {
    document.querySelectorAll('#wxBtns button').forEach(b => b.classList.toggle('on', b.dataset.wx === 'auto' ? Atmo.auto : (!Atmo.auto && Atmo.phase === b.dataset.wx)));
  },
  refreshMute() { $('mute').textContent = Sound.started && !Sound.muted ? '🔊 Sound on' : '🔇 Sound off'; },
  tick(dt) {
    this.t += dt;
    if (this.t < 0.25) return;
    this.t = 0;
    const A = Atmo, hh = Math.floor(A.hour), mm = Math.floor((A.hour - hh) * 60);
    if (!this.dragTod) $('tod').value = A.hour.toFixed(2);
    $('todV').textContent = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    const peak = World.peak || CONFIG.PEAK;
    const snowLine = Math.max(0, (A.T0 - 1) / CONFIG.LAPSE);
    const dirFrom = ((A.windDir * 180 / Math.PI + 180) % 360 + 360) % 360;
    const breeze = Math.abs(A.breeze) > 0.6 ? (A.breeze > 0 ? ' · sea breeze' : ' · land breeze') : '';
    const rows = [
      ['Sea level', A.T0.toFixed(1) + ' °C'], ['Peak (' + Math.round(peak) + ' m)', A.tempAt(peak).toFixed(1) + ' °C'],
      ['Humidity', Math.round(A.rh * 100) + ' %'], ['Dew point', A.dew.toFixed(1) + ' °C'],
      ['Cloud base', Math.round(A.lcl) + ' m'], ['Snow line', snowLine > peak ? 'above peak' : Math.round(snowLine) + ' m'],
      ['Pressure', A.pressure.toFixed(0) + ' hPa'], ['Wind', A.windSpeed.toFixed(1) + ' m/s from ' + compass(dirFrom) + breeze],
      ['Tide', (U.uSeaLevel.value >= 0 ? '+' : '') + U.uSeaLevel.value.toFixed(1) + ' m'], ['Season', SEASONS[A.seasonKey].name],
    ];
    $('readout').innerHTML = `<div class="wn">${A.weatherName()}</div>` + rows.map(([k, v]) => `<span class="k">${k}</span><span>${v}</span>`).join('');
    $('stats').textContent = `frame ${Quality.avg.toFixed(1)} ms (${Math.round(1000 / Quality.avg)} fps) · quality ${Quality.label()} · ${Quality.cur.steps} sim steps/frame · strikes ${Lightning.strikes}`;
    this.refreshButtons();
  },
};

/* =====================================================================================
   QUALITY — keeps 60 fps by stepping down, in order: simulation steps per frame, then
   particle counts, then shadow resolution (and only then grass density / render scale).
   It steps back up after a stable period, backing off if that immediately fails.
   ===================================================================================== */
const Quality = {
  ladder: (() => {
    const L = [];
    for (const s of CONFIG.STEPS) L.push({ steps: s, part: 1, shadow: 2048, grass: 1, scale: 1 });
    for (const p of [0.6, 0.35]) L.push({ steps: 1, part: p, shadow: 2048, grass: 1, scale: 1 });
    for (const sh of [1024, 512]) L.push({ steps: 1, part: 0.35, shadow: sh, grass: 1, scale: 1 });
    L.push({ steps: 1, part: 0.35, shadow: 512, grass: 0.6, scale: 0.85 });
    L.push({ steps: 1, part: 0.25, shadow: 512, grass: 0.4, scale: 0.7 });
    return L;
  })(),
  level: 0, auto: true, avg: 16.7, timer: 0, stable: 0, backoff: 6, lastUp: -99, clock: 0, manual: -1,
  get cur() { return this.ladder[this.level]; },
  label() { return this.auto ? 'auto ' + (this.ladder.length - this.level) + '/' + this.ladder.length : ['high', 'medium', 'low'][this.manual]; },
  apply(l) {
    this.level = clamp(l, 0, this.ladder.length - 1);
    const q = this.cur;
    FX.setScale(q.part); Shadows.setSize(q.shadow); Flora.setGrassFraction(q.grass); Render.setScale(q.scale);
  },
  cycle() {
    this.manual = this.auto ? 0 : this.manual + 1;
    if (this.manual > 2) { this.manual = -1; this.auto = true; }
    else { this.auto = false; this.apply([0, 5, 9][this.manual]); }
    $('quality').textContent = 'Quality: ' + (this.auto ? 'auto' : ['high', 'medium', 'low'][this.manual]);
  },
  update(dt) {
    this.clock += dt;
    this.avg = this.avg * 0.93 + dt * 1000 * 0.07;
    if (!this.auto || this.clock < 3) return;
    this.timer += dt;
    if (this.timer < 0.5) return;
    if (this.avg > 18.3 && this.level < this.ladder.length - 1) {
      if (this.clock - this.lastUp < 4) this.backoff = Math.min(this.backoff * 2, 120);
      this.apply(this.level + 1); this.stable = 0; this.avg = 16.7;
    } else if (this.avg < 17.2) {
      this.stable += this.timer;
      if (this.stable > this.backoff && this.level > 0) { this.apply(this.level - 1); this.stable = 0; this.lastUp = this.clock; }
    } else this.stable = 0;
    this.timer = 0;
  },
};

/* =====================================================================================
   CAMERA — orbit with the mouse, zoom with the wheel within limits, and a slow drift
   after ten seconds without input. Kept above the terrain and the sea.
   ===================================================================================== */
const Cam = {
  theta: 2.4, phi: 0.36, dist: 8800, tTheta: 2.4, tPhi: 0.36, tDist: 8800, idle: 0, drift: 0,
  target: new THREE.Vector3(0, 420, 0),
  init(dom) {
    let last = null;
    dom.addEventListener('pointerdown', e => { last = [e.clientX, e.clientY]; dom.setPointerCapture(e.pointerId); dom.classList.add('drag'); this.idle = 0; });
    dom.addEventListener('pointermove', e => {
      if (!last) return;
      const dx = e.clientX - last[0], dy = e.clientY - last[1]; last = [e.clientX, e.clientY];
      this.tTheta += dx * 0.005; this.tPhi = clamp(this.tPhi + dy * 0.004, 0.05, 1.35); this.idle = 0;
    });
    const up = e => { last = null; dom.classList.remove('drag'); };
    dom.addEventListener('pointerup', up); dom.addEventListener('pointercancel', up);
    dom.addEventListener('wheel', e => { e.preventDefault(); this.tDist = clamp(this.tDist * Math.exp(e.deltaY * 0.0011), 2400, 18000); this.idle = 0; }, { passive: false });
  },
  update(dt) {
    this.idle += dt;
    if (this.idle > 10) {
      this.drift += dt;
      this.tTheta += dt * 0.035 * smoothstep(10, 14, this.idle);
      this.tPhi = approach(this.tPhi, 0.33 + 0.08 * Math.sin(this.drift * 0.05), dt, 10);
      this.tDist = approach(this.tDist, 8600 + 1800 * Math.sin(this.drift * 0.031), dt, 14);
    }
    this.theta = approach(this.theta, this.tTheta, dt, 0.18); this.phi = approach(this.phi, this.tPhi, dt, 0.18); this.dist = approach(this.dist, this.tDist, dt, 0.25);
    const c = Math.cos(this.phi);
    const p = camera.position.set(Math.cos(this.theta) * c, Math.sin(this.phi), Math.sin(this.theta) * c).multiplyScalar(this.dist).add(this.target);
    const g = Layers.ready ? Layers.groundAt(p.x, p.z) : 0;
    p.y = Math.max(p.y, g + 150, U.uSeaLevel.value + 60);
    camera.lookAt(this.target);
    camera.updateMatrixWorld();
  },
};

/* =====================================================================================
   MAIN — boot, island creation and the frame loop.
   ===================================================================================== */
const World = { island: null, peak: CONFIG.PEAK, frame: 0, last: 0 };
function warmUp(steps) {
  Sim.fields();
  SIMU.uAtmoDt.value = 0.5;
  for (let i = 0; i < steps; i++) Sim.step();
  Layers.readback(0); Layers.readback(1); Layers.readback(2);
}
function newIsland(seed) {
  location.hash = 'seed=' + encodeURIComponent(seed);
  MASTER = new RNG(hashString(seed));
  const sr = MASTER.fork('gpu-noise'); U.uSeedOff.value.set(sr.range(0, 300), sr.range(0, 300));
  Atmo.reset(seed); Atmo.seed = seed; UI.applyControls();
  Atmo.update(0.0001); Look.update();
  World.island = generateIsland(seed);
  Flora.setPlacement(placeFlora(World.island));
  Layers.upload(World.island, Atmo.T0);
  Lightning.reset(seed);
  warmUp(40);
}
function afterReadback() {
  const S = CONFIG.SUMMARY, A = Layers.A, B = Layers.B, sea = U.uSeaLevel.value;
  let peak = 0, pSum = 0, pN = 0, pMax = 0;
  for (let i = 0; i < S * S; i++) {
    peak = Math.max(peak, A[i * 4]);
    const p = B[i * 4 + 3]; pMax = Math.max(pMax, p);
    if (A[i * 4] > sea) { pSum += p; pN++; }
  }
  World.peak = peak; Atmo.precipIsland = pN ? pSum / pN : 0; Atmo.precipMax = pMax;
  const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);
  let pv = 0, cov = 0, cn = 0;
  for (let k = 0; k <= 8; k++) { const p = camera.position.clone().addScaledVector(fwd, k * 1500); pv = Math.max(pv, Layers.cloudSample(p.x, p.z, 1) * (1 - k * 0.06)); }
  for (let j = 0; j < 32; j++) for (let i = 0; i < 32; i++) { const x = ((i + 0.5) / 32 - 0.5) * CLOUD_DOMAIN, z = ((j + 0.5) / 32 - 0.5) * CLOUD_DOMAIN; const w = Math.exp(-(x * x + z * z) / (2 * 5000 * 5000)); cov += Layers.C[(j * 32 + i) * 4] * w; cn += w; }
  Atmo.coverObs = clamp(cov / cn * 1.15, 0, 1);
  Atmo.precipView = approach(Atmo.precipView, Math.max(pv, Atmo.precipIsland), 0.5, 1);
  U.uPrecipView.value = Atmo.precipView;
}
function shoreDistance() {
  const p = camera.position, r = Math.hypot(p.x - World.island.cx, p.z - World.island.cz);
  return Math.hypot(Math.max(0, r - World.island.R), p.y);
}
function loop(now) {
  const dt = clamp((now - (World.last || now)) / 1000, 0.0001, 0.1);
  World.last = now; World.frame++;
  Quality.update(dt);
  U.uTime.value += dt;
  Atmo.update(dt); SIMU.uSeaT.value = Atmo.seaT;
  Look.update();
  Cam.update(dt);
  Sim.fields();
  const steps = Quality.cur.steps;
  SIMU.uAtmoDt.value = Atmo.simDt / steps;
  for (let i = 0; i < steps; i++) Sim.step();
  if (World.frame % 12 === 0) Layers.readback(0);
  if (World.frame % 12 === 3) Layers.readback(2);
  if (World.frame % 12 === 6) { Layers.readback(1); afterReadback(); }
  Lightning.update(dt);
  Flora.update(dt);
  FX.update(camera);
  Render.frame();
  Sound.update(shoreDistance());
  UI.tick(dt);
  requestAnimationFrame(loop);
}
function fail(msg) { const m = $('msg'); m.classList.remove('hide'); m.innerHTML = msg; }
function main() {
  try {
    Render.init();
    if (!renderer.capabilities.isWebGL2) return fail('This diorama needs WebGL 2.');
    if (!renderer.extensions.has('EXT_color_buffer_float')) return fail('This diorama needs float render targets (EXT_color_buffer_float).');
    GPU.init(renderer); Layers.init(); Sim.create();
    Atmo.reset('island');
    UI.init(); Cam.init(renderer.domElement);
    newIsland($('seed').value);
    Cam.update(0.016);
    renderer.compile(Render.opaque, camera); renderer.compile(Render.fx, camera); renderer.compile(Shadows.scene, Shadows.sunCam);
    $('msg').classList.add('hide');
    window.island = { U, SIMU, Atmo, Layers, Sim, Render, FX, Flora, Lightning, Quality, Cam, World, THREE, get camera() { return camera; }, get renderer() { return renderer; } };  // console handle for inspection
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    fail('Something went wrong starting the island:<br><code>' + String(e && e.message || e) + '</code>');
  }
}
main();
</script>
</body>
</html>
