    this.phase = !f || I < 0.05 || Math.abs(f.pos) > horizon ? 'clear'
      : f.pos > 0.8 * W ? 'building' : f.pos < -0.8 * W ? 'clearing'
      : this.stormK > 0.5 ? 'storm' : raining ? 'rain' : 'overcast';
    const snow = this.seaLevelTemp < 1;
    this.name = this.fogK > 0.5 ? 'fog'
      : this.stormK > 0.5 ? 'storm'
      : raining ? (snow ? 'snow' : this.freezingLevel < peakKm ? 'rain, snow on the peak' : 'rain')
      : this.phase === 'building' ? 'building cloud' : this.phase === 'clearing' ? 'clearing'
      : this.cover > 0.7 ? 'overcast' : this.capCloud > 0.5 ? 'fair, cloud on the peak' : 'clear';
  },

  // CPU twins of SKY_CLOUD_GLSL, at a point km east and south of the island.
  frontLift(xKm, zKm) {
    const f = Sky.front, x = (xKm * f.dir.x + zKm * f.dir.y - f.pos) / f.width;
    return f.lift * Math.exp(-x * x);
  },
  frontCover(xKm, zKm) { return THREE.MathUtils.smoothstep(this.frontLift(xKm, zKm) - Sky.front.base, 0, 1.2); },
  frontRain(xKm, zKm) { return Sky.front.rain * THREE.MathUtils.smoothstep(this.frontLift(xKm, zKm) - Sky.front.base, 1, 3); },

  // Blend of the grade's weather tints for the current state.
  weights() {
    const ss = THREE.MathUtils.smoothstep;
    const rainK = ss(this.precip, 0.3, 4), snowK = 1 - ss(this.seaLevelTemp, -0.5, 1.5);
    const over = ss(this.cover, 0.35, 0.9), dry = (1 - rainK) * (1 - this.fogK), s = this.stormK;
    return {
      clear: (1 - over) * dry, overcast: over * dry, fog: this.fogK,
      rain: rainK * (1 - s) * (1 - snowK), snow: rainK * (1 - s) * snowK, storm: rainK * s,
    };
  },

  // Hand the results to the systems that show them, and update the layers.
  apply(dt) {
    const A = CONFIG.atmosphere, T = CONFIG.terrain, ss = THREE.MathUtils.smoothstep, U = this.windSpeed + A.downdraught[1] * this.outflow;
    Wind.set(this.windFrom, U);   // the wind moves the clouds, the plants, the sea and the dust from here
    Wind.uniforms.uBreeze.value = this.breeze;
    Wind.gustiness = 1 + 0.6 * this.stormK + 0.8 * this.outflow;
    Sky.overhead = this.cover;
    Sky.storm = this.stormK;
    Sky.updateFront();
    // Waves follow the wind, up to the steepest the summed Gerstner waves allow without looping.
    Ocean.waveScale = U < 7 ? mix(0.6, 1, U / 7) : mix(1, 0.95 / CONFIG.ocean.steepness, ss(U, 7, 24));
    Look.setWeather(this.weights());
    if (!dt) return;
    const u = this.pass.uniforms;
    u.uAirTemp.value.set(this.seaLevelTemp, this.seaAirTemp, T.lapseRate / 1000 * T.metresPerUnit, this.foehn);
    u.uAirRain.value.set(this.oroRain, T.metresPerUnit / 1000);
    Heightfield.step('state', this.pass);
  },

  // ── Cap cloud ──
  // The mountain's own cloud: toon puffs hugging the windward slopes and summit
  // between the cloud base and just over the top, with a banner trailing downwind
  // when the wind is strong. They swell in as capCloud rises and shrink away as it
  // falls, the puffs nearest the summit first.
  // Puffs of three kinds: a wall along the windward flank (height 0 at the cloud
  // base, 1 at the summit; out in radii from where it meets the slope, negative
  // sinks it in), a cap sitting on the summit, and a banner trailing downwind.
  makeBlobs(rng) {
    const blobs = [], phase = () => rng.range(0, Math.PI * 2);
    for (let i = 0; i < 26; i++) {
      const height = rng.range(0.1, 1);
      blobs.push({ kind: 'wall', height, angle: rng.range(-1.3, 1.3), out: rng.range(-0.4, 0.2),
        radius: rng.range(6, 9.5) * (0.8 + 0.4 * height), threshold: (1 - height) * 0.6 + rng.range(0, 0.12), phase: phase() });
    }
    for (let i = 0; i < 9; i++) {
      blobs.push({ kind: 'cap', height: rng.range(0, 1), angle: rng.range(0, Math.PI * 2), out: rng.range(0, 13),
        radius: rng.range(7, 10.5), threshold: rng.range(0, 0.15), phase: phase() });
    }
    for (let i = 0; i < 11; i++) {
      const k = i / 10;
      blobs.push({ kind: 'banner', height: rng.range(0.75, 1), angle: rng.gauss(0, 0.14), out: 0.3 + 4.5 * k,
        radius: THREE.MathUtils.lerp(9, 4.5, k) * rng.range(0.85, 1.15), threshold: 0.25 + 0.5 * k + rng.range(0, 0.08), phase: phase() });
    }
    return blobs;
  },

  buildCapCloud() {
    const material = Toon.material({ color: 'cloud', fragmentPars: CLOUD_SHADE_GLSL, shade: 'cloudShade' });
    material.shadowSide = THREE.BackSide;   // cast from the far side, so a puff never shadow-acnes itself
    const mesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 2), material, this.blobs.length);
    mesh.castShadow = true;
    mesh.frustumCulled = false;
    mesh.name = 'cap-cloud';
    scene.add(mesh);
    this.capMatrix = new THREE.Matrix4();
    this.capQuat = new THREE.Quaternion();
    return mesh;
  },

  updateCapCloud(time) {
    const S = Terrain.summit, ss = THREE.MathUtils.smoothstep, m = this.capMatrix, H = Heightfield;
    const top = S.y + 6, base = THREE.MathUtils.clamp(this.cloudBase * 1000 / CONFIG.terrain.metresPerUnit, S.y * 0.35, S.y - 8);
    const upwind = Math.atan2(-this.dir.y, -this.dir.x), bannerK = ss(this.windSpeed, 5, 13);
    const p = new THREE.Vector3(), s = new THREE.Vector3();
    this.blobs.forEach((b, i) => {
      const grow = ss(this.capCloud * (b.kind === 'banner' ? bannerK : 1), b.threshold, b.threshold + 0.25);
      if (grow <= 0) { this.capMesh.setMatrixAt(i, m.makeScale(0, 0, 0)); return; }
      const bob = Math.sin(time * 0.25 + b.phase) * 1.2;
      let x, y, z;
      if (b.kind === 'cap') {
        x = S.x + Math.cos(b.angle) * b.out - this.dir.x * 6;
        z = S.z + Math.sin(b.angle) * b.out - this.dir.y * 6;   // leaning a little upwind
        y = S.y + 1 + 5 * b.height + bob;
      } else {
        y = b.kind === 'wall' ? base + (top - base) * b.height + bob : top - 10 * (1 - b.height) + bob;
        const ang = upwind + (b.kind === 'banner' ? Math.PI : 0) + b.angle, cx = Math.cos(ang), cz = Math.sin(ang);
        let d = 0;   // out from the summit until the ground drops below this puff
        while (d < 220 && H.sample(S.x + cx * d, S.z + cz * d) > y) d += 3;
        d = Math.max(0, d + b.out * b.radius);
        x = S.x + cx * d; z = S.z + cz * d;
      }
      const r = b.radius * grow * (0.93 + 0.07 * Math.sin(time * 0.4 + b.phase));
      m.compose(p.set(x, y, z), this.capQuat, s.set(r, r * 0.72, r));
      this.capMesh.setMatrixAt(i, m);
    });
    this.capMesh.instanceMatrix.needsUpdate = true;
  },

  // One line of figures for the frame-time overlay (the UI part shows the full readout).
  readout() {
    const h = Clock.hours, hh = String(Math.floor(h)).padStart(2, '0'), mm = String(Math.floor(h % 1 * 60)).padStart(2, '0');
    const f = this.front;
    return `${Clock.season} ${hh}:${mm} · ${this.name} [${this.phase}${f ? ` ${f.kind} ${f.pos.toFixed(0)} km` : ''}]\n` +
      `${this.seaLevelTemp.toFixed(1)}° sea  ${this.peakTemp.toFixed(1)}° peak  RH ${(this.humidity * 100).toFixed(0)}%  dew ${this.dewPoint.toFixed(1)}°  ` +
      `${this.pressure.toFixed(0)} hPa  wind ${this.windSpeed.toFixed(1)} m/s from ${this.windFrom.toFixed(0)}°  breeze ${this.breeze.toFixed(1)}\n` +
      `cloud base ${this.cloudBase.toFixed(2)} km  freezing ${this.freezingLevel.toFixed(2)} km  cover ${this.cover.toFixed(2)}  cap ${this.capCloud.toFixed(2)}  rain ${this.precip.toFixed(1)} mm/h`;
  },
};

// ── Air: fog, cloud shadows, god rays, the rainbow ──────────────────────────
// One post pass (before the grade) that knows each pixel's world position from the
// depth buffer, and draws what the air between the camera and the ground does:
//  · cloud shadows: the cloud deck's own pattern (SKY_CLOUD_GLSL, at the deck's height
//    above the ground along the sun) darkens the land and sea under it, in one hard
//    band, moving with the cloud
//  · god rays: under a broken storm deck with the sun up, light falling through the
//    gaps shows as stylised banded shafts in the air
//  · fog: where the air near the ground has cooled to its dew point. Valley fog fills
//    the low ground (clear still nights, strongest at dawn) and burns off as the sun
//    warms the land; sea fog forms when warm humid air lies over the cooler sea. Both
//    are layers that thin with height, drawn in a few soft bands of palette haze
//  · the rainbow: only with the sun low behind the camera and rain falling in front of
//    it; a banded arc 42° from the antisolar point in palette colours (red outside)
// Atmosphere.derive() decides how much of each there is (Air.state).
const AIR_FRAGMENT = () => /* glsl */`   // a function: the sky's GLSL is defined further down
#include <packing>
uniform sampler2D tColor, tDepth;
uniform vec2 uResolution;
uniform float uNear, uFar;
uniform mat4 uInvProj, uCamWorld;
uniform vec3 uCamPos;
uniform vec3 uSunDir, uSunColor, uShadowTint, uFogColor, uFogLit;
uniform vec4 uAir;          // cloud shadow strength, god rays strength, rainbow strength, deck height (world units)
uniform vec4 uFog;          // valley fog density, its layer height; sea fog density, its layer height
uniform float uSeaLevel, uWorldKm;
uniform vec3 uBowA, uBowB, uBowC, uBowD, uBowE, uBowF;   // inside (violet) to outside (red)
varying vec2 vUv;
${SKY_NOISE_GLSL}
${SKY_CLOUD_GLSL}
uniform float uCloudScale, uCloudPlaneKm;
// The deck over world point x: 1 where cloud stands between it and the sun.
float cloudOver(vec3 x) {
  vec3 L = normalize(vec3(uSunDir.x, max(uSunDir.y, 0.08), uSunDir.z));
  vec2 xz = x.xz + L.xz * (uAir.w - x.y) / L.y;
  vec2 q = xz * uWorldKm / uCloudPlaneKm;           // deck heights, as the dome measures them
  float den = cloudField(q * uCloudScale);
  return smoothstep(-0.02, 0.02, den - cloudThreshold(cloudCoverAt(q * uCloudPlaneKm)));
}
// Light through the storm deck at world point x: its thinnest parts, two octaves (cheap).
float deckGap(vec3 x) {
  vec3 L = normalize(vec3(uSunDir.x, max(uSunDir.y, 0.08), uSunDir.z));
  vec2 q = (x.xz + L.xz * (uAir.w - x.y) / L.y) * uWorldKm / uCloudPlaneKm;
  vec2 p = q * uCloudScale * vec2(3.0, 5.1) + uCloudOffset * 3.0 + uCloudSeed;
  float den = (0.5 * vnoise(p) + 0.25 * vnoise(p * 2.07 + vec2(1.7, 9.2))) / 0.75;
  return 1.0 - smoothstep(0.22, 0.25, den);   // only the rare thin places
}
// Fog along a ray from the camera: an exponential layer above the sea, integrated.
float layerFog(float density, float H, vec3 ro, vec3 rd, float dist) {
  if (density <= 0.0) return 0.0;
  float y0 = max(ro.y - uSeaLevel, 0.0), k = rd.y / H;
  float base = density * exp(-y0 / H);
  return abs(k) < 1e-4 ? base * dist : base * (1.0 - exp(-k * dist)) / k;
}
void main() {
  vec3 col = texture2D(tColor, vUv).rgb;
  float z = texture2D(tDepth, vUv).x;
  vec4 v = uInvProj * vec4(vUv * 2.0 - 1.0, z * 2.0 - 1.0, 1.0);
  vec3 view = v.xyz / v.w;
  bool sky = z >= 0.99999;
  vec3 ro = uCamPos, wp = (uCamWorld * vec4(view, 1.0)).xyz;
  vec3 rd = normalize(wp - ro);
  float dist = sky ? 3000.0 : length(wp - ro);

  // Cloud shadow on the ground and the sea.
  if (!sky && uAir.x > 0.0) col = mix(col, col * uShadowTint * 1.25, cloudOver(wp) * uAir.x);

  // God rays: sample the air along the ray for gaps in the deck.
  if (uAir.y > 0.0) {
    float lit = 0.0, reach = min(dist, 360.0);
    for (int i = 0; i < 8; i++) {
      vec3 x = ro + rd * reach * (float(i) + 0.5) / 8.0;
      lit += deckGap(x) * smoothstep(uAir.w, uAir.w * 0.4, x.y) * step(uSeaLevel, x.y);
    }
    float shaft = step(0.12, lit / 8.0) * 0.6 + step(0.3, lit / 8.0) * 0.4;   // beams in two hard steps
    col = mix(col, col + uSunColor * 0.32, shaft * uAir.y);
  }

  // The rainbow, over anything far enough off for the rain to be in front of it.
  if (uAir.z > 0.0) {
    float a = degrees(acos(clamp(dot(rd, -uSunDir), -1.0, 1.0)));
    float band = (a - 40.2) / 0.4;   // six bands, 0.4° each
    if (band >= 0.0 && band < 6.0) {
      vec3 bow = band < 1.0 ? uBowA : band < 2.0 ? uBowB : band < 3.0 ? uBowC : band < 4.0 ? uBowD : band < 5.0 ? uBowE : uBowF;
      float k = uAir.z * smoothstep(40.0, 140.0, dist);   // only with rain between: not on what is close
      col = mix(col, bow, 0.45 * k);
    }
  }

  // Fog: valley and sea layers, in soft bands.
  float f = layerFog(uFog.x, uFog.y, ro, rd, dist) + layerFog(uFog.z, uFog.w, ro, rd, dist);
  if (f > 0.0) {
    float amount = 1.0 - exp(-f);
    float banded = floor(amount * 4.0) / 4.0;
    amount = mix(banded, amount, 0.35);
    vec3 fogCol = mix(uFogColor, uFogLit, 0.5 + 0.5 * dot(rd, normalize(vec3(uSunDir.x, 0.0, uSunDir.z) + 1e-4)));
    col = mix(col, fogCol, clamp(amount, 0.0, 0.92));
  }
  gl_FragColor = vec4(col, 1.0);
}`;

const Air = {
  state: { shadows: 0, rays: 0, rainbow: 0, valleyFog: 0, seaFog: 0 },

  init() {
    const P = Look.palette, S = Sky.uniforms, C = CONFIG.air;
    this.fogColor = new THREE.Color();
    this.fogLit = new THREE.Color();
    this.material = Post.shader(AIR_FRAGMENT(), {
      tColor: { value: null }, tDepth: { value: null },
      uResolution: { value: new THREE.Vector2() }, uNear: { value: 0 }, uFar: { value: 0 },
      uInvProj: { value: camera.projectionMatrixInverse }, uCamWorld: { value: camera.matrixWorld }, uCamPos: { value: camera.position },
      uSunDir: { value: Celestial.sunDir }, uSunColor: { value: sun.color }, uShadowTint: Look.uniforms.uShadowTint,
      uFogColor: { value: this.fogColor }, uFogLit: { value: this.fogLit },
      uAir: { value: new THREE.Vector4(0, 0, 0, CONFIG.sky.cloudPlane * 1000 / CONFIG.terrain.metresPerUnit) },
      uFog: { value: new THREE.Vector4(0, C.valleyHeight, 0, C.seaHeight) },
      uSeaLevel: { value: 0 }, uWorldKm: { value: CONFIG.terrain.metresPerUnit / 1000 },
      uCloudOffset: S.uCloudOffset, uCloudSeed: S.uCloudSeed, uCloudCover: S.uCloudCover,
      uFront: S.uFront, uFrontCloud: S.uFrontCloud, uCloudScale: S.uCloudScale, uCloudPlaneKm: { value: CONFIG.sky.cloudPlane },
      uBowA: { value: P.shadow }, uBowB: { value: P.skyZenith }, uBowC: { value: P.waterShallow },
      uBowD: { value: P.grass }, uBowE: { value: P.sun }, uBowF: { value: P.ember },
    });
    Post.add('air', this.material, { before: 'grade', update: () => this.update() });
  },

  // From the atmosphere (each sim step): how much of each effect there is.
  derive(A) {
    const C = CONFIG.air, ss = THREE.MathUtils.smoothstep, st = this.state;
    const day = Celestial.daylight, sunY = Celestial.sunDir.y;
    // Cloud shadows show while the sun is out and the deck is broken, not overcast.
    st.shadows = C.shadow * ss(sunY, 0.02, 0.2) * (1 - ss(A.cover, 0.8, 0.98));
    // God rays: a storm deck with the sun up behind it.
    st.rays = C.rays * ss(sunY, 0.05, 0.3) * ss(A.cover, 0.6, 0.9) * Math.max(A.stormK, 0.4 * ss(A.cover, 0.85, 1));
    // The rainbow: rain, the sun shining low (under 42°) through a gap.
    const elev = Math.asin(THREE.MathUtils.clamp(sunY, -1, 1)) * 180 / Math.PI;
    st.rainbow = C.rainbow * ss(A.precip, 0.3, 2) * ss(elev, 1, 6) * (1 - ss(elev, 30, 41)) * (1 - ss(A.cover, 0.75, 0.95)) * day;
    // Fog: valley fog where the land air has cooled to its dew point in still air;
    // sea fog when warm humid air sits over the cooler sea.
    const spread = A.seaLevelTemp - A.dewPoint, still = 1 - ss(A.windSpeed, 2.5, 6);
    st.valleyFog = ss(C.valleySpread, 0.2, spread) * still;
    st.seaFog = ss(0.85, 0.97, A.humidity) * ss(C.seaWarm[0], C.seaWarm[1], A.seaLevelTemp - A.seaAirTemp + 0.15 * A.landDT) * (1 - ss(A.windSpeed, 5, 10));
    if (A.mode === 'fog') st.valleyFog = Math.max(st.valleyFog, ss(A.humidity, 0.9, 0.99) * still);
  },

  update() {
    const C = CONFIG.air, st = this.state, u = this.material.uniforms, P = Look.palette, S = Sky.uniforms;
    u.uAir.value.x = st.shadows;
    u.uAir.value.y = st.rays;
    u.uAir.value.z = st.rainbow;
    u.uFog.value.x = st.valleyFog * C.valleyDensity;
    u.uFog.value.z = st.seaFog * C.seaDensity;
    u.uSeaLevel.value = Tide.level;
    // Fog takes the palette haze, lit by the sky: darker at night, warmer toward a low sun.
    this.fogColor.copy(P.haze).lerp(S.uHorizon.value, 0.35).multiplyScalar(0.25 + 0.75 * Celestial.daylight);
    this.fogLit.copy(this.fogColor).lerp(S.uGlow.value, 0.25 * Celestial.twilight);
  },
};

// ═════════════════════════════════════════════════════════════════════════════
// WATER — the sea around the island (its waves, its tide, the spray torn off it in
// strong wind), and water on the land: falling rain and its splashes, and a pipe-model
// shallow-water simulation that runs the rain and snowmelt downhill into puddles,
// streams and rivers, soaks it into the ground and evaporates it.
// ═════════════════════════════════════════════════════════════════════════════

// ── Ocean ───────────────────────────────────────────────────────────────────
// A ring mesh centred on the island: even rings near it, wider ones out to the
// horizon. The vertex shader sums Gerstner waves (GPU Gems 1, ch. 1), flattened
// in shallow water; the fragment shader re-sums them per pixel for normals (plus a
// finer octave, faded out once a wave is smaller than a pixel). Colour steps from
// waterShallow to waterDeep by the depth over the Heightfield, with a hard foam
// line at the shore and a second line that rolls in toward it. Lighting is the
// toon bands with the light wrapped round (so a low sun still lights the sea), a
// banded sky reflection and two-band specular glints. Far away the sea blends into
// the sky's below-horizon colour, so its edge is never seen.
const OCEAN_COMMON_GLSL = /* glsl */`
#define OCEAN_WAVES ${CONFIG.ocean.waves}
uniform vec4 uWave[OCEAN_WAVES];       // direction xz, wavenumber k, amplitude
uniform vec2 uWavePhase[OCEAN_WAVES];  // angular speed, phase offset
uniform float uWaveQ;                  // summed steepness
uniform float uWaveScale;              // 1 calm; the weather may raise it
uniform float uOceanTime;
uniform float uOceanLevel;
uniform float uShoalDepth;
varying vec2 vOceanBase;               // world xz before the waves move it
${HEIGHTFIELD_GLSL}
uniform float uOpenDepth;
// Depth of the sea at xz; past the heightfield's edge it falls away to open water.
float waterDepth(vec2 xz) {
  vec2 e = abs(xz) / (0.5 * uHeightGrid.x);
  return mix(uOceanLevel - groundHeight(xz), uOpenDepth, smoothstep(0.92, 1.0, max(e.x, e.y)));
}
// Waves die down over the shallows, so the shoreline stays where the ground meets sea level.
float shoal(float depth) { return smoothstep(0.0, uShoalDepth, depth); }
float waveTheta(int i, vec2 p) { return uWave[i].z * dot(uWave[i].xy, p) - uWavePhase[i].x * uOceanTime + uWavePhase[i].y; }
// One Gerstner wave of amplitude a: adds its displacement and its share of the normal.
void gerstner(vec2 dir, float k, float a, float q, float th, inout vec3 disp, inout vec3 nrm) {
  float c = cos(th), s = sin(th);
  disp.xz += q * a * dir * c;
  disp.y += a * s;
  nrm.xz -= dir * k * a * c;
  nrm.y -= q * k * a * s;
}
// Height of the sea surface over xz: the waves' rise and fall, without their sideways sway.
float seaHeight(vec2 xz) {
  float atten = shoal(waterDepth(xz)) * uWaveScale, y = 0.0;
  for (int i = 0; i < OCEAN_WAVES; i++) y += uWave[i].w * atten * sin(waveTheta(i, xz));
  return uOceanLevel + y;
}`;

const OCEAN_VERTEX_MAIN = /* glsl */`
  vec2 base = (modelMatrix * vec4(position, 1.0)).xz;
  vOceanBase = base;
  // Mesh spacing here: a wave much shorter than this would alias, so it fades out.
  float spacing = max(uOceanMesh.x, length(position.xz) * uOceanMesh.y);
  float atten = shoal(waterDepth(base)) * uWaveScale;
  vec3 disp = vec3(0.0), nrm = vec3(0.0, 1.0, 0.0);
  for (int i = 0; i < OCEAN_WAVES; i++) {
    float k = uWave[i].z, len = 6.2831853 / k;
    float lod = 1.0 - smoothstep(len / 8.0, len / 4.0, spacing);
    float q = uWaveQ / (k * uWave[i].w * float(OCEAN_WAVES));
    gerstner(uWave[i].xy, k, uWave[i].w * atten * lod, q, waveTheta(i, base), disp, nrm);
  }
  transformed += disp;
  objectNormal = normalize(nrm);`;

// (Ocean.init() puts OCEAN_COMMON_GLSL and the sky's noise ahead of this.)
const OCEAN_FRAGMENT_PARS = /* glsl */`
uniform vec2 uOceanStorm;   // storm 0…1 (the atmosphere), unused
uniform vec3 uStormGrey, uStormGreen;
uniform vec3 uShallow, uDeep, uFoamColor;
uniform vec3 uDepthBands;
uniform vec4 uFoam;          // shore width, ring start depth, ring speed, ring width
uniform vec3 uSpec;          // sharpness, band 1, band 2
uniform vec4 uOceanLight;    // wrap, reflect band 1, reflect band 2, reflect strength
uniform vec2 uOceanFade;     // start, end distance
uniform vec4 uOceanWind;     // ripple height in still air, at the reference wind; whitecaps from, most by (m/s)
uniform vec2 uWhitecapFade;  // whitecaps fade out over this distance
uniform vec3 uHorizon, uZenith, uGlow, uGradient, uSunDir;   // the sky's, shared
float oFoam = 0.0;

vec3 oceanShade(vec3 albedo, vec3 N, vec3 V, float gloss) {
  // Shadow band: as the toon shader's, for a surface facing the sky.
  vec3 col = albedo * (uShadowTint + uSkyColor * uSkyBounce) + uShadowTint * dot(albedo, vec3(0.2126, 0.7152, 0.0722)) * uShadowHue;
  vec3 spec = vec3(0.0);
  #if NUM_DIR_LIGHTS > 0
    DirectionalLight dl;
    #if defined( USE_SHADOWMAP ) && NUM_DIR_LIGHT_SHADOWS > 0
      DirectionalLightShadow dls;
    #endif
    #pragma unroll_loop_start
    for (int i = 0; i < NUM_DIR_LIGHTS; i++) {
      dl = directionalLights[ i ];
      float sh = 1.0;
      #if defined( USE_SHADOWMAP ) && ( UNROLLED_LOOP_INDEX < NUM_DIR_LIGHT_SHADOWS )
        dls = directionalLightShadows[ i ];
        sh = receiveShadow ? getShadow( directionalShadowMap[ i ], dls.shadowMapSize, dls.shadowIntensity, dls.shadowBias, dls.shadowRadius, vDirectionalShadowCoord[ i ] ) : 1.0;
      #endif
      float x = mix(dot(N, dl.direction), 1.0, uOceanLight.x) * sh;
      float level = toonStep(x, uBands.x) * uBands.z + toonStep(x, uBands.y) * (1.0 - uBands.z);
      vec3 lit = albedo * dl.color;
      float brighter = step(dot(col, vec3(0.2126, 0.7152, 0.0722)), dot(lit, vec3(0.2126, 0.7152, 0.0722)));
      col = mix(col, lit, level * brighter);
      if (gloss > 0.0) {
        vec3 H = normalize(dl.direction + V);
        float s = pow(max(dot(N, H), 0.0), uSpec.x) * sh;
        spec += dl.color * (0.45 * toonStep(s, uSpec.y) + 0.55 * toonStep(s, uSpec.z)) * gloss;
      }
    }
    #pragma unroll_loop_end
  #endif
  // Sky reflection at grazing angles, in two hard bands; foam doesn't reflect.
  float f = pow(1.0 - max(dot(N, V), 0.0), 3.0);
  float refl = (0.5 * toonStep(f, uOceanLight.y) + 0.5 * toonStep(f, uOceanLight.z)) * uOceanLight.w * (1.0 - oFoam);
  col = mix(col, uSkyColor, refl);

  // Into the distance: the exact colour the sky dome draws just below the horizon
  // (its base plus the banded sunset fan), so the sea's edge disappears.
  vec3 d = vWorldPos - cameraPosition;
  float toward = dot(normalize(d.xz + 1e-5), normalize(uSunDir.xz + 1e-5)) * 0.5 + 0.5;
  float glow = floor(uGradient.z * toward * toward * 4.0 + 0.5) / 4.0;
  vec3 below = mix(mix(uHorizon, uZenith, 0.15), uGlow, glow);
  float far = smoothstep(uOceanFade.x, uOceanFade.y, length(d.xz));
  return mix(col, below, far) + spec * (1.0 - far * far);   // glints stay out to the horizon
}`;

const OCEAN_FRAGMENT_MAIN = /* glsl */`
  vec2 base = vOceanBase;
  float depth = waterDepth(base);
  float atten = shoal(depth) * uWaveScale;

  // The local wind, gusts included: its ripples (the finer octave) roughen the
  // water, so gusts darken across the sea in patches and the island's lee lies calm.
  float ws = length(windAt(base));
  float chop = mix(uOceanWind.x, uOceanWind.y, min(ws / uWindGust.w, 1.0)) * (1.0 + 0.8 * uOceanStorm.x);   // choppier under storm cloud

  // Per-pixel normal: the same waves, plus a finer octave turned off each one.
  vec3 disp = vec3(0.0), nrm = vec3(0.0, 1.0, 0.0);
  float amp = 1e-3;
  for (int i = 0; i < OCEAN_WAVES; i++) {
    float k = uWave[i].z, a = uWave[i].w * atten;
    float q = uWaveQ / (k * uWave[i].w * float(OCEAN_WAVES));
    float th = waveTheta(i, base);
    gerstner(uWave[i].xy, k, a * (1.0 - smoothstep(0.8, 2.0, fwidth(th))), q, th, disp, nrm);
    amp += a;
    vec2 d2 = vec2(uWave[i].x * 0.62 - uWave[i].y * 0.78, uWave[i].x * 0.78 + uWave[i].y * 0.62);
    float k2 = k * 2.7;
    float th2 = k2 * dot(d2, base) - uWavePhase[i].x * 1.64 * uOceanTime + uWavePhase[i].y * 3.0;
    gerstner(d2, k2, a * 0.2 * chop * (1.0 - smoothstep(0.8, 2.0, fwidth(th2))), 0.0, th2, disp, nrm);
  }
  N = normalize(mat3(viewMatrix) * normalize(nrm));

  // Depth colour in hard steps: turquoise shallows to deep blue.
  float band = (toonStep(depth, uDepthBands.x) + toonStep(depth, uDepthBands.y) + toonStep(depth, uDepthBands.z)) / 3.0;
  albedo = mix(uShallow, uDeep, band);
  // Under storm cloud the sea turns grey-green (palette tints only: toward the storm grey and dark foliage).
  albedo = mix(albedo, mix(uStormGrey, uStormGreen, 0.35 + 0.3 * (1.0 - band)), uOceanStorm.x * 0.6);

  // Foam: a hard-edged line where the water meets the shore, wobbling with noise and
  // time, and a broken second line that rolls in from deeper water, swells and thins.
  float t = uOceanTime;
  float n = vnoise(base * 0.045 + vec2(t * 0.04, -t * 0.03));
  float edge = uFoam.x * (0.5 + n) * (0.85 + 0.15 * sin(t * 1.3 + n * 6.2831853));
  float foam = 1.0 - toonStep(depth, edge);
  float ph = fract(t * uFoam.z + n * 0.4);
  float ringW = uFoam.w * sin(ph * 3.1415927);
  float ring = 1.0 - toonStep(abs(depth - uFoam.y * (1.0 - ph)), ringW);
  ring *= toonStep(vnoise(base * 0.12 + 3.7), 0.36);
  // Whitecaps: once it blows hard, the highest crests break white in broken patches
  // drifting downwind, more of them the stronger the wind.
  float white = smoothstep(uOceanWind.z, uOceanWind.w, ws);
  float cap = 0.0;
  if (white > 0.0) {
    vec2 across = vec2(-uWindDir.y, uWindDir.x);   // flecks stretch across the wind, along the crests
    vec2 q = vec2(dot(base, across) * 0.22, dot(base, uWindDir) * 0.55) - vec2(0.0, uOceanTime * 0.6);
    float fleck = vnoise(q) * 0.7 + vnoise(q * 2.3 + 5.1) * 0.3;
    cap = toonStep(disp.y / amp, mix(0.8, 0.3, white)) * toonStep(fleck, mix(0.8, 0.58, white)) * shoal(depth) * shoal(depth)
      * (1.0 - smoothstep(uWhitecapFade.x, uWhitecapFade.y, length(vWorldPos.xz - cameraPosition.xz)));
  }
  oFoam = max(max(foam, ring), cap);
  albedo = mix(albedo, uFoamColor, oFoam);
  gloss *= 1.0 - oFoam;`;

const Ocean = {
  waveScale: 1,   // the weather can raise this for a rough sea

  init() {
    const O = CONFIG.ocean, P = Look.palette, S = Sky.uniforms;
    this.uniforms = {
      ...Heightfield.uniforms, ...Wind.uniforms,
      uOceanWind: { value: new THREE.Vector4(...O.chop, ...O.whitecaps) },
      uWhitecapFade: { value: new THREE.Vector2(...O.whitecapFade) },
      uWave: { value: Array.from({ length: O.waves }, () => new THREE.Vector4()) },
      uWavePhase: { value: Array.from({ length: O.waves }, () => new THREE.Vector2()) },
      uWaveQ: { value: O.steepness }, uWaveScale: { value: this.waveScale },
      uOceanStorm: { value: new THREE.Vector2() }, uStormGrey: { value: P.storm }, uStormGreen: { value: P.foliageDark },
      uOceanTime: { value: 0 }, uOceanLevel: { value: O.level }, uShoalDepth: { value: O.shoalDepth }, uOpenDepth: { value: O.openDepth },
      uOceanMesh: { value: new THREE.Vector2(O.nearStep, Math.PI * 2 / O.segments) },
      uShallow: { value: P.waterShallow }, uDeep: { value: P.waterDeep }, uFoamColor: { value: P.foam },
      uDepthBands: { value: new THREE.Vector3(...O.depthBands) },
      uFoam: { value: new THREE.Vector4(O.foamWidth, ...O.foamRing) },
      uSpec: { value: new THREE.Vector3(...O.specular) },
      uOceanLight: { value: new THREE.Vector4(O.wrap, ...O.reflect) },
      uOceanFade: { value: new THREE.Vector2(...O.fade) },
      uHorizon: S.uHorizon, uZenith: S.uZenith, uGlow: S.uGlow, uGradient: S.uGradient, uSunDir: S.uSunDir,
    };
    const material = Toon.material({
      gloss: O.gloss,
      uniforms: this.uniforms,
      vertexPars: OCEAN_COMMON_GLSL + '\nuniform vec2 uOceanMesh;   // near ring step, radians per spoke',
      vertexMain: OCEAN_VERTEX_MAIN,
      fragmentPars: OCEAN_COMMON_GLSL + SKY_NOISE_GLSL + WIND_GLSL + OCEAN_FRAGMENT_PARS,
      fragmentMain: OCEAN_FRAGMENT_MAIN,
      shade: 'oceanShade',
    });
    this.mesh = new THREE.Mesh(this.buildGeometry(), material);
    this.mesh.position.y = O.level;
    this.mesh.receiveShadow = true;
    this.mesh.name = 'ocean';
    scene.add(this.mesh);

    this.reseed(App.rng.fork('ocean'));
    App.on('seed', rng => this.reseed(rng.fork('ocean')));
    // Waves run on simulated time, so pausing or speeding up time does the same to the sea.
    Loop.onFrame((dt, time, alpha) => {
      this.uniforms.uOceanTime.value = Loop.simTime + alpha / CONFIG.simHz;
      this.uniforms.uWaveScale.value = this.waveScale;
      this.uniforms.uOceanStorm.value.x += (Atmosphere.stormK * Atmosphere.cover - this.uniforms.uOceanStorm.value.x) * Math.min(dt, 0.1);
    });
  },

  // Rings of vertices around the origin: nearStep apart out to nearRadius, then
  // spaced to match the distance between spokes, so cells stay roughly square.
  buildGeometry() {
    const O = CONFIG.ocean, seg = O.segments, radii = [0];
    while (radii.at(-1) < O.radius) {
      const r = radii.at(-1);
      radii.push(Math.min(O.radius, r + (r < O.nearRadius ? O.nearStep : r * Math.PI * 2 / seg)));
    }
    const pos = new Float32Array((1 + (radii.length - 1) * seg) * 3), index = [];
    let v = 3;   // vertex 0 is the centre
    for (let ri = 1; ri < radii.length; ri++) {
      for (let s = 0; s < seg; s++, v += 3) {
        const a = s / seg * Math.PI * 2;
        pos[v] = Math.cos(a) * radii[ri]; pos[v + 2] = -Math.sin(a) * radii[ri];
      }
    }
    const at = (ri, s) => ri === 0 ? 0 : 1 + (ri - 1) * seg + (s % seg);
    for (let s = 0; s < seg; s++) index.push(0, at(1, s), at(1, s + 1));
    for (let ri = 1; ri < radii.length - 1; ri++) {
      for (let s = 0; s < seg; s++) {
        const a = at(ri, s), b = at(ri, s + 1), c = at(ri + 1, s), d = at(ri + 1, s + 1);
        index.push(a, c, b, b, c, d);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const up = new Float32Array(pos.length);
    for (let i = 1; i < up.length; i += 3) up[i] = 1;
    geo.setAttribute('normal', new THREE.BufferAttribute(up, 3));
    geo.setIndex(index);
    geo.computeBoundingSphere();
    return geo;
  },

  // Seeded waves: a prevailing direction with the others scattered round it,
  // wavelengths spread geometrically from the longest to the shortest.
  reseed(rng) {
    const O = CONFIG.ocean, u = this.uniforms;
    const heading = rng.range(0, Math.PI * 2);
    for (let i = 0; i < O.waves; i++) {
      const f = O.waves > 1 ? i / (O.waves - 1) : 0;
      const len = O.wavelength[1] * Math.pow(O.wavelength[0] / O.wavelength[1], f) * rng.range(0.85, 1.15);
      const k = Math.PI * 2 / len;
      const a = heading + rng.gauss(0, O.spread * 0.5);
      u.uWave.value[i].set(Math.cos(a), Math.sin(a), k, len * O.amplitude * (1 - 0.35 * f));
      u.uWavePhase.value[i].set(Math.sqrt(9.8 * k) * O.speed, rng.range(0, Math.PI * 2));
    }
  },
};

// ── Tide: the sea's level ───────────────────────────────────────────────────
// The one value every system reads for sea level: the ocean mesh and its shader, water
// on the land (ground below it is the sea), the coast's erosion, the rain and snow.
// It rises and falls with a slow tide about CONFIG.ocean.level, so the beach and the
// reef are covered and uncovered over a cycle of a few minutes; on sim time, so it
// pauses and speeds up with everything else.
const Tide = {
  offset: 0,
  get level() { return CONFIG.ocean.level + this.offset; },
  init() {
    this.apply();
    Loop.onSim(() => this.apply());
  },
  apply() {
    const T = CONFIG.ocean.tide;
    this.offset = T[0] * Math.sin(Math.PI * 2 * Loop.simTime / T[1] + T[2]);
    const y = this.level;
    Ocean.mesh.position.y = y;
    Ocean.uniforms.uOceanLevel.value = y;
    Water.uniforms.uWaterGrid.value.y = y;
    if (Rain.particles) Rain.particles.uniforms.uRainEmit.value.z = y;
  },
};

// ── Shallow water: the pipe model ───────────────────────────────────────────
// Water on the land lives in the Heightfield's water layer (ground.b, depth in world
// units) and moves by the virtual-pipe model of Mei, Decaudin and Hu (2007): every
// cell has four outflow pipes to its neighbours; each step gravity pushes flow down
// the difference in water surface (ground + water), friction slows it, the outflow is
// scaled back so a cell never sends more than it holds, and each cell's depth changes
// by what flows in minus what flows out. Nothing is placed by hand: puddles are
// hollows that fill, streams are where the water gathers, and the river is where the
// biggest of them run on to the sea. The sea is not in the layer: ground below sea
// level holds the sea's level as its water surface, so water flows into it, and is
// then gone. The flux is the model's own working state (a ping-pong pair of grid
// targets, outflow toward −x, +x, −z, +z as depth per second); erosion reads it, and
// the velocity it implies, through WATER_GLSL and Water.uniforms.
//
// Once per sim step, before the flow, the cell's budget (WATER_BUDGET_GLSL):
//  · rain in, from the precipitation layer where it falls as rain (above about 1 °C)
//  · infiltration out, by material: fast into sand, slower into soil, barely into
//    bare rock, and less as the ground fills up (or freezes); what soaks in raises the
//    wetness layer, which then drains away and dries
//  · evaporation out, faster in warm air, in wind and in sunlight on the cell's slope

// Shared with any pass that reads the flow (erosion): the flux and the velocity.
const WATER_GLSL = /* glsl */`
uniform sampler2D uWaterFlux;   // outflow toward −x, +x, −z, +z, depth per second
uniform vec2 uWaterGrid;        // cell size (world units), sea level
// A cell's outflow; nothing flows across the grid's edge.
vec4 waterFlux(ivec2 c) {
  int n = int(uHeightGrid.y) - 1;
  return c.x < 0 || c.y < 0 || c.x > n || c.y > n ? vec4(0.0) : texelFetch(uWaterFlux, c, 0);
}
// Mean velocity of the water in cell c, world units per second along x and z.
vec2 waterVelocity(ivec2 c) {
  vec4 f = waterFlux(c);
  vec2 through = 0.5 * vec2(
    waterFlux(c - ivec2(1, 0)).y - f.x + f.y - waterFlux(c + ivec2(1, 0)).x,
    waterFlux(c - ivec2(0, 1)).w - f.z + f.w - waterFlux(c + ivec2(0, 1)).z);
  return through * uWaterGrid.x / max(layerCell(uLayerGround, c).b, 0.01);
}`;

// The height water at c stands at: ground plus water, or the sea's level over the sea.
const WATER_SURFACE_GLSL = /* glsl */`
float waterSurface(ivec2 c) {
  vec4 G = layerCell(uLayerGround, c);
  float g = G.r + G.g;
  return g < uWaterGrid.y ? uWaterGrid.y : g + G.b;
}`;

// Pass 1 of a flow step: new outflow from the surface differences.
const WATER_FLUX_GLSL = /* glsl */`
uniform sampler2D tFlux;
uniform vec4 uFlow;   // dt, gravity, friction per s, film depth
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 G = layerCell(uLayerGround, c);
  float g = G.r + G.g, d = G.b, dt = uFlow.x;
  if (g < uWaterGrid.y || d <= 0.0) { gl_FragColor = vec4(0.0); return; }   // the sea, and dry ground, send nothing
  if (layerCell(uLayerState, c).g < -0.5) { gl_FragColor = vec4(0.0); return; }   // frozen: ice stays put
  vec4 dh = (g + d) - vec4(waterSurface(c - ivec2(1, 0)), waterSurface(c + ivec2(1, 0)),
                           waterSurface(c - ivec2(0, 1)), waterSurface(c + ivec2(0, 1)));
  // Friction: a thin film drags on the ground far more than a deep channel does.
  float drag = exp(-dt * min(uFlow.z * (1.0 + uFlow.w / max(d, 1e-3)), 60.0));
  vec4 f = max(texelFetch(tFlux, c, 0) * drag + dt * uFlow.y * dh / uWaterGrid.x, 0.0);
  int n = int(uHeightGrid.y) - 1;
  if (c.x == 0) f.x = 0.0;
  if (c.x == n) f.y = 0.0;
  if (c.y == 0) f.z = 0.0;
  if (c.y == n) f.w = 0.0;
  // Never send more than the cell holds.
  float sent = (f.x + f.y + f.z + f.w) * dt;
  if (sent > d) f *= d / sent;
  gl_FragColor = f == f ? f : vec4(0.0);   // (NaN guard)
}`;

// Pass 2: depth changes by inflow minus outflow; water reaching the sea is gone.
const WATER_DEPTH_GLSL = /* glsl */`
uniform vec4 uFlow;
uniform float uWaterMax;
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 G = layerCell(uLayerGround, c), f = waterFlux(c);
  float inflow = waterFlux(c - ivec2(1, 0)).y + waterFlux(c + ivec2(1, 0)).x
               + waterFlux(c - ivec2(0, 1)).w + waterFlux(c + ivec2(0, 1)).z;
  float d = G.b + uFlow.x * (inflow - (f.x + f.y + f.z + f.w));
  d = G.r + G.g < uWaterGrid.y || !(d > 0.0) ? 0.0 : min(d, uWaterMax);   // the sea takes it; NaN or negative → dry
  gl_FragColor = vec4(G.rg, d, G.a);
}`;

// A cell's water budget per second, from its ground and state texels: rain arriving,
// water soaking in (at most what there is over dt), evaporation, and how much water
// the ground holds when saturated. Needs SKY_NOISE_GLSL and WIND_GLSL for the wind.
const WATER_BUDGET_GLSL = /* glsl */`
uniform vec4 uSoak;       // infiltration per second into sand, soil, rock; beach top height
uniform vec4 uHold;       // held per unit of sediment (sand, soil), held by rock, drain per s, rain wetting per mm/h per s
uniform vec4 uEvap;       // evaporation per s at 15 °C; wind that doubles it m/s; sun factor; relative humidity
uniform vec4 uWaterSun;   // direction to the sun, xyz; its strength through the cloud 0…1
uniform vec2 uWaterRain;  // depth per s per mm/h; dt (s)
struct WaterBudget { float rain, soak, evap, hold, liquid; };
WaterBudget waterBudget(ivec2 c, vec4 G, vec4 S) {
  WaterBudget b;
  float h = G.r + G.g, T = clamp(S.g, -40.0, 45.0), dt = uWaterRain.y;
  vec2 xz = (vec2(c) / (uHeightGrid.y - 1.0) - 0.5) * uHeightGrid.x;
  // Rain only where it falls as rain; snow below about 1 °C is the snow layer's.
  b.liquid = smoothstep(0.5, 1.5, T);
  b.rain = max(S.a, 0.0) * uWaterRain.x * b.liquid;
  // The ground: bare rock where the sediment is thin, sand on the beach, else soil.
  float rock = 1.0 - smoothstep(0.06, 0.35, G.g);
  float sand = (1.0 - smoothstep(uSoak.w, uSoak.w + 2.0, h)) * (1.0 - rock);
  float rate = mix(mix(uSoak.y, uSoak.x, sand), uSoak.z, rock);
  rate *= (1.0 - smoothstep(0.65, 1.0, S.r)) * mix(0.05, 1.0, smoothstep(-1.0, 0.5, T));   // full, or frozen
  float avail = G.b + b.rain * dt;
  b.soak = min(rate, avail / dt);
  b.hold = mix(uHold.x * clamp(G.g, 0.1, 2.0), uHold.y, rock);
  // Evaporation: as the air's capacity for vapour (Magnus) times how dry it is, raised
  // by wind and by sunlight striking the cell's slope; little from ice.
  float e = uEvap.x * exp(17.62 * T / (243.12 + T) - 17.62 * 15.0 / 258.12) * pow(max(1.0 - uEvap.w, 0.0) / 0.5, 1.5);
  float s = uHeightGrid.x / (uHeightGrid.y - 1.0);
  vec3 nrm = normalize(vec3(groundHeightCell(c - ivec2(1, 0)) - groundHeightCell(c + ivec2(1, 0)), 2.0 * s,
                            groundHeightCell(c - ivec2(0, 1)) - groundHeightCell(c + ivec2(0, 1))));
  e *= (1.0 + length(windAt(xz)) / uEvap.y) * (1.0 + uEvap.z * uWaterSun.w * max(dot(nrm, uWaterSun.xyz), 0.0));
  e *= mix(0.15, 1.0, smoothstep(-2.0, 1.0, T));
  b.evap = max(e, 0.0);
  return b;
}`;

// The sources pass (ground): rain in, infiltration and evaporation out, the sea dry.
const WATER_SOURCES_GLSL = /* glsl */`
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 G = layerCell(uLayerGround, c), S = layerCell(uLayerState, c);
  WaterBudget b = waterBudget(c, G, S);
  float dt = uWaterRain.y;
  float d = G.b + (b.rain - b.soak) * dt;
  d = max(d - min(b.evap * dt, d), 0.0);
  if (G.r + G.g < uWaterGrid.y || !(d > 0.0)) d = 0.0;
  gl_FragColor = vec4(G.rg, d, G.a);
}`;

// The wetness pass (state): the same budget, from the ground as it was before the
// sources pass, so what soaked in there is exactly what wets the ground here. The
// wetness is how full the ground is: soaking fills it, rain wets the surface, standing
// water keeps it wet; it drains and dries in proportion to how wet it is. Drying is
// faster where the neighbours are already drier (an edge of the wet patch), so a patch
// shrinks from its edges inward rather than fading all at once, and slower in hollows.
const WATER_WETNESS_GLSL = /* glsl */`
uniform sampler2D tGroundBefore;
uniform float uWaterDraw;
uniform vec2 uDry;        // edge speed-up, hollow slow-down
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 G = texelFetch(tGroundBefore, c, 0), S = layerCell(uLayerState, c);
  WaterBudget b = waterBudget(c, G, S);
  float dt = uWaterRain.y, m = S.r;
  // The driest neighbour, diagonals counted for less, so a front spreads round, not square;
  // noise varies its pace so receding patches keep ragged edges.
  float mn = min(min(layerCell(uLayerState, c - ivec2(1, 0)).r, layerCell(uLayerState, c + ivec2(1, 0)).r),
                 min(layerCell(uLayerState, c - ivec2(0, 1)).r, layerCell(uLayerState, c + ivec2(0, 1)).r));
  float md = min(min(layerCell(uLayerState, c + ivec2(-1, -1)).r, layerCell(uLayerState, c + ivec2(1, -1)).r),
                 min(layerCell(uLayerState, c + ivec2(-1, 1)).r, layerCell(uLayerState, c + ivec2(1, 1)).r));
  float edge = max(m - mn, 0.6 * (m - md)) / max(m, 0.05);
  edge = clamp(edge, 0.0, 1.0) * (0.4 + 1.2 * vnoise(vec2(c) * 0.11));
  float around = 0.25 * (groundHeightCell(c - ivec2(1, 0)) + groundHeightCell(c + ivec2(1, 0))
                       + groundHeightCell(c - ivec2(0, 1)) + groundHeightCell(c + ivec2(0, 1)));
  float hollow = smoothstep(0.0, 0.25, around - G.r - G.g);
  float dry = (1.0 + uDry.x * edge * (1.0 - smoothstep(0.05, 1.0, S.a))) * (1.0 - uDry.y * hollow);   // edges only once the rain stops
  m += dt * (b.soak / b.hold + uHold.w * S.a * b.liquid * (1.0 - m));
  m -= dt * m * (uHold.z + b.evap / b.hold) * dry;
  m = max(m, 0.65 * smoothstep(0.0, uWaterDraw, G.b));               // under standing water
  m = max(m, 1.0 - smoothstep(-0.3, 0.9, G.r + G.g));                // the sea's edge is always wet
  gl_FragColor = vec4(clamp(m == m ? m : 0.0, 0.0, 1.0), S.gba);
}`;

// ── Wet surfaces ──
// A shade function (Toon.material's `shade` hook) for anything the water wets: the
// toon bands, then the sky mirrored in it and the sun's highlight, both in hard bands.
// fragmentMain sets wetSheen (0 dry … 1 open water: a less mirror-like surface
// catches the sky only at grazing angles, and faintly) and gloss. The sky colour is the
// dome's own (its banded gradient and sunset fan), along the reflected view, so a
// puddle shows the sky above it. Water.init plugs in the sky's uniforms.
const WET_SHADE_GLSL = /* glsl */`
uniform vec3 uHorizon, uZenith, uGlow, uGradient, uSunDir;   // the sky's, shared
uniform float uCloudCover;
uniform vec4 uWetSky;     // share at normal incidence, fresnel band 1, band 2, strength
uniform vec4 uWetSpec;    // sharpness, band 1, band 2, strength
float wetSheen = 0.0;
vec3 skyAlong(vec3 d) {
  float t = pow(clamp(d.y, 0.0, 1.0), 0.5);
  t = mix(t, floor(t * uGradient.x + 0.5) / uGradient.x, uGradient.y);
  vec3 col = mix(uHorizon, uZenith, t);
  float toward = dot(normalize(d.xz + 1e-5), normalize(uSunDir.xz + 1e-5)) * 0.5 + 0.5;
  float glow = uGradient.z * toward * toward * (1.0 - smoothstep(0.0, 0.45, max(d.y, 0.0)));
  return mix(col, uGlow, floor(glow * 4.0 + 0.5) / 4.0);
}
vec3 wetShade(vec3 albedo, vec3 N, vec3 V, float gloss) {
  vec3 col = toonShade(albedo, N, V, 0.0);
  vec3 R = reflect(-inverseTransformDirection(V, viewMatrix), inverseTransformDirection(N, viewMatrix));
  float f = (uWetSky.x + (1.0 - uWetSky.x) * pow(1.0 - max(dot(N, V), 0.0), 2.0)) * wetSheen;
  col = mix(col, skyAlong(R), (0.5 * toonStep(f, uWetSky.y) + 0.5 * toonStep(f, uWetSky.z)) * uWetSky.w * wetSheen);
  vec3 spec = vec3(0.0);
  #if NUM_DIR_LIGHTS > 0
    DirectionalLight dl;
    #if defined( USE_SHADOWMAP ) && NUM_DIR_LIGHT_SHADOWS > 0
      DirectionalLightShadow dls;
    #endif
    #pragma unroll_loop_start
    for (int i = 0; i < NUM_DIR_LIGHTS; i++) {
      dl = directionalLights[ i ];
      float sh = 1.0;
      #if defined( USE_SHADOWMAP ) && ( UNROLLED_LOOP_INDEX < NUM_DIR_LIGHT_SHADOWS )
        dls = directionalLightShadows[ i ];
        sh = receiveShadow ? getShadow( directionalShadowMap[ i ], dls.shadowMapSize, dls.shadowIntensity, dls.shadowBias, dls.shadowRadius, vDirectionalShadowCoord[ i ] ) : 1.0;
      #endif
      float s = pow(max(dot(N, normalize(dl.direction + V)), 0.0), mix(40.0, uWetSpec.x, gloss)) * sh * gloss;
      spec += dl.color * (0.4 * toonStep(s, uWetSpec.y) + 0.6 * toonStep(s, uWetSpec.z));
    }
    #pragma unroll_loop_end
  #endif
  return col + spec * uWetSpec.w * (1.0 - 0.85 * uCloudCover);   // a hazy sun under cloud makes no glint
}`;

const WET_UNIFORMS = () => {
  const W = CONFIG.water;
  return { uWetSky: { value: new THREE.Vector4(...W.sky) }, uWetSpec: { value: new THREE.Vector4(...W.spec) } };
};

const Water = {
  init() {
    const W = CONFIG.water, H = Heightfield;
    this.flux = { read: H.makeTarget(), write: H.makeTarget() };
    this.uniforms = {
      uWaterFlux: { value: this.flux.read.texture },
      uWaterGrid: { value: new THREE.Vector2(H.cell, CONFIG.ocean.level) },
    };
    const budget = {
      ...Wind.uniforms, ...this.uniforms,
      uSoak: { value: new THREE.Vector4(...W.soak, CONFIG.terrain.beachTop) },
      uHold: { value: new THREE.Vector4(...W.hold, W.drain, W.surfaceWet) },
      uEvap: { value: new THREE.Vector4(W.evaporate, W.evapWind, W.evapSun, 0.6) },
      uWaterSun: { value: new THREE.Vector4() },
      uWaterRain: { value: new THREE.Vector2(W.rainGain, 1 / CONFIG.simHz) },
    };
    this.budget = budget;
    const pre = SKY_NOISE_GLSL + WIND_GLSL + WATER_GLSL + WATER_SURFACE_GLSL;
    const flow = { uFlow: { value: new THREE.Vector4(0, W.gravity, W.friction, W.film) } };
    this.sources = H.passMaterial(pre + WATER_BUDGET_GLSL + WATER_SOURCES_GLSL, budget);
    this.wetness = H.passMaterial(pre + WATER_BUDGET_GLSL + WATER_WETNESS_GLSL, {
      ...budget, tGroundBefore: { value: null }, uWaterDraw: { value: W.draw },
      uDry: { value: new THREE.Vector2(W.dryEdge, W.dryHollow) },
    });
    this.fluxPass = H.passMaterial(pre + WATER_FLUX_GLSL, { ...this.uniforms, ...flow, tFlux: { value: this.flux.read.texture } });
    this.depthPass = H.passMaterial(pre + WATER_DEPTH_GLSL, { ...this.uniforms, ...flow, uWaterMax: { value: W.maxDepth } });
    this.clear = H.passMaterial('void main() { gl_FragColor = vec4(0.0); }');
    this.reset();
    App.on('seed', () => this.reset());   // the new island's water layer starts dry
    this.mesh = this.buildMesh();
    scene.add(this.mesh);
    // The wet surfaces mirror the sky, so they share its uniforms (the terrain is built before the sky).
    const S = Sky.uniforms;
    for (const m of [Terrain.mesh.material, this.mesh.material])
      Object.assign(m.uniforms, { uHorizon: S.uHorizon, uZenith: S.uZenith, uGlow: S.uGlow, uGradient: S.uGradient, uSunDir: S.uSunDir, uCloudCover: S.uCloudCover });
    Loop.onSim(dt => this.step(dt));
  },

  reset() { for (const t of [this.flux.read, this.flux.write]) Heightfield.render(this.clear, t); },

  step(dt) {
    const H = Heightfield, A = Atmosphere, b = this.budget, W = CONFIG.water;
    // The sun on the land, through the cloud (none at night).
    const sunK = THREE.MathUtils.smoothstep(Celestial.sunDir.y, -0.02, 0.25) * (1 - 0.8 * A.cover);
    b.uWaterSun.value.set(Celestial.sunDir.x, Celestial.sunDir.y, Celestial.sunDir.z, sunK);
    b.uEvap.value.w = A.humidity;
    b.uWaterRain.value.y = dt;
    H.step('ground', this.sources);
    this.wetness.uniforms.tGroundBefore.value = H.gpu.ground.write.texture;   // the ground before that pass
    H.step('state', this.wetness);
    // The flow, in substeps: the 'simSteps' lever trades accuracy, never how far it flows.
    const n = Quality.get('simSteps'), sub = dt * W.speed / n;
    this.fluxPass.uniforms.uFlow.value.x = this.depthPass.uniforms.uFlow.value.x = sub;
    for (let i = 0; i < n; i++) {
      this.fluxPass.uniforms.tFlux.value = this.flux.read.texture;
      H.render(this.fluxPass, this.flux.write);
      [this.flux.read, this.flux.write] = [this.flux.write, this.flux.read];
      this.uniforms.uWaterFlux.value = this.flux.read.texture;
      H.step('ground', this.depthPass);
    }
  },

  // ── The water surface ──
  // A grid mesh like the terrain's, one vertex per cell: wet cells lift to the water's
  // surface, dry ones sink just under the ground, so each puddle and stream ends at a
  // clean waterline where its surface meets the slope. Water too thin to draw is left
  // to the wetness layer. Colour steps with depth: a muddy film, then turquoise
  // shallows, then deep blue in the river's pools, with a pale line at the edge.
  buildMesh() {
    const H = Heightfield, P = Look.palette, W = CONFIG.water;
    const geo = new THREE.PlaneGeometry(H.size, H.size, H.res - 1, H.res - 1);
    geo.rotateX(-Math.PI / 2);
    const mat = Toon.material({
      gloss: 1,
      shade: 'wetShade',
      uniforms: {
        ...H.uniforms, ...this.uniforms, ...WET_UNIFORMS(),
        uWaterDraw: { value: new THREE.Vector3(W.draw, 0.02, 0.3) },
        uWaterBands: { value: new THREE.Vector3(...W.depthBands) },
        p_waterShallow: { value: P.waterShallow }, p_waterDeep: { value: P.waterDeep }, p_soil: { value: P.soil }, p_foam: { value: P.foam },
        p_ice: { value: P.ice }, p_snow: { value: P.snow },
      },
      vertexPars: HEIGHTFIELD_GLSL + WATER_GLSL + WATER_SURFACE_GLSL + '\nuniform vec3 uWaterDraw;   // least depth drawn, lift, sink below dry ground',
      vertexMain: /* glsl */`
  ivec2 tCell = ivec2(floor((position.xz / uHeightGrid.x + 0.5) * (uHeightGrid.y - 1.0) + 0.5));
  vec4 G = layerCell(uLayerGround, tCell);
  float g = G.r + G.g;
  bool wet = G.b > uWaterDraw.x && g >= uWaterGrid.y;
  transformed.y = wet ? g + G.b + uWaterDraw.y : g - uWaterDraw.z;
  objectNormal = normalize(vec3(
    waterSurface(tCell - ivec2(1, 0)) - waterSurface(tCell + ivec2(1, 0)), 2.0 * uWaterGrid.x,
    waterSurface(tCell - ivec2(0, 1)) - waterSurface(tCell + ivec2(0, 1))));`,
      fragmentPars: HEIGHTFIELD_GLSL + SKY_NOISE_GLSL + WET_SHADE_GLSL + /* glsl */`
uniform vec3 uWaterBands;
uniform vec3 p_waterShallow, p_waterDeep, p_soil, p_foam, p_ice, p_snow;`,
      fragmentMain: /* glsl */`
  inked = false;   // a waterline, not an ink line
  float depth = vWorldPos.y - groundHeight(vWorldPos.xz);
  if (depth < 0.0) discard;   // the sunk dry edge of the mesh, wherever it would show through
  vec3 mid = mix(p_waterShallow, p_waterDeep, 0.5);
  albedo = mix(mix(p_waterShallow, p_soil, 0.45), p_waterShallow, toonStep(depth, uWaterBands.x));
  albedo = mix(albedo, mid, toonStep(depth, uWaterBands.y));
  albedo = mix(albedo, p_waterDeep, toonStep(depth, uWaterBands.z));
  float edge = 1.0 - toonStep(depth, 0.025);
  albedo = mix(albedo, p_foam, edge * 0.55);
  gloss *= 1.0 - edge;
  wetSheen = 1.0 - edge;
  // Below freezing it is ice: pale, glossy, a mirror, with whiter cracks of frost.
  float T = layerAt(uLayerState, vWorldPos.xz).g;
  if (T < -0.3) {
    float crack = toonStep(abs(vnoise(vWorldPos.xz * 0.7) - 0.5), 0.47);
    albedo = mix(mix(p_ice, p_snow, 0.15), p_snow, 0.5 * crack + 0.4 * edge);
    gloss = 1.0;
    wetSheen = 0.85 * (1.0 - crack);
  }`,
    });
    mat.polygonOffset = true;          // a constant nudge toward the camera; a slope-scaled one would lift the sunk edges through steep ground
    mat.polygonOffsetUnits = -4;
    const mesh = new THREE.Mesh(geo, mat);
    mesh.frustumCulled = false;
    mesh.receiveShadow = true;
    mesh.name = 'land-water';
    return mesh;
  },

  // Totals over the CPU mirror (after a readback), for checks: water volume on the land,
  // wet cells, and the deepest cell.
  stats() {
    const H = Heightfield, n = H.res * H.res, a = H.cell * H.cell;
    let volume = 0, wet = 0, deepest = 0;
    for (let k = 0; k < n; k++) {
      const d = H.get('water', k);
      volume += d * a;
      if (d > CONFIG.water.draw) wet++;
      deepest = Math.max(deepest, d);
    }
    return { volume, wet, deepest };
  },
};

// ── Rain ────────────────────────────────────────────────────────────────────
// A GpuParticles pool (see RENDERING). A free drop tries a spot in a box over the
// part of the island in view each sim step and starts there, high up, as often as
// the precipitation layer says it rains there as rain (so the rain shadow and a
// front's edge show in the streaks). It starts upwind of that spot by its slant, so
// it lands near it. It falls at a steady speed, carried sideways by the wind at its
// height (windSlant, gusts included), and where it meets the ground, standing water
// or the sea it turns into a splash: a ring spreading on the surface, wider on water.
// Streaks are drawn along their motion, lit by the shadow band and the sky, brighter
// toward the sun (light scattered forward through the drops), and white in a
// lightning flash (Look.uniforms.uFlash).
// The state: x, y (world height), z, and kind · 8192 + the step it started or
// splashed at (w < 0: free). Kind 0 is falling, 1 a splash on the ground, 2 on water.
const RAIN_COMMON_GLSL = /* glsl */`
uniform vec4 uRainFall;   // fall units/s, rain fall speed m/s (for the slant), sim steps per second, splash seconds
float rainKind(vec4 s) { return floor(s.w / 8192.0); }
float rainBorn(vec4 s) { return mod(s.w, 8192.0); }
float rainAge(vec4 s) { return mod(uParticleStep - rainBorn(s), 8192.0) / uRainFall.z; }
// Sideways motion per unit of fall, eased off toward about 56° from the vertical
// (a storm's true slant would draw its rain nearly flat across the view).
vec2 rainSlant(vec2 xz) {
  vec2 sl = windSlant(xz, uRainFall.y);
  float l = length(sl);
  return l > 1e-4 ? sl * (1.5 * tanh(l / 1.5) / l) : sl;
}`;

const RAIN_STEP_GLSL = /* glsl */`
uniform vec4 uRainBox;    // centre x, z; half-width; start height above the ground
uniform vec3 uRainEmit;   // chance per step at heavy rain, heavy mm/h, sea level
// The height a falling drop stops at, and whether that is water.
float rainSurface(vec2 xz, out bool water) {
  vec4 G = layerAt(uLayerGround, xz);
  float g = G.r + G.g;
  water = g < uRainEmit.z || G.b > 0.03;
  return max(g + G.b + G.a, uRainEmit.z);
}
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  float id = particleId(c);
  vec4 s = texelFetch(tState, c, 0);
  bool water;
  if (s.w < 0.0) {
    vec4 r = particleRand(id, uParticleStep, 1u);
    vec2 land = uRainBox.xy + (r.xy * 2.0 - 1.0) * uRainBox.z;
    vec4 S = layerAt(uLayerState, land);
    float chance = uRainEmit.x * pow(clamp(S.a / uRainEmit.y, 0.0, 1.5), 1.5) * smoothstep(0.5, 1.5, S.g);
    if (r.z >= chance) { gl_FragColor = vec4(0.0, 0.0, 0.0, -1.0); return; }
    float drop = uRainBox.w * (0.75 + 0.5 * r.w);
    vec2 xz = land - rainSlant(land) * drop;
    gl_FragColor = vec4(xz.x, rainSurface(land, water) + drop, xz.y, uParticleStep);
    return;
  }
  float kind = rainKind(s);
  if (kind > 0.5) {   // a splash: gone once it has spread
    gl_FragColor = rainAge(s) + 1.0 / uRainFall.z > uRainFall.w ? vec4(0.0, 0.0, 0.0, -1.0) : s;
    return;
  }
  float dt = 1.0 / uRainFall.z;
  vec2 sl = rainSlant(s.xz);
  vec3 p = s.xyz + vec3(sl.x, -1.0, sl.y) * uRainFall.x * dt;
  float surf = rainSurface(p.xz, water);
  if (p.y <= surf) { gl_FragColor = vec4(p.x, surf, p.z, (water ? 2.0 : 1.0) * 8192.0 + uParticleStep); return; }
  vec2 off = abs(p.xz - uRainBox.xy);
  gl_FragColor = max(off.x, off.y) > 1.6 * uRainBox.z ? vec4(0.0, 0.0, 0.0, -1.0) : vec4(p, s.w);
}`;

// A falling drop is a quad stretched over the last streak seconds of its fall
// (extrapolated from the last sim step, so it moves smoothly between steps); a splash
// is a flat ring on the surface, on the waves at sea.
const RAIN_DRAW_VERTEX = /* glsl */`
attribute vec2 aCell;
uniform vec4 uRainDraw;    // seconds since the last sim step, streak seconds, world width, fewest pixels
uniform vec3 uRainSplash;  // ring radius on the ground, on water; ring growth power
uniform vec2 uRainView;    // drawing buffer size, pixels
uniform vec3 uRainAlbedo, uSunLight, uSunToward, uShadowTint, uSkyColor, uFlashColor;
uniform float uSkyBounce, uRainCover;
uniform vec4 uFlash;
varying vec3 vRainColor;
varying float vRainAlpha;
varying vec3 vRainRing;    // ring coordinates (x, y in −1…1), 1 for a splash
void main() {
  vec4 s = texelFetch(tState, ivec2(aCell), 0);
  vRainAlpha = 0.0;
  vRainColor = vec3(0.0);
  vRainRing = vec3(0.0);
  gl_Position = vec4(0.0, 0.0, 2.0, 1.0);   // free: beyond the far plane, so nothing is drawn
  if (s.w < 0.0) return;
  float kind = rainKind(s), age = rainAge(s) + uRainDraw.x;
  vec2 res = 0.5 * uRainView;
  vec3 at;
  if (kind < 0.5) {
    vec2 sl = rainSlant(s.xz);
    vec3 v = vec3(sl.x, -1.0, sl.y) * uRainFall.x;
    vec3 head = s.xyz + v * uRainDraw.x, tail = head - v * uRainDraw.y;
    vec4 ch = projectionMatrix * viewMatrix * vec4(head, 1.0), ct = projectionMatrix * viewMatrix * vec4(tail, 1.0);
    if (ch.w < 1.0 || ct.w < 1.0) return;
    vec2 A = ct.xy / ct.w * res, B = ch.xy / ch.w * res, d = B - A;
    float L = length(d);
    vec2 t = L > 1e-3 ? d / L : vec2(0.0, 1.0);
    float px = uRainDraw.z * projectionMatrix[1][1] * res.y / ch.w;
    float wpx = clamp(px, uRainDraw.w, 2.0 * uRainDraw.w);   // hairlines, even right in front of the camera
    vec2 P = mix(A, B, position.x) + vec2(-t.y, t.x) * position.y * wpx * 0.5;
    gl_Position = vec4(P / res * ch.w, ch.z, ch.w);
    // Fainter once thinner than a pixel, and close to the lens, where a drop would be a blur.
    vRainAlpha = 0.3 * clamp(px / uRainDraw.w, 0.3, 1.0) * smoothstep(0.0, 0.15, age) * smoothstep(12.0, 45.0, ch.w);
    at = head;
  } else {
    // Splash: a ring that spreads fast and fades, flat on the surface.
    float k = clamp(age / uRainFall.w, 0.0, 1.0);
    float R = (kind > 1.5 ? uRainSplash.y : uRainSplash.x) * (0.25 + 0.75 * pow(k, uRainSplash.z));
    vec2 q = vec2(position.x * 2.0 - 1.0, position.y);
    float y = layerAt(uLayerGround, s.xz).r + layerAt(uLayerGround, s.xz).g < uOceanLevel ? seaHeight(s.xz) : s.y;
    at = vec3(s.x + q.x * R, y + 0.08, s.z + q.y * R);
    gl_Position = projectionMatrix * viewMatrix * vec4(at, 1.0);
    vRainRing = vec3(q, 1.0);
    vRainAlpha = 0.8 * (1.0 - k * k);
  }
  // Light: the shadow band with the sky in it; the sun or moon through the cloud, and
  // brighter looking toward it; a lightning flash nearby.
  vec3 view = normalize(at - cameraPosition);
  float toward = max(dot(view, uSunToward), 0.0);
  float glint = smoothstep(0.55, 0.6, toward) * 0.5 + smoothstep(0.85, 0.9, toward) * 0.5;
  vec3 col = uRainAlbedo * (uShadowTint + uSkyColor * uSkyBounce);
  col = max(col, uRainAlbedo * uSunLight * (0.55 - 0.4 * uRainCover));
  col += uSunLight * glint * (0.7 - 0.5 * uRainCover);
  if (kind > 0.5) col = mix(col, uRainAlbedo, 0.5);   // splashes: white water, brighter than the streaks
  float flash = uFlash.w / (1.0 + dot(at - uFlash.xyz, at - uFlash.xyz) / 90000.0);
  vRainColor = mix(col, uFlashColor, clamp(flash, 0.0, 1.0));
  vRainAlpha *= 1.0 + flash;
}`;

const RAIN_DRAW_FRAGMENT = /* glsl */`
layout(location = 1) out highp vec4 gNormal;
varying vec3 vRainColor;
varying float vRainAlpha;
varying vec3 vRainRing;
void main() {
  float a = vRainAlpha;
  if (vRainRing.z > 0.5) {
    float r = length(vRainRing.xy);
    a *= step(0.72, r) * step(r, 1.0);   // a hard-edged ring
  }
  if (a < 0.01) discard;
  gl_FragColor = vec4(vRainColor, min(a, 1.0));
  gNormal = vec4(0.5, 0.5, 1.0, 0.0);
}`;

const Rain = {
  init() {
    const R = CONFIG.rain, P = Look.palette, L = Look.uniforms;
    const fall = { uRainFall: { value: new THREE.Vector4(R.fall, CONFIG.wind.fall.rain, CONFIG.simHz, R.splash[0]) } };
    this.particles = new GpuParticles(R.size, SKY_NOISE_GLSL + WIND_GLSL + RAIN_COMMON_GLSL + RAIN_STEP_GLSL, {
      ...Wind.uniforms, ...fall,
      uRainBox: { value: new THREE.Vector4(0, 0, 200, R.top) },
      uRainEmit: { value: new THREE.Vector3(R.emit, R.heavy, CONFIG.ocean.level) },
    });
    this.sunToward = new THREE.Vector3();
    this.uniforms = {
      ...Ocean.uniforms, ...this.particles.uniforms,
      uRainDraw: { value: new THREE.Vector4(0, R.streak, ...R.width) },
      uRainSplash: { value: new THREE.Vector3(R.splash[1], R.splash[2], 0.5) },
      uRainView: { value: Post.size },
      uRainAlbedo: { value: new THREE.Color().copy(P.skyHorizon).lerp(P.cloud, 0.5) },
      uSunLight: { value: sun.color }, uSunToward: { value: this.sunToward },
      uShadowTint: L.uShadowTint, uSkyColor: L.uSkyColor, uSkyBounce: L.uSkyBounce,
      uFlash: L.uFlash, uFlashColor: { value: P.flash }, uRainCover: { value: 0 },
    };
    const material = new THREE.ShaderMaterial({
      uniforms: this.uniforms,
      vertexShader: OCEAN_COMMON_GLSL + SKY_NOISE_GLSL + WIND_GLSL + GPU_PARTICLE_GLSL + RAIN_COMMON_GLSL + RAIN_DRAW_VERTEX,
      fragmentShader: RAIN_DRAW_FRAGMENT,
      transparent: true, depthWrite: false,
      side: THREE.DoubleSide,   // splash rings lie flat, so either face may be toward the camera
    });
    material.userData.gbuffer = true;
    this.geometry = this.particles.geometry();
    this.mesh = new THREE.Mesh(this.geometry, material);
    this.mesh.frustumCulled = false;
    this.mesh.name = 'rain';
    scene.add(this.mesh);
    Quality.on('particles', f => { this.geometry.instanceCount = Math.floor(this.particles.count * f); });

    this.reseed(App.rng);
    App.on('seed', rng => this.reseed(rng));
    Loop.onSim(() => {
      // The box follows the view: the ground round the camera's target, wider zoomed out.
      const [share, lo, hi] = CONFIG.rain.area, t = CameraRig.target;
      this.particles.uniforms.uRainBox.value.set(t.x, t.z, THREE.MathUtils.clamp(CameraRig.cur.dist * share, lo, hi), CONFIG.rain.top);
      this.particles.step();
    });
    Loop.onFrame((dt, time, alpha) => {
      this.uniforms.uRainDraw.value.x = alpha / CONFIG.simHz;
      this.sunToward.copy(sun.position).sub(sun.target.position).normalize();
      this.uniforms.uRainCover.value = Atmosphere.cover;
    });
  },

  reseed(rng) { this.particles.reset(rng.fork('rain').int(0, 65535)); },
};

// ── Spray ───────────────────────────────────────────────────────────────────
// In strong wind, spray and mist tear off the wave crests and blow downwind onto the
// shore: a GpuParticles pool. A free particle tries a spot over the sea in the box
// round the view, most often in the surf over the shallows and the reef, as often as
// the local wind is past the spray threshold. Spray (kind 0) is thrown up and falls
// back as it flies; mist (kind 1) is bigger, fainter, rises and lasts longer. Either
// one that reaches the shore skims over the ground until it is spent.
const SPRAY_COMMON_GLSL = /* glsl */`
uniform vec4 uSprayMove;   // units/s per m/s of wind, spray throw-up units/s, gravity units/s², sim steps per second
uniform vec2 uSprayLife;   // seconds: spray, mist
float sprayKind(vec4 s) { return floor(s.w / 8192.0); }
float sprayAge(vec4 s) { return mod(uParticleStep - mod(s.w, 8192.0), 8192.0) / uSprayMove.w; }
float sprayLife(float kind, float id) { return (kind < 0.5 ? uSprayLife.x : uSprayLife.y) * (0.7 + 0.6 * fract(id * 0.618)); }`;

const SPRAY_STEP_GLSL = /* glsl */`
uniform vec4 uSprayBox;    // centre x, z; half-width; sea level
uniform vec3 uSprayEmit;   // chance per step at full, local wind where it starts, where it is full
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  float id = particleId(c), dt = 1.0 / uSprayMove.w;
  vec4 s = texelFetch(tState, c, 0), FREE = vec4(0.0, 0.0, 0.0, -1.0);
  if (s.w < 0.0) {
    vec4 r = particleRand(id, uParticleStep, 5u);
    vec2 xz = uSprayBox.xy + (r.xy * 2.0 - 1.0) * uSprayBox.z;
    vec4 G = layerAt(uLayerGround, xz);
    float depth = uSprayBox.w - G.r - G.g;
    if (depth < 0.2) { gl_FragColor = FREE; return; }
    float surf = mix(0.35, 1.0, 1.0 - smoothstep(1.0, 8.0, depth));   // the surf over the shallows throws most
    float chance = uSprayEmit.x * smoothstep(uSprayEmit.y, uSprayEmit.z, length(windAt(xz))) * surf;
    if (r.z >= chance) { gl_FragColor = FREE; return; }
    gl_FragColor = vec4(xz.x, uSprayBox.w + 0.4, xz.y, (r.w < 0.3 ? 1.0 : 0.0) * 8192.0 + uParticleStep);
    return;
  }
  float kind = sprayKind(s), age = sprayAge(s);
  if (age > sprayLife(kind, id)) { gl_FragColor = FREE; return; }
  vec2 w = windAt(s.xz) * uSprayMove.x * (kind < 0.5 ? 0.8 : 0.55);
  float vy = kind < 0.5 ? uSprayMove.y - uSprayMove.z * age : 0.9;
  vec3 p = s.xyz + vec3(w.x, vy, w.y) * dt;
  vec4 G = layerAt(uLayerGround, p.xz);
  float floorY = max(G.r + G.g + G.a, uSprayBox.w) + 0.25;
  p.y = max(p.y, floorY);   // over the shore it skims the ground
  gl_FragColor = vec4(p, s.w);
}`;

const SPRAY_DRAW_VERTEX = /* glsl */`
attribute vec2 aCell;
uniform vec4 uSprayDraw;   // seconds since the last sim step, spray size, mist size, fewest pixels
uniform vec2 uSprayView;
uniform vec3 uSprayColor, uSunLight, uShadowTint, uSkyColor;
uniform float uSkyBounce;
varying vec3 vSprayColor;
varying float vSprayAlpha;
varying vec2 vSprayUV;
void main() {
  vec4 s = texelFetch(tState, ivec2(aCell), 0);
  vSprayAlpha = 0.0; vSprayColor = vec3(0.0); vSprayUV = vec2(0.0);
  gl_Position = vec4(0.0, 0.0, 2.0, 1.0);
  if (s.w < 0.0) return;
  float id = particleId(ivec2(aCell)), kind = sprayKind(s), age = sprayAge(s) + uSprayDraw.x, life = sprayLife(kind, id);
  vec2 w = windAt(s.xz) * uSprayMove.x * (kind < 0.5 ? 0.8 : 0.55);
  vec3 at = s.xyz + vec3(w.x, 0.0, w.y) * uSprayDraw.x;
  vec4 cp = projectionMatrix * viewMatrix * vec4(at, 1.0);
  if (cp.w < 1.0) return;
  vec2 res = 0.5 * uSprayView;
  float grow = kind < 0.5 ? 1.0 : 0.6 + 0.8 * age / life;
  float px = (kind < 0.5 ? uSprayDraw.y : uSprayDraw.z) * grow * projectionMatrix[1][1] * res.y / cp.w;
  vSprayUV = vec2(position.x * 2.0 - 1.0, position.y);
  gl_Position = cp + vec4(vSprayUV * max(px, uSprayDraw.w) / res * cp.w, 0.0, 0.0);
  float k = age / life;
  vSprayAlpha = (kind < 0.5 ? 0.7 : 0.1) * smoothstep(0.0, 0.1, k) * (1.0 - smoothstep(0.6, 1.0, k)) * smoothstep(15.0, 50.0, cp.w);
  vSprayColor = max(uSprayColor * (uShadowTint + uSkyColor * uSkyBounce), uSprayColor * uSunLight * 0.8);
}`;

const SPRAY_DRAW_FRAGMENT = /* glsl */`
varying vec3 vSprayColor;
varying float vSprayAlpha;
varying vec2 vSprayUV;
void main() {
  float r = dot(vSprayUV, vSprayUV);
  if (vSprayAlpha < 0.01 || r > 1.0) discard;
  gl_FragColor = vec4(vSprayColor, vSprayAlpha * (1.0 - 0.5 * r));
}`;

const Spray = {
  init() {
    const C = CONFIG.spray, P = Look.palette, L = Look.uniforms;
    const move = { uSprayMove: { value: new THREE.Vector4(C.drift, C.throw, C.gravity, CONFIG.simHz) }, uSprayLife: { value: new THREE.Vector2(...C.life) } };
    this.particles = new GpuParticles(C.size, SKY_NOISE_GLSL + WIND_GLSL + SPRAY_COMMON_GLSL + SPRAY_STEP_GLSL, {
      ...Wind.uniforms, ...move,
      uSprayBox: { value: new THREE.Vector4(0, 0, 200, 0) },
      uSprayEmit: { value: new THREE.Vector3(C.emit, ...C.wind) },
    });
    const material = new THREE.ShaderMaterial({
      uniforms: {
        ...this.particles.uniforms,
        uSprayDraw: { value: new THREE.Vector4(0, ...C.sizes, C.minPx) }, uSprayView: { value: Post.size },
        uSprayColor: { value: P.foam }, uSunLight: { value: sun.color },
        uShadowTint: L.uShadowTint, uSkyColor: L.uSkyColor, uSkyBounce: L.uSkyBounce,
      },
      vertexShader: SKY_NOISE_GLSL + WIND_GLSL + GPU_PARTICLE_GLSL + SPRAY_COMMON_GLSL + SPRAY_DRAW_VERTEX,
      fragmentShader: SPRAY_DRAW_FRAGMENT,
      transparent: true, depthWrite: false,
    });
    this.uniforms = material.uniforms;
    this.geometry = this.particles.geometry();
    this.mesh = new THREE.Mesh(this.geometry, material);
    this.mesh.frustumCulled = false;
    this.mesh.name = 'spray';
    scene.add(this.mesh);
    Quality.on('particles', f => { this.geometry.instanceCount = Math.floor(this.particles.count * f); });
    this.reseed(App.rng);
    App.on('seed', rng => this.reseed(rng));
    Loop.onSim(() => {
      const t = CameraRig.target, u = this.particles.uniforms;
      u.uSprayBox.value.set(t.x, t.z, THREE.MathUtils.clamp(CameraRig.cur.dist * C.area[0], C.area[1], C.area[2]), Tide.level);
      this.particles.step();
    });
    Loop.onFrame((dt, time, alpha) => { this.uniforms.uSprayDraw.value.x = alpha / CONFIG.simHz; });
  },
  reseed(rng) { this.particles.reset(rng.fork('spray').int(0, 65535)); },
};

// ═════════════════════════════════════════════════════════════════════════════
// EROSION — hydraulic, thermal and coastal erosion on the GPU, in full-grid fragment
// passes on the Heightfield's ground layers (rock and loose sediment), several steps
// per sim step. Erosion.speed scales its time (0 or Erosion.paused stops it);
// Erosion.reset() puts back the island as generated.
//  · hydraulic: water moving over the ground (WATER › Shallow water's flux) can carry
//    capacity × slope × speed × depth of loose material. Short of that it picks up,
//    from the sediment first and slowly from bare rock; over it, it drops the excess.
//    The load rides the same flux the water does, so gullies cut where runoff gathers
//    and steepens, the river's valley widens, and in the sea the load spreads as a
//    plume and settles: a delta and bars off the river's mouth.
//  · thermal: loose material steeper than its angle of repose (sand 34°, soil steeper,
//    held by roots, gentler under water) slides to its lower neighbours; rock steeper
//    than its own angle breaks off into loose material, which slides as scree.
//  · coastal: storm waves (from the weather's wind and storm, strongest on the shore
//    facing them) carry beach sand down the surf zone into a bar offshore, so the shore
//    retreats, and wear the rock at its foot so cliffs crumble back; the load rivers
//    bring stays stirred up and spreads farther; calm swell pushes the bar's sand back
//    up the beach to the berm.
// Its working state is the suspended load (a ping-pong pair) and the slide transfers;
// heights live only in the Heightfield. Every `refresh` seconds the CPU mirror is
// read back, and the plants are re-placed once the ground under them has moved.
// ═════════════════════════════════════════════════════════════════════════════

// Shared by the erosion passes (after HEIGHTFIELD_GLSL and WATER_GLSL).
const EROSION_GLSL = /* glsl */`
uniform sampler2D tSusp;     // suspended load (r), world units of ground per cell
uniform vec4 uErode;         // dt, capacity, depth ref, max speed
uniform vec4 uErodeRate;     // per s: pick up from sediment, from rock; drop; settle in the sea
uniform vec3 uErodeMisc;     // least slope (sine), plume spread per s, film depth
uniform vec4 uSlide;         // tan of repose: sand, soil, under water; tan added per unit of vegetation
uniform vec4 uSlideRate;     // slide per s, beach top, storm bar crest depth, storm units/s carried offshore
uniform vec4 uCoast;         // wave energy 0…1, surf depth, storm run-up, berm height
uniform vec4 uCoastRate;     // rebuild units/s, wear per s, tan of rock, crumble per s
uniform vec3 uWaves;         // the way the waves run (x, z), share of their energy on a sheltered shore
const ivec2 OFF8[8] = ivec2[8](ivec2(-1, 0), ivec2(1, 0), ivec2(0, -1), ivec2(0, 1),
                               ivec2(-1, -1), ivec2(1, -1), ivec2(-1, 1), ivec2(1, 1));
float dist8(int i) { return (i < 4 ? 1.0 : 1.41421356) * uWaterGrid.x; }
bool inGrid(ivec2 c) { int n = int(uHeightGrid.y) - 1; return c.x >= 0 && c.y >= 0 && c.x <= n && c.y <= n; }
bool isSea(ivec2 c) { return inGrid(c) && groundHeightCell(c) < uWaterGrid.y; }
float load(ivec2 c) { return inGrid(c) ? texelFetch(tSusp, c, 0).r : 0.0; }
// Land within a few cells: the island's own shore, not the reef out across the lagoon.
bool nearLand(ivec2 c) {
  if (groundHeightCell(c) > uWaterGrid.y) return true;
  for (int k = 2; k <= 6; k += 2)
    for (int i = 0; i < 8; i++) if (inGrid(c + OFF8[i] * k) && groundHeightCell(c + OFF8[i] * k) > uWaterGrid.y) return true;
  return false;
}
// The storm waves' energy at c's shore: full on a shore facing them, less in its lee.
float wavesAt(ivec2 c) {
  if (!nearLand(c)) return 0.0;
  vec2 down = vec2(groundHeightCell(c - ivec2(1, 0)) - groundHeightCell(c + ivec2(1, 0)),
                   groundHeightCell(c - ivec2(0, 1)) - groundHeightCell(c + ivec2(0, 1)));
  float facing = length(down) > 1e-4 ? dot(normalize(down), -uWaves.xy) : 0.0;
  return uCoast.x * mix(uWaves.z, 1.0, smoothstep(-0.2, 0.7, facing));
}
// 1 in the surf zone of waves of energy e: from the surf depth up to where they run up.
float surfZone(float h, float e) {
  float sea = uWaterGrid.y, top = sea + 0.3 + uCoast.z * e;
  return smoothstep(sea - uCoast.y, sea - uCoast.y * 0.6, h) * (1.0 - smoothstep(top - 0.4, top, h));
}

// What the water at c trades with the ground this step: x with the sediment layer, y
// with the rock (positive picks up, negative drops).
vec2 erodeExchange(ivec2 c) {
  vec4 G = layerCell(uLayerGround, c);
  float s = load(c), dt = uErode.x, h = G.r + G.g;
  if (h < uWaterGrid.y) return vec2(-s * min(uErodeRate.w * (1.0 - 0.85 * uCoast.x) * (1.0 - 0.95 * wavesAt(c)) * dt, 1.0), 0.0);   // in the sea it settles; storm waves keep it stirred up, and in their surf hardly any settles
  float hl = groundHeightCell(c - ivec2(1, 0)), hr = groundHeightCell(c + ivec2(1, 0));
  float hd = groundHeightCell(c - ivec2(0, 1)), hu = groundHeightCell(c + ivec2(0, 1));
  vec2 grad = vec2(hr - hl, hu - hd) / (2.0 * uWaterGrid.x);
  float sinA = max(length(grad) * inversesqrt(1.0 + dot(grad, grad)), uErodeMisc.x);
  float speed = G.b > 1e-4 ? min(length(waterVelocity(c)), uErode.w) : 0.0;
  float cap = uErode.y * sinA * speed * min(G.b, uErode.z) * smoothstep(0.25 * uErodeMisc.z, uErodeMisc.z, G.b);
  if (cap <= s) return vec2(-(s - cap) * min(uErodeRate.z * dt, 1.0), 0.0);
  // Never dig below every neighbour (a pit would only refill): at most half the drop to the lowest.
  float room = max(h - min(min(hl, hr), min(hd, hu)), 0.0) * 0.5;
  float fromSed = min(min((cap - s) * min(uErodeRate.x * dt, 1.0), G.g), room);
  float fromRock = min((cap - s - fromSed) * min(uErodeRate.y * dt, 1.0), room - fromSed);
  return vec2(fromSed, max(fromRock, 0.0));
}`;

// The exchange, twice from the same inputs: the load (into the load's write target,
// before the ground changes) and then the ground.
const EROSION_LOAD_GLSL = /* glsl */`
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec2 e = erodeExchange(c);
  gl_FragColor = vec4(max(load(c) + e.x + e.y, 0.0), 0.0, 0.0, 0.0);
}`;

const EROSION_GROUND_GLSL = /* glsl */`
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 G = layerCell(uLayerGround, c);
  vec2 e = erodeExchange(c);
  gl_FragColor = vec4(G.r - e.y, max(G.g - e.x, 0.0), G.ba);
}`;

// The load moves with the water: each cell sends the share of its load that its water
// sends, split the way the flux is; in the sea it spreads to sea neighbours as a plume,
// which storm waves carry much farther before it settles.
const EROSION_CARRY_GLSL = /* glsl */`
vec4 carried(ivec2 c) {
  if (!inGrid(c)) return vec4(0.0);
  vec4 f = waterFlux(c);
  float sent = f.x + f.y + f.z + f.w, d = layerCell(uLayerGround, c).b;
  return sent > 0.0 && d > 1e-4 ? f / sent * min(uErode.x * sent / d, 1.0) : vec4(0.0);
}
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 k = carried(c);
  float s = load(c) * (1.0 - k.x - k.y - k.z - k.w);
  s += load(c - ivec2(1, 0)) * carried(c - ivec2(1, 0)).y + load(c + ivec2(1, 0)) * carried(c + ivec2(1, 0)).x
     + load(c - ivec2(0, 1)) * carried(c - ivec2(0, 1)).w + load(c + ivec2(0, 1)) * carried(c + ivec2(0, 1)).z;
  if (isSea(c)) {
    float p = min(uErodeMisc.y * (1.0 + 4.0 * uCoast.x) * uErode.x, 1.0) * 0.2;   // farther in a storm
    for (int i = 0; i < 4; i++) if (isSea(c + OFF8[i])) s += p * (load(c + OFF8[i]) - load(c));
  }
  gl_FragColor = vec4(max(s, 0.0), 0.0, 0.0, 0.0);
}`;

// Loose material each cell sends to its eight neighbours (axial ones, or with uDiag the
// diagonals): sliding past its angle of repose; in a storm, sand the waves strip from the
// beach and carry down to lower neighbours in the surf zone, so the shore retreats and
// a bar builds offshore (up to the bar's crest depth); and in calm weather, the reverse:
// shoreface sand pushed up the beach toward the berm.
const EROSION_SLIDE_GLSL = /* glsl */`
uniform float uDiag;
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 G = layerCell(uLayerGround, c);
  float h = G.r + G.g, sea = uWaterGrid.y, dt = uErode.x;
  float sandy = 1.0 - smoothstep(uSlideRate.y, uSlideRate.y + 2.0, h);
  float tanA = mix(uSlide.y + uSlide.w * layerCell(uLayerState, c).b, uSlide.x, sandy);
  tanA = mix(uSlide.z, tanA, smoothstep(sea - 0.6, sea + 0.2, h));
  float waves = wavesAt(c);
  bool swash = h > sea - uSlideRate.z && h < sea + 0.3 + uCoast.z * waves;
  float hn[8], ex[8], sx[8], total = 0.0, most = 0.0, stotal = 0.0;
  for (int i = 0; i < 8; i++) {
    hn[i] = inGrid(c + OFF8[i]) ? groundHeightCell(c + OFF8[i]) : h;
    ex[i] = max(h - hn[i] - tanA * dist8(i), 0.0);
    sx[i] = swash && hn[i] < h && hn[i] > sea - uCoast.y ? (h - hn[i]) / dist8(i) : 0.0;
    total += ex[i]; most = max(most, ex[i]);
    stotal += sx[i];
  }
  float moved = total > 0.0 ? min(G.g, 0.5 * most * min(uSlideRate.x * dt, 1.0)) : 0.0;
  float dragged = stotal > 0.0 ? min(G.g - moved, uSlideRate.w * waves * dt * smoothstep(0.0, 0.3, G.g)) : 0.0;
  // Calm swell: up the shoreface to higher neighbours still below the berm.
  float calm = 1.0 - smoothstep(0.05, 0.35, uCoast.x), berm = sea + uCoast.w;
  float up[8], utotal = 0.0;
  for (int i = 0; i < 8; i++) {
    up[i] = hn[i] > h && hn[i] < berm ? (hn[i] - h) / dist8(i) : 0.0;
    utotal += up[i];
  }
  bool shoreface = h > sea - uCoast.y && h < berm && utotal > 0.0 && nearLand(c);
  float pushed = shoreface ? min(G.g - moved - dragged, uCoastRate.x * calm * dt * smoothstep(0.0, 0.3, G.g)) : 0.0;
  float o[8];
  for (int i = 0; i < 8; i++)
    o[i] = (total > 0.0 ? moved * ex[i] / total : 0.0) + (stotal > 0.0 ? dragged * sx[i] / stotal : 0.0)
         + (utotal > 0.0 ? max(pushed, 0.0) * up[i] / utotal : 0.0);
  gl_FragColor = uDiag > 0.5 ? vec4(o[4], o[5], o[6], o[7]) : vec4(o[0], o[1], o[2], o[3]);
}`;

// Apply the slides (out to neighbours, in from them), and turn rock into loose material
// where it is steeper than its angle or worn by storm waves at the foot of a cliff.
const EROSION_SETTLE_GLSL = /* glsl */`
uniform sampler2D tSlideAxis, tSlideDiag;
vec4 slideAxis(ivec2 c) { return inGrid(c) ? texelFetch(tSlideAxis, c, 0) : vec4(0.0); }
vec4 slideDiag(ivec2 c) { return inGrid(c) ? texelFetch(tSlideDiag, c, 0) : vec4(0.0); }
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 G = layerCell(uLayerGround, c);
  float sed = G.g - dot(slideAxis(c), vec4(1.0)) - dot(slideDiag(c), vec4(1.0));
  sed += slideAxis(c - ivec2(1, 0)).y + slideAxis(c + ivec2(1, 0)).x + slideAxis(c - ivec2(0, 1)).w + slideAxis(c + ivec2(0, 1)).z;
  sed += slideDiag(c + ivec2(-1, -1)).w + slideDiag(c + ivec2(1, -1)).z + slideDiag(c + ivec2(-1, 1)).y + slideDiag(c + ivec2(1, 1)).x;
  float h = G.r + G.g, steep = 0.0;
  for (int i = 0; i < 8; i++)
    if (inGrid(c + OFF8[i])) steep = max(steep, (h - groundHeightCell(c + OFF8[i])) / dist8(i));
  float bare = 1.0 - smoothstep(0.05, 0.4, G.g), waves = wavesAt(c);
  float rock = uErode.x * (uCoastRate.w * max(steep - uCoastRate.z, 0.0) * uWaterGrid.x
