<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Island weather diorama</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc4dd; }
  #view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  #perf {
    position: fixed; left: 8px; bottom: 8px; z-index: 10; pointer-events: none; white-space: pre;
    font: 11px/1.35 ui-monospace, Menlo, Consolas, monospace; color: #f3efe2;
    background: rgba(22, 26, 44, 0.62); padding: 5px 8px; border-radius: 6px;
  }
  #perf[hidden] { display: none; }
  #boot-error {
    position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
    background: #1d2134; color: #f3efe2; font: 14px/1.5 system-ui, sans-serif; padding: 2em; text-align: center;
  }
  #boot-error[hidden] { display: none; }
</style>

<!-- Three.js is the only external code; everything else is generated in this file. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<div id="perf"></div>
<div id="boot-error" hidden></div>

<script>
// BOOT GUARD — a classic script so it still runs when the module below fails to load
// (CDN unreachable, no WebGL2). It turns silent failures into a readable message.
(function () {
  function fail(msg) {
    var el = document.getElementById('boot-error');
    el.textContent = msg;
    el.hidden = false;
  }
  window.__islandFail = fail;
  window.addEventListener('error', function (e) {
    if (!window.__islandReady) fail('The island failed to start: ' + (e.message || 'unknown error'));
  });
  setTimeout(function () {
    if (!window.__islandReady) fail('The island did not start. Three.js is loaded from cdn.jsdelivr.net, so check the network connection.');
  }, 20000);
})();
</script>

<script type="module">
import * as THREE from 'three';

// ═════════════════════════════════════════════════════════════════════════════
// CONFIG — every tunable constant in one place. Systems read from here rather
// than hard-coding numbers, so the whole diorama can be tuned from this block.
// ═════════════════════════════════════════════════════════════════════════════

const CONFIG = {
  defaultSeed: 'squall',

  // Frame budget. The quality governor lowers quality whenever frames run slower than this.
  targetFps: 60,
  slowFrameMs: 1000 / 55,          // a frame slower than this counts as dropped
  // The drawing buffer is capped at roughly 1080p's pixel count (plus headroom), so a
  // high-DPI laptop is not asked to render 4K just because its screen could show it.
  maxDrawPixels: 1920 * 1080 * 1.25,
  maxPixelRatio: 2,

  // Fixed simulation step. Weather and other stateful systems advance in these steps,
  // never by the raw frame delta, so the same seed always gives the same weather.
  simHz: 30,
  maxSimStepsPerFrame: 4,          // beyond this the sim slows down rather than spiralling

  // Quality ladder. When frames are slow, each lever is lowered one notch at a time,
  // in this order: simulation grid steps, then particles, then shadows, then (last
  // resort) render scale. Raising goes back up in reverse order. Index 0 is best.
  quality: [
    { name: 'simSteps',    label: 'sim steps', levels: [6, 4, 3, 2, 1] },
    { name: 'particles',   label: 'particles', levels: [1, 0.7, 0.5, 0.35, 0.25] },
    { name: 'shadowSize',  label: 'shadow',    levels: [2048, 1024, 512] },
    { name: 'renderScale', label: 'scale',     levels: [1, 0.85, 0.7] },
  ],
  governor: {
    windowMs: 1000,                // frames judged over this window
    lowerIfSlowFraction: 0.10,     // >10% dropped frames in the window → lower quality
    raiseIfSlowFraction: 0.02,     // <2% dropped frames → allowed to probe upward
    settleMs: 1500,                // ignore frames this long after any change (shader compiles etc.)
    warmupMs: 2500,                // ignore the first frames after load
    raiseBackoffMs: 10000,         // wait this long before probing a higher level…
    raiseBackoffMaxMs: 160000,     // …doubling each time a probe fails, up to this
  },

  camera: { fov: 40, near: 0.5, far: 4000, position: [260, 170, 260], target: [0, 20, 0] },

  // Orbit camera (see RENDERING): drag to orbit, wheel to zoom, idle drift after a pause.
  orbit: {
    distance: [170, 900],          // closest and farthest zoom; nearer than this the peak fills the view
    pitch: [7, 82],                // degrees above the horizon (the low limit keeps wave-crest ink away)
    rotateSpeed: 0.0055,           // radians per pixel dragged
    zoomStep: 0.0012,              // zoom factor per wheel delta unit (exponential)
    damping: 9,                    // how fast the view catches up with input, per second
    inertia: 2.6,                  // how fast a flung orbit slows down, per second
    clearance: 6,                  // the camera stays this far above the ground and the sea
    idleSeconds: 10,               // drift starts after this long with no input
    driftRamp: 4,                  // seconds the drift takes to ease in
    driftSpeed: 0.045,             // radians per second around the island while drifting
    driftPitch: [24, 5, 70],       // drift pitch eases toward this, ± sway amount (deg), sway period (s)
    driftDistance: [420, 50, 95],  // drift distance eases toward this, ± breathe amount, period (s)
  },

  // Cel look. Light is cut into three diffuse bands (shadow / mid / lit) plus an
  // optional hard specular band, so a surface never shows more than four tones.
  look: {
    bandShadow: 0.06,              // N·L × shadow below this is the shadow band
    bandLit: 0.42,                 // …above this is the fully lit band, between is mid
    midLevel: 0.55,                // how far the mid band sits from shadow toward lit
    specBand: 0.55,                // highlight threshold for glossy surfaces
    shadowStrength: 0.75,          // brightest channel of the blue-violet shadow tint
    skyBounce: 0.28,               // sky colour added into shadows so they keep hue
    shadowHue: 0.4,                // extra blue-violet in shadows, scaled by the surface's brightness
    // Ink outlines: full width and strength near the camera, thin and faint far away.
    inkNear: 80, inkFar: 900,      // world-unit distance range over which ink fades
    inkWidth: [2.0, 0.8],          // pixels at inkNear / inkFar
    inkFarAlpha: 0.22,
    inkCutoff: [1600, 2600],       // no ink at all beyond this (the far sea's edge and wave crests)
    depthEdge: 0.045,              // relative jump in 1/depth that counts as an edge
    normalEdge: 0.3,               // 1 − cos(angle) between neighbouring normals
    // Rim light: a thin band of sky colour on silhouettes that face away from the sun.
    rimWidth: 5.0, rimStrength: 0.7, rimFacing: 0.12,   // width includes the ink it sits under
    tintSeconds: 3.5,              // time constant for weather tint changes
  },

  // Sun, moon and sky. World axes: +x east, −z north, +y up. Time is local solar
  // time in hours; the Clock (see ATMOSPHERE) moves hours, the sun's declination
  // through the seasons, and the moon's age.
  sky: {
    startHour: 10,                 // time of day at load (?time=18.5 in the URL overrides)
    latitude: 34,                  // degrees north: how high the sun climbs at noon
    moonAge: 12,                   // days since new moon at load (14.77 is full)
    sunSize: 2.4, moonSize: 1.9,   // angular radius of the discs, degrees
    bands: 7, bandMix: 0.6,        // the gradient is stepped into this many bands, this strongly
    nightAmbient: 0.3,             // shadow-band brightness at night relative to day
    moonLight: 0.55,               // full-moon light relative to the sun
    starCells: 150, starDensity: 0.13, starTwinkle: 0.35,
    cloudCover: 0.42,              // 0 clear … 1 overcast, away from any front; the atmosphere sets this
    cloudScale: 1.3,
    cloudDrift: [0.012, 0.004],    // cloud-plane units per second, until the atmosphere's wind takes over
    cloudPlane: 4,                 // km: height of the dome's cloud deck, so its horizon lies ~33 km out
  },

  // Sim clock (see ATMOSPHERE). Time runs on simulated seconds, so Loop.timeScale
  // and pause speed it up or stop it. Year fraction 0 is the spring equinox.
  clock: {
    dayLength: 720,                // simulated seconds per day: 12 minutes at normal speed
    yearDays: 36,                  // days in the diorama's year, so the seasons turn in about 7 hours
    startYear: 0.056,              // fraction of the year at load: mid spring (?season=winter or 0.8 overrides)
    seasons: { spring: 0.04, summer: 0.29, autumn: 0.54, winter: 0.79 },   // middle of each season
    tilt: 23.44,                   // the sun's declination swings ± this through the year
    seasonGlide: 2.5,              // seconds a jump to another season takes to settle
  },

  // The weather model (see ATMOSPHERE). Distances in km, speeds in m/s, time
  // constants in simulated seconds unless noted. Game time runs dayLength/24 sim
  // seconds to the hour, so a front moving 20 km/h crosses the island in seconds.
  atmosphere: {
    windFrom: 65,                  // prevailing wind, compass degrees it blows from (0 north, 90 east)
    wander: [22, 0.28, 80],        // the wind wanders ± this many degrees and this fraction of its speed, over about this many seconds
    pressure: 1014,                // hPa at sea level in settled weather
    // Climate by season: mean sea-level air temperature °C, relative humidity, prevailing
    // wind m/s, seconds of quiet between fronts, and how likely each kind of front is.
    // Values blend smoothly between the middles of neighbouring seasons.
    climate: {
      spring: { temp: 14, humidity: 0.64, wind: 6.5, quiet: [70, 160],  fronts: { overcast: 2, rain: 4, storm: 1.5 } },
      summer: { temp: 21, humidity: 0.58, wind: 5.5, quiet: [110, 240], fronts: { overcast: 1.5, rain: 1.5, storm: 3 } },
      autumn: { temp: 15, humidity: 0.70, wind: 7.5, quiet: [60, 140],  fronts: { overcast: 2, rain: 4, storm: 3 } },
      winter: { temp: 6,  humidity: 0.74, wind: 8.5, quiet: [50, 120],  fronts: { overcast: 3, rain: 5, storm: 1.5 } },
    },
    frontKinds: { overcast: 0.36, rain: 0.62, storm: 1 },   // intensity of each kind of front
    frontSpeed: [16, 28],          // km per game hour
    frontWidth: [11, 18],          // half-width of a front's cloud band
    frontStart: 45,                // a front forms this far upwind, out of sight beyond the horizon
    frontNear: 28,                 // a front the controls ask for forms this far upwind
    frontDepth: 5,                 // how high a full-strength front lifts the air at its core
    frontRain: 24,                 // mm/h under a full-strength front's core
    frontWind: 13,                 // m/s added at a full-strength front's core
    frontCold: 5, frontWarm: 1.2,  // °C cooler behind a full-strength front, warmer just ahead of it
    heat: [8, 4],                  // °C the land air rises above the sea's in full sun / falls below on a clear night
    heatHours: 2.5,                // game hours the land takes to heat or cool (so the warmest hour is mid-afternoon)
    breeze: 0.75,                  // m/s of sea or land breeze per °C between land and sea air
    oroRain: 7,                    // mm/h on windward slopes under a deep cap cloud
    downdraught: [6, 9],           // a storm's leading edge: °C colder, m/s more wind at its peak
    ease: { temp: 25, humidity: 18, pressure: 15, wind: 12, front: 15 },
    cloudDrift: 0.0018,            // dome cloud drift, plane units per second per m/s of wind
  },

  // The air (see ATMOSPHERE › Air): fog, cloud shadows, god rays, the rainbow.
  air: {
    shadow: 0.55,                  // how dark a cloud's shadow is (toward the shadow band)
    rays: 1,                       // god ray strength
    rainbow: 1,
    valleySpread: 1.8,             // valley fog forms as the land air comes within this many °C of its dew point
    valleyHeight: 12,              // world units over which valley fog thins by e
    valleyDensity: 0.06,           // per world unit at the sea's level
    seaWarm: [1.5, 4],             // °C the land air is warmer than the sea where sea fog starts / is full
    seaHeight: 8, seaDensity: 0.05,
  },

  // The shared layer grid (see TERRAIN): res × res cells over size × size world
  // units, centred on the origin. Sea level is y = ocean.level.
  heightfield: { res: 256, size: 420 },

  // The island (see TERRAIN). Heights in world units; radii as fractions of half the
  // grid. One world unit is metresPerUnit metres both ways, which turns heights into
  // altitudes for the lapse rate (and distances into metres for thunder).
  terrain: {
    metresPerUnit: 25,
    peak: 132,                     // summit height: about 3.3 km, below freezing on a mild day
    peakOffset: 14,                // the summit sits up to this far from the island's centre
    cone: [0.33, 0.13],            // the summit's sharp cone: share of the height, width
    shield: [0.72, 1.6],           // the broad base under it: radius, profile (above 1 is concave)
    spokes: 1.4,                   // noise scale round the summit: higher gives more, narrower ridges
    ridges: 22,                    // height of the ridges down the flanks (valleys sink between them)
    coast: [0.58, 0.76],           // land falls to the sea between these radii…
    coastWobble: 0.12,             // …moved in and out by this much, so the coast isn't a circle
    lowland: 4.5, hills: 7,        // coastal plain height, and its rolling hills
    lagoon: -3.6,                  // sea floor inside the reef
    reef: [0.88, 0.02, -0.7],      // reef radius, half-width, crest height (just under the sea)
    deep: -30,                     // sea floor at the grid's edge
    beachTop: 3.2,                 // sand up to about this height
    soilDepth: 1.6, sandDepth: 2.2,// loose sediment on gentle ground and on the beach
    seaLevelTemp: 14,              // °C at sea level for a new island's first snow; the atmosphere then drives the temperature layer
    lapseRate: 6.5,                // °C per km of altitude
    rockSlope: 0.74,               // ground steeper than this (up-component of its normal) shows bare rock
    dryGrassAbove: 60,             // grass is dry upland grass above this height
    wetDarken: 0.68,               // fully wet ground is this bright
    snowCover: 0.05,               // snow deeper than this hides the ground
  },

  // The wind field (see ATMOSPHERE › Wind): the atmosphere's wind (direction and
  // speed) bent by the terrain: faster over ridges and high ground, turned along
  // steep slopes, slow and eddying in the lee of high ground, slowed by forest;
  // plus the sea or land breeze, and gusts that come in bursts and roll downwind.
  wind: {
    from: 65,                      // compass degrees the wind blows from at load (0 north, 90 east)
    speed: 7,                      // m/s at load
    refSpeed: 14,                  // a plant leans its full amount at this speed
    gustScale: 75,                 // world size of one gust patch
    gustTravel: 1.6,               // gusts cross the ground at this × wind speed (+3 units/s)
    gustStrength: 0.9,             // a gust adds up to this fraction of the wind speed
    burst: 9,                      // seconds over which gustiness swells and dies away
    easeSeconds: 4,                // direction and speed glide to new values, never jump
    field: 96,                     // cells across the field's grid, laid over the heightfield's square
    fieldRows: 16,                 // rows recomputed per sim step while the field is refreshing
    refreshTurn: 1.5,              // degrees the wind turns before the field is recomputed (the flow itself turns at once)
    ridge: [30, 0.6],              // a crest this far above the ground round it (radius 30) blows this much faster
    aloft: 0.35,                   // …and the summit this much faster again, above the ground's drag
    deflect: 0.65,                 // share of its uphill part the wind loses on steep ground, turning along the slope
    shelter: [5, 35, 0.28],        // upwind ground this much higher begins / completes the lee, where speed falls to this share
    forestDrag: 0.25,              // share of the speed lost over full vegetation
    swirl: [24, 0.85],             // eddies in the lee: size (world units), strength (share of the wind)
    fall: { rain: 9, snow: 1.2 },  // m/s fall speeds: rain slants by wind / fall, so snow drifts far more
  },

  // Wind-blown sand and dust (see ATMOSPHERE › Dust): GPU particles lifted from dry
  // loose ground where the local wind (gusts included) is strong.
  dust: {
    size: 128,                     // the pool is size² particles (the quality ladder draws a share of them)
    drift: 1.1,                    // world units per second per m/s of wind (the diorama's scale, as the gusts)
    mobility: [0.5, 0.9],          // share of the wind's speed sand (hopping) and dust (carried) move at
    threshold: [10, 12],           // m/s of local wind that starts sand moving off the beach / dust off bare soil
    ramp: 5,                       // m/s over which lifting goes from none to full
    emit: [0.15, 0.025],           // chance a free particle lifts off per try where lifting is full: sand, dust
    life: [2.5, 5, 6, 12],         // seconds aloft: sand min, max; dust min, max
    streak: 0.09,                  // seconds of travel drawn as each streak
    width: [0.3, 1.4],             // world width, and the fewest pixels a streak is drawn
  },

  // Grass and trees (see TERRAIN › Vegetation). Heights in world units.
  vegetation: {
    band: [4.5, 96],               // ground height range plants grow in (beach below, snow above)
    minUp: 0.84,                   // flattest slope plants grow on (up-component of the ground normal)
    grow: [0.02, 0.0015, 0.05],    // per second: greening toward what the ground can carry when moist; browning in a warm dry spell; dying back where it cannot grow
    grassCell: 1.2,                // one grass tuft per cell this size, where the density allows
    grassHeight: [1.6, 3.0],       // tuft height range
    grassBlades: 7,                // blades per tuft
    grassFlex: 0.75,               // tip displacement per unit lean, as a fraction of blade height
    treeCell: 7,                   // one tree candidate per cell this size
    treeBand: [5, 84],             // ground height range for trees
    pineAbove: 30,                 // conifers above this height, round broadleaf trees below
    forestScale: 70, forestCover: 0.55,   // size of forest patches, fraction of the land they cover
    treeVariants: 3,               // distinct geometries of each kind
    treeFlex: 0.06,                // tree-top displacement per unit lean, as a fraction of its height
  },

  // The sea around the island (see WATER). Gerstner waves shape it; colour comes
  // from the water depth over the heightfield.
  ocean: {
    level: 0,                      // mean sea level, world y
    tide: [0.9, 240, 1.2],         // tide: height either side of the mean, seconds per cycle, starting phase
    radius: 3600,                  // mesh reaches this far from the island, just inside camera.far
    nearRadius: 800, nearStep: 4,  // even rings out to nearRadius, then they widen with distance
    segments: 288,                 // spokes around the ring mesh
    waves: 6,                      // summed Gerstner waves
    wavelength: [48, 190],         // shortest and longest wave, world units
    amplitude: 0.0065,             // wave height as a fraction of its wavelength
    steepness: 0.6,                // 0 round swells … 1 sharp crests (summed over all waves)
    spread: 0.9,                   // radians of scatter around the prevailing direction
    speed: 0.55,                   // multiplies the deep-water wave speed
    shoalDepth: 7,                 // waves flatten in water shallower than this
    openDepth: 40,                 // depth of the open sea beyond the heightfield
    depthBands: [1.4, 4.8, 12],    // depths where the colour steps shallow → mid → deep
    foamWidth: 0.9,                // depth covered by the shore foam line
    foamRing: [3.2, 0.09, 0.35],   // rolling foam line: start depth, rolls per second, width (depth units)
    gloss: 1,
    specular: [220, 0.22, 0.65],   // highlight sharpness, then the two band thresholds
    wrap: 0.45,                    // wraps the light round so a low sun still lights the sea
    reflect: [0.2, 0.45, 0.38],    // sky reflection: fresnel band thresholds, strength
    fade: [1300, 3100],            // distance over which the sea blends into the sky below the horizon
    // The wind on the water (local wind, gusts included): ripples roughen with it, and
    // whitecaps break on the crests from the first speed, most by the second (m/s).
    chop: [0.45, 1.7],             // ripple height in still air / at the reference wind speed and above
    whitecaps: [7, 19],
    whitecapFade: [900, 1700],     // distance over which whitecaps fade out (they would shimmer)
  },

  // Water on the land (see WATER › Shallow water): rain raises each cell's water depth
  // (world units), a pipe model moves it downhill, the ground soaks it up and the air
  // takes it back. The diorama compresses time (a game hour is 30 s), so depths and
  // rates are exaggerated to match: a storm's worth of rain fills hollows in a minute.
  water: {
    gravity: 9.8,                  // units/s²: drives the outflow between neighbouring cells
    friction: 1.6,                 // per second: outflow lost each second, more in a thin film (below)
    film: 0.08,                    // water shallower than this drags on the ground in proportion
    speed: 1,                      // seconds of flow per sim second (split over the 'simSteps' lever)
    rainGain: 0.00035,             // depth per second per mm/h of rain (20 mm/h ≈ 0.007 units/s)
    maxDepth: 14,                  // clamp, so nothing ever runs away
    // Infiltration, depth per second into dry ground: sand, soil, bare rock. Saturated
    // or frozen ground takes almost none.
    soak: [0.02, 0.0012, 0.00012],
    hold: [0.18, 0.015],          // water the ground holds when saturated: per unit of sediment depth (sand, soil); bare rock in all
    drain: 0.003,                  // share of the held water lost to deep ground each second
    // Evaporation, depth per second from open water at 15 °C, half humidity, still air
    // and no sun; warmer air, wind and sunlight on the cell raise it.
    evaporate: 0.00045,
    evapWind: 8,                   // m/s of wind that doubles evaporation
    evapSun: 2.2,                  // full sun on the cell multiplies evaporation by 1 + this
    surfaceWet: 0.004,             // surface wetness per second per mm/h of rain falling on the cell
    draw: 0.025,                   // water shallower than this is not drawn as a surface (wetness shows it)
    depthBands: [0.18, 0.7, 2.2],  // depths where the colour steps: muddy film → shallow → mid → deep
    // The wet look (WATER › Wet surfaces). Wet ground darkens (CONFIG.terrain.wetDarken),
    // glosses and, at grazing angles, mirrors the sky; puddles mirror it more.
    wetGloss: 0.7,                 // gloss of fully wet ground (plants take a share of it)
    wetSheen: 0.3,                 // how mirror-like fully wet ground is (a film of water too thin to draw: filmSheen)
    filmSheen: 0.6,
    sky: [0.06, 0.1, 0.32, 0.8],   // reflection: share at normal incidence, fresnel band 1, band 2, strength
    spec: [400, 0.3, 0.75, 0.9],   // highlights: sharpness, band 1, band 2, strength
    // Drying: once the rain stops, a cell drier than its neighbours dries up to 1 + dryEdge
    // times faster, so wet ground recedes from its edges inward (a front crosses a cell in
    // a few seconds); hollows (lower than the ground around) dry more slowly, by up to
    // dryHollow, and are the last to go.
    dryEdge: 30,
    dryHollow: 0.7,
  },

  // Falling rain (see WATER › Rain): GPU particles spawned in a box over the part of
  // the island in view, as often as the precipitation layer says it rains there.
  rain: {
    size: 176,                     // the pool is size² drops (the quality ladder draws a share of them)
    fall: 46,                      // world units per second the drops fall (the slant comes from the wind / CONFIG.wind.fall.rain)
    top: 75,                       // drops start this far above the ground
    area: [0.55, 110, 260],        // half-width of the box: share of the camera's distance, clamped
    heavy: 20,                     // mm/h at which the pool is nearly all falling
    emit: 0.14,                    // chance a free drop starts per sim step in heavy rain
    streak: 0.05,                  // seconds of fall drawn as each streak
    width: [0.09, 1.0],            // world width, and the fewest pixels a streak is drawn
    splash: [0.28, 1.0, 1.4],    // seconds a splash lasts, ring radius on the ground, on water (world units)
  },

  // Snow, ice and cold (see SNOW). Depths in world units, rates per sim second.
  snow: {
    gain: 0.0012,                  // snow depth per second per mm/h of snowfall (fluffy: several times the rain's water)
    facing: [0.42, 0.72],          // up-component of the ground: no snow settles below the first, all of it from the second
    lee: 0.8,                      // settles up to 1 + this as much in the full lee of the wind
    slide: [0.6, 0.6],             // snow on ground with an up-component below this slides; share of it per second
    drift: [8, 18, 0.05],          // local wind m/s where drifting starts, where it is full; share of exposed snow moved per second
    melt: 0.0012,                  // depth per second per °C above freezing
    meltSun: 0.006,                // depth per second in full sun on a slope facing it
    water: 0.35,                   // water depth per unit of snow melted
    max: 6,                        // deepest snow anywhere
    hail: [0.85, 0.00012],         // storm strength from which hail falls; depth per second per mm/h while it does
    frostSeconds: 20,              // a clear still night's frost takes about this long to form or clear
    frost: [1.5, -1.5],            // ground temperature °C where frost starts on the grass, where it is full
    flakes: {
      size: 128,                   // the pool is size² particles (the quality ladder draws a share)
      top: 60,                     // flakes start up to this far above the ground
      area: [0.55, 110, 260],      // half-width of the box: share of the camera's distance, clamped
      heavy: 8,                    // mm/h at which the pool is nearly all falling
      emit: 0.04,                  // chance a free particle starts as a flake per sim step in heavy snow
      hailEmit: 0.05,              // …as a hailstone while hail falls
      hailFall: 40,                // units/s a hailstone falls
      bounce: [7, 60, 1.6, 0.9],   // a hailstone's first bounce (units/s), gravity, seconds on the ground, sideways hop
      flake: 0.28, hail: 0.2,      // world size of a flake, of a hailstone
      minPx: 1.6,                  // fewest pixels either is drawn
    },
  },

  // Lightning (see LIGHTNING). Heights and lengths in world units, times in sim seconds.
  lightning: {
    rate: 0.14,                    // strikes per second at full storm strength (scaled by its square)
    weights: {                     // how likely each kind of point is struck
      land: 0.05, height: 3, ridge: 0.12,   // any ground; more the higher (share of the summit, squared); more per unit it stands above its surroundings
      tree: 0.5, treeHeight: 0.12,          // a tree, and more for a taller one
      sea: 0.35, seaPoints: 60,             // points on the open sea round the island
    },
    height: [80, 150],             // the channel starts this far above its point, and at least this high
    step: [4, 9],                  // a leader step's length

    branch: 0.3,                   // chance a step forks
    segments: 700,                 // most segments a bolt can have
    width: 0.45, minPx: 1.6,       // core width (branches less), fewest pixels
    glow: 3.2,                     // glow width, × the core's
    leader: 0.22, leaderSteps: 9,  // seconds the stepped leader takes to land, and its steps
    restrike: [0.07, 0.16],        // seconds between strokes (two or three in all)
    fade: 0.05,                    // seconds a stroke's flash takes to die by e
    light: 2.4,                    // strength of the white flash light
    ambient: 0.55,                 // the shadow band lightens toward white by this much
    sky: 0.45,                     // the sky flashes this far toward white
    smoke: {
      dry: 0.35,                   // a struck tree smoulders if the ground's wetness is below this
      wetOut: 0.6,                 // …and goes out once it is wetter than this
      seconds: [40, 90],           // how long it smoulders
      most: 4, puffs: 14,          // smouldering trees at once, puffs each
      rise: [14, 7],               // a puff rises this far over this many seconds
      drift: 0.35,                 // units downwind per second per m/s of wind

    },
  },

  // Sea spray and mist (see WATER › Spray), torn off the crests in strong wind.
  spray: {
    size: 96,                      // the pool is size² particles
    wind: [11, 20],                // local wind m/s where spray starts, where it is full
    emit: 0.05,                    // chance a free particle starts per sim step at full wind, over the surf
    area: [0.6, 120, 280],         // half-width of the box: share of the camera's distance, clamped
    drift: 1.0,                    // units/s per m/s of wind
    throw: 4, gravity: 5,          // spray is thrown up at this (units/s) and falls back
    life: [1.6, 4.5],              // seconds: spray, mist

  // Sound (see AUDIO). Gains 0…1 into the master.
  audio: {
    master: 0.6,
    wind: [180, 38],               // wind band centre: Hz at calm, plus Hz per m/s
    windGain: 0.5,
    rainGain: 0.35,
    surfGain: 0.4, surfPeriod: 7,  // surf loudness, seconds between swells

    soundSpeed: 343,               // m/s: thunder's delay is the strike's distance over this
  },

  // The debug overlay (see UI): the range each layer is coloured over, by layer number

  debug: { ranges: [null, [0, 1.5], [0, 3], [0, 1], [0, 2], [-20, 30]] },

  // Erosion (see EROSION): hydraulic, thermal and coastal, on the GPU. Like the water, the

  erosion: {
    speed: 1,                      // geological seconds per sim second (0 pauses; ?erosion= sets it at load)
    steps: 4,                      // erosion steps per sim step (each moves speed/steps of the time)
    // Hydraulic: water carries up to capacity × slope (sine) × speed × min(depth, depthRef)

    repose: { sand: 34, soil: 42, underwater: 24, rock: 70, roots: 8 },   // roots: degrees plants add to soil

    crumble: 0.004,                // per second: rock breaking off per unit of excess slope
    // Coastal: storm waves carry beach sand down the surf zone into a bar offshore and
    // wear the cliffs at their foot; calm swell pushes the sand back up to the berm.
    surf: [3, 2.6, 1],             // the surf zone: depth below sea level, storm run-up above it; depth of a storm bar's crest
    stormRate: 0.03,               // units per second of beach sand full storm waves carry offshore

    rebuild: 0.01,                 // units per second of shoreface sand pushed up the beach in calm weather
    berm: 1.8,                     // height above the sea calm weather builds the beach to
    storm: [12, 24],               // m/s of wind over which the waves go from calm to full storm
    lee: 0.3,                      // share of the storm a shore facing away from the waves still gets
    restSteps: 240,                // slide steps that settle a new island before it is shown
    refresh: 8,                    // geological seconds between CPU readbacks (the camera and plant placement follow the ground)

  },
