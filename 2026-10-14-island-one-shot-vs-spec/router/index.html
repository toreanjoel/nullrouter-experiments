// ═════════════════════════════════════════════════════════════════════════════
// RANDOM — the single seeded random number generator. Nothing in the diorama may
// call Math.random(). Each system takes its own named stream with rng.fork('name');
// streams are derived from the one master seed, so the island is fully repeatable
// and one system drawing more numbers never changes what another system gets.
// ═════════════════════════════════════════════════════════════════════════════

// cyrb128: hashes any string to four 32-bit words, used to seed sfc32.
function hashString(str) {
  let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
  for (let i = 0; i < str.length; i++) {
    const k = str.charCodeAt(i);
    h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
    h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
    h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
    h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
  }
  h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
  h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
  h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
  h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
  h1 ^= h2 ^ h3 ^ h4; h2 ^= h1; h3 ^= h1; h4 ^= h1;
  return [h1 >>> 0, h2 >>> 0, h3 >>> 0, h4 >>> 0];
}

class RNG {
  constructor(seed) {
    this.seed = String(seed);
    [this.a, this.b, this.c, this.d] = hashString(this.seed);
    for (let i = 0; i < 15; i++) this.nextUint();   // discard the weak first outputs
  }
  // sfc32: fast, small state, passes PractRand to 2^40+.
  nextUint() {
    let { a, b, c, d } = this;
    const t = (((a + b) | 0) + d) | 0;
    d = (d + 1) | 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) | 0;
    c = (c << 21) | (c >>> 11);
    c = (c + t) | 0;
    this.a = a; this.b = b; this.c = c; this.d = d;
    return t >>> 0;
  }
  next() { return this.nextUint() / 4294967296; }               // [0, 1)
  range(min, max) { return min + (max - min) * this.next(); }  // [min, max)
  int(min, max) { return min + Math.floor(this.next() * (max - min + 1)); } // inclusive
  chance(p) { return this.next() < p; }
  sign() { return this.next() < 0.5 ? -1 : 1; }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  gauss(mean = 0, sd = 1) {                                     // Box–Muller
    const u = 1 - this.next(), v = this.next();
    return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  // Weighted choice: weights[i] ≥ 0; returns an index.
  weighted(weights) {
    let total = 0;
    for (const w of weights) total += w;
    let r = this.next() * total;
    for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r < 0) return i; }
    return weights.length - 1;
  }
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  // An independent, repeatable stream for one system: fork('terrain'), fork('weather')…
  fork(label) { return new RNG(this.seed + '/' + label); }
}

// The seed comes from ?seed= or #seed= in the URL, else the default.
function initialSeed() {
  const fromQuery = new URLSearchParams(location.search).get('seed');
  const fromHash = new URLSearchParams(location.hash.slice(1)).get('seed');
  return fromQuery || fromHash || CONFIG.defaultSeed;
}

// Seeded smooth 2D value noise in [0, 1): a lattice of rng values, interpolated.
function valueNoise2D(rng, N = 64) {
  const lattice = new Float32Array(N * N);
  for (let i = 0; i < lattice.length; i++) lattice[i] = rng.next();
  const lat = (x, y) => lattice[((y & (N - 1)) * N) + (x & (N - 1))];
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const u = (x - xi) * (x - xi) * (3 - 2 * (x - xi)), v = (y - yi) * (y - yi) * (3 - 2 * (y - yi));
    const a = lat(xi, yi), b = lat(xi + 1, yi), c = lat(xi, yi + 1), d = lat(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}

// Seeded 2D gradient (Perlin) noise in about [−1, 1]. Less blocky than value noise,
// and it ridges cleanly, so the terrain is shaped with it.
function gradientNoise2D(rng) {
  const p = rng.shuffle([...Array(256).keys()]), perm = new Uint8Array(512);
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const gx = new Float32Array(256), gy = new Float32Array(256);
  for (let i = 0; i < 256; i++) { const a = rng.range(0, Math.PI * 2); gx[i] = Math.cos(a); gy[i] = Math.sin(a); }
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const g = (h, dx, dy) => gx[h] * dx + gy[h] * dy;
    const n00 = g(perm[perm[X] + Y], xf, yf), n10 = g(perm[perm[X + 1] + Y], xf - 1, yf);
    const n01 = g(perm[perm[X] + Y + 1], xf, yf - 1), n11 = g(perm[perm[X + 1] + Y + 1], xf - 1, yf - 1);
    const u = fade(xf), v = fade(yf), a = n00 + (n10 - n00) * u, b = n01 + (n11 - n01) * u;
    return 1.41 * (a + (b - a) * v);
  };
}

// ═════════════════════════════════════════════════════════════════════════════
// APP — shared state and a tiny event bus that ties the sections together.
// Events: 'seed' (seed changed: regenerate), 'resize', 'quality' (a lever moved),
// 'terrain' (layers read back from the GPU: the CPU mirror changed).
// ═════════════════════════════════════════════════════════════════════════════

const App = {
  seed: initialSeed(),
  rng: null,
  handlers: new Map(),
  on(event, fn) {
    if (!this.handlers.has(event)) this.handlers.set(event, []);
    this.handlers.get(event).push(fn);
  },
  emit(event, ...args) {
    for (const fn of this.handlers.get(event) || []) fn(...args);
  },
  // Re-seed everything. Systems listen for 'seed' and rebuild from rng.fork(name).
  setSeed(seed) {
    this.seed = String(seed);
    this.rng = new RNG(this.seed);
    this.emit('seed', this.rng);
  },
};
App.rng = new RNG(App.seed);
window.App = App;   // handy from the dev console

// ═════════════════════════════════════════════════════════════════════════════
// TERRAIN — the island. One shared grid of per-cell layers (rock, sediment, water,
// snow, wetness, temperature, vegetation) held on the GPU as float render targets
// with a CPU mirror; the seeded generator that fills them; the mesh and shader that
// draw them; and the vegetation scattered over them. Every system reads and writes
// these layers. None keeps its own copy.
// ═════════════════════════════════════════════════════════════════════════════

// ── Heightfield: the layer store ────────────────────────────────────────────
// res × res cells over size × size world units, centred on the origin. Cell (i, j)
// sits at world x = coord(i), z = coord(j), is texel (i, j) and CPU index j·res + i.
// The seven layers are packed four to a texture:
//   ground  r rock height · g loose sediment depth · b water depth · a snow depth  (world units)
//   state   r wetness 0…1 · g temperature °C · b vegetation density 0…1 · a precipitation mm/h
// Ground height is rock + sediment; the drawn surface adds snow (water is drawn by
// the water system). Each pack is a ping-pong pair of float render targets: a GPU
// simulation reads `.read` through the shared uniforms, step(pack, material) renders
// a full pass into `.write` and swaps, and the uniforms follow the new read texture,
// so every shader that took Heightfield.uniforms sees the result at once.
// The CPU mirror (`cpu.ground`, `cpu.state`, same RGBA layout) is for systems that
// place things or ask about the ground (vegetation, the camera): CPU edits go up with
// upload(); GPU results come down with readback(), which emits 'terrain'.
const LAYERS = {
  rock: ['ground', 0], sediment: ['ground', 1], water: ['ground', 2], snow: ['ground', 3],
  wetness: ['state', 0], temperature: ['state', 1], vegetation: ['state', 2], precipitation: ['state', 3],
};

const Heightfield = {
  res: CONFIG.heightfield.res,
  size: CONFIG.heightfield.size,
  layers: LAYERS,
  version: 0,                        // bumps whenever the CPU mirror changes

  init() {
    const r = this.res, n = r * r;
    this.cell = this.size / (r - 1);  // world distance between neighbouring cells
    this.cpu = { ground: new Float32Array(n * 4), state: new Float32Array(n * 4) };
    this.data = new Float32Array(n);  // ground height (rock + sediment), kept in step with cpu.ground
    this.type = CAPS.floatRenderTarget ? THREE.FloatType : THREE.HalfFloatType;
    this.gpu = {};
    this.staging = {};
    for (const pack of ['ground', 'state']) {
      const [a, b] = [0, 1].map(k => { const t = this.makeTarget(); t.texture.name = `${pack}-${k}`; return t; });
      this.gpu[pack] = { read: a, write: b };
      const s = new THREE.DataTexture(this.cpu[pack], r, r, THREE.RGBAFormat, THREE.FloatType);
      s.minFilter = s.magFilter = THREE.NearestFilter;
      this.staging[pack] = s;
    }
    this.uniforms = {
      uLayerGround: { value: this.gpu.ground.read.texture },
      uLayerState: { value: this.gpu.state.read.texture },
      uHeightGrid: { value: new THREE.Vector2(this.size, r) },
    };
    const tri = new THREE.BufferGeometry();
    tri.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-1, -1, 0, 3, -1, 0, -1, 3, 0]), 3));
    this.quad = new THREE.Mesh(tri);
    this.quad.frustumCulled = false;
    this.quadCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.copy = this.passMaterial('uniform sampler2D tSrc;\nvoid main() { gl_FragColor = texelFetch(tSrc, ivec2(gl_FragCoord.xy), 0); }', { tSrc: { value: null } });
    this.halfScratch = this.type === THREE.HalfFloatType ? new Uint16Array(n * 4) : null;
  },

  // A float render target the size of the grid, for layers and for a simulation's
  // own working state (flux, velocity…). Nearest-filtered: read it with texelFetch.
  makeTarget() {
    return new THREE.WebGLRenderTarget(this.res, this.res, {
      type: this.type, format: THREE.RGBAFormat,
      minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
      wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
      depthBuffer: false, generateMipmaps: false,
    });
  },

  // A full-grid pass. The fragment shader runs once per cell (gl_FragCoord.xy is the
  // cell) and gets HEIGHTFIELD_GLSL and Heightfield.uniforms; extra uniforms merge in.
  passMaterial(fragment, uniforms = {}) {
    return new THREE.ShaderMaterial({
      uniforms: { ...this.uniforms, ...uniforms },
      vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }',
      fragmentShader: HEIGHTFIELD_GLSL + '\n' + fragment,
      depthTest: false, depthWrite: false, blending: THREE.NoBlending,
    });
  },

  // Render material over the whole grid into target.
  render(material, target) {
    const prev = renderer.getRenderTarget();
    this.quad.material = material;
    renderer.setRenderTarget(target);
    renderer.render(this.quad, this.quadCamera);
    renderer.setRenderTarget(prev);
  },

  // Render into a pack's write target and swap it in ('ground' or 'state').
  step(pack, material) {
    const p = this.gpu[pack];
    this.render(material, p.write);
    [p.read, p.write] = [p.write, p.read];
    this.uniforms[pack === 'ground' ? 'uLayerGround' : 'uLayerState'].value = p.read.texture;
  },

  // CPU mirror → GPU, after the CPU has written layers (a new island).
  upload() {
    for (const pack of ['ground', 'state']) {
      this.staging[pack].needsUpdate = true;
      this.copy.uniforms.tSrc.value = this.staging[pack];
      this.step(pack, this.copy);
    }
    this.changed();
  },

  // GPU → CPU mirror, after GPU passes have changed layers. It stalls the GPU briefly
  // (a few ms at 256²), so call it now and then, not every frame.
  readback() {
    for (const pack of ['ground', 'state']) this.readTarget(this.gpu[pack].read, this.cpu[pack]);
    this.changed();
    App.emit('terrain');
  },

  // The same without stalling: both packs are read into GPU-side pixel buffers now, and
  // the job's take() copies them out whenever the caller chooses. By then the copy has
  // long finished (if not, take() waits for it), and either way it returns the layers as
  // they were when asked for, so the mirror changes at the same sim step whatever the
  // frame rate. applyReadback() puts the data in. Half-float targets read at once.
  readbackAsync() {
    const r = this.res, packs = ['ground', 'state'], gl = renderer.getContext();
    const out = { ground: new Float32Array(r * r * 4), state: new Float32Array(r * r * 4) };
    if (this.halfScratch) {
      for (const pack of packs) this.readTarget(this.gpu[pack].read, out[pack]);
      return { take: () => out };
    }
    const buffers = {}, current = renderer.getRenderTarget();
    for (const pack of packs) {
      buffers[pack] = gl.createBuffer();
      gl.bindBuffer(gl.PIXEL_PACK_BUFFER, buffers[pack]);
      gl.bufferData(gl.PIXEL_PACK_BUFFER, out[pack].byteLength, gl.STREAM_READ);
      renderer.state.bindFramebuffer(gl.FRAMEBUFFER, renderer.properties.get(this.gpu[pack].read).__webglFramebuffer);
      gl.readPixels(0, 0, r, r, gl.RGBA, gl.FLOAT, 0);
    }
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    renderer.state.bindFramebuffer(gl.FRAMEBUFFER, current ? renderer.properties.get(current).__webglFramebuffer : null);
    const fence = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
    gl.flush();
    return {
      take: () => {
        gl.clientWaitSync(fence, 0, 0);   // (done long ago in play; the browser warns if this is never asked)
        gl.deleteSync(fence);
        for (const pack of packs) {
          gl.bindBuffer(gl.PIXEL_PACK_BUFFER, buffers[pack]);
          gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, out[pack]);
          gl.deleteBuffer(buffers[pack]);
        }
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
        return out;
      },
    };
  },

  readTarget(rt, out) {
    if (this.halfScratch) {
      renderer.readRenderTargetPixels(rt, 0, 0, this.res, this.res, this.halfScratch);
      for (let k = 0; k < out.length; k++) out[k] = THREE.DataUtils.fromHalfFloat(this.halfScratch[k]);
    } else renderer.readRenderTargetPixels(rt, 0, 0, this.res, this.res, out);
  },

  applyReadback(data) {
    this.cpu.ground.set(data.ground);
    this.cpu.state.set(data.state);
    this.changed();
    App.emit('terrain');
  },

  changed() {
    const g = this.cpu.ground, d = this.data;
    for (let k = 0; k < d.length; k++) d[k] = g[4 * k] + g[4 * k + 1];
    this.version++;
  },

  // World x (or z) of grid column (or row) i.
  coord(i) { return (i / (this.res - 1) - 0.5) * this.size; },
  index(i, j) { return j * this.res + i; },
  get(layer, k) { const [p, c] = LAYERS[layer]; return this.cpu[p][4 * k + c]; },
  set(layer, k, v) { const [p, c] = LAYERS[layer]; this.cpu[p][4 * k + c] = v; },

  // Bilinear ground height at world (x, z), clamped to the grid's edge.
  sample(x, z) { return this.bilinear(this.data, 1, 0, x, z); },
  // Bilinear value of any layer at world (x, z).
  sampleLayer(layer, x, z) { const [p, c] = LAYERS[layer]; return this.bilinear(this.cpu[p], 4, c, x, z); },

  bilinear(arr, stride, off, x, z) {
    const r = this.res;
    const fx = THREE.MathUtils.clamp((x / this.size + 0.5) * (r - 1), 0, r - 1.001);
    const fz = THREE.MathUtils.clamp((z / this.size + 0.5) * (r - 1), 0, r - 1.001);
    const i = Math.floor(fx), j = Math.floor(fz), u = fx - i, v = fz - j;
    const at = (ii, jj) => arr[(jj * r + ii) * stride + off];
    const a = at(i, j), b = at(i + 1, j), c = at(i, j + 1), e = at(i + 1, j + 1);
    return (a + (b - a) * u) * (1 - v) + (c + (e - c) * u) * v;
  },
};

// GLSL side of the layer store; a material using it needs Heightfield.uniforms.
// layerAt() is the twin of sampleLayer(): bilinear between texel centres, done by
// hand because float textures need not be filterable.
const HEIGHTFIELD_GLSL = /* glsl */`
uniform sampler2D uLayerGround;   // rock, sediment, water, snow (world units)
uniform sampler2D uLayerState;    // wetness, temperature °C, vegetation, precipitation mm/h
uniform vec2 uHeightGrid;         // world size, res
vec2 gridCoord(vec2 xz) { return clamp((xz / uHeightGrid.x + 0.5) * (uHeightGrid.y - 1.0), 0.0, uHeightGrid.y - 1.001); }
vec4 layerCell(sampler2D t, ivec2 c) { return texelFetch(t, clamp(c, ivec2(0), ivec2(int(uHeightGrid.y) - 1)), 0); }
vec4 layerAt(sampler2D t, vec2 xz) {
  vec2 g = gridCoord(xz), f = fract(g);
  ivec2 i = ivec2(g);
  vec4 a = texelFetch(t, i, 0), b = texelFetch(t, i + ivec2(1, 0), 0);
  vec4 c = texelFetch(t, i + ivec2(0, 1), 0), d = texelFetch(t, i + ivec2(1, 1), 0);
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float groundHeight(vec2 xz) { vec4 g = layerAt(uLayerGround, xz); return g.r + g.g; }
float groundHeightCell(ivec2 c) { vec4 g = layerCell(uLayerGround, c); return g.r + g.g; }
float surfaceCell(ivec2 c) { vec4 g = layerCell(uLayerGround, c); return g.r + g.g + g.a; }`;

// ── Island generator ────────────────────────────────────────────────────────
// Fills every layer for a seed. Shape: a domain-warped radial falloff with a noisy
// coastline; one summit (a little off centre) made of a sharp cone on a broad base;
// ridged-noise spurs running down from it with valleys between; rolling hills on the
// coastal plain; then a sandy shelf, a lagoon, a broken fringing reef just under the
// sea, and a drop to deep water at the grid's edge. The other layers follow from the
// height: sediment thick on gentle ground and sand on the beach, thin on steep rock;
// temperature from the lapse rate; snow where that is below freezing; the shore wet;
// vegetation where it is low, warm, gentle and soiled.

const Terrain = {
  summit: new THREE.Vector3(),

  init() {
    Heightfield.init();
    this.mesh = this.buildMesh();
    scene.add(this.mesh);
    this.generate(App.rng.fork('terrain'));
    App.on('seed', rng => this.generate(rng.fork('terrain')));   // before Vegetation re-places plants
  },

  generate(rng) {
    const T = CONFIG.terrain, V = CONFIG.vegetation, H = Heightfield, r = H.res, R = H.size / 2;
    const ss = THREE.MathUtils.smoothstep, lerp = THREE.MathUtils.lerp;
    const warpN = gradientNoise2D(rng.fork('warp')), coastN = gradientNoise2D(rng.fork('coast'));
    const ridgeN = gradientNoise2D(rng.fork('ridges')), hillN = gradientNoise2D(rng.fork('hills'));
    const reefN = gradientNoise2D(rng.fork('reef')), soilN = gradientNoise2D(rng.fork('soil'));
    // Fractal sum in about [−1, 1], and ridged (sharp crests) in [0, 1].
    const fbm = (n, x, z, oct) => {
      let s = 0, a = 1, f = 1, norm = 0;
      for (let o = 0; o < oct; o++) { s += a * n(x * f + o * 17.3, z * f - o * 9.1); norm += a; a *= 0.5; f *= 2.02; }
      return s / norm;
    };
    const ridged = (n, x, z, oct) => {
      let s = 0, a = 1, f = 1, w = 1, norm = 0;
      for (let o = 0; o < oct; o++) {
        let v = 1 - Math.abs(n(x * f + o * 31.7, z * f + o * 12.9));
        v *= v * w;
        w = THREE.MathUtils.clamp(v * 1.5, 0, 1);   // finer crests only along the bigger ones
        s += v * a; norm += a; a *= 0.5; f *= 2.1;
      }
      return s / norm;
    };

    const pa = rng.range(0, Math.PI * 2), pd = rng.range(0.3, 1) * T.peakOffset;
    const px = Math.cos(pa) * pd, pz = Math.sin(pa) * pd;
    const h = H.data;
    for (let j = 0; j < r; j++) {
      for (let i = 0; i < r; i++) {
        const x = H.coord(i), z = H.coord(j);
        const wx = x + 16 * fbm(warpN, x / 95, z / 95, 3), wz = z + 16 * fbm(warpN, x / 95 + 7.1, z / 95 + 3.4, 3);
        const th = Math.atan2(wz, wx);
        const rr = Math.hypot(wx, wz) / R
          - T.coastWobble * fbm(coastN, Math.cos(th) * 1.3 + 4, Math.sin(th) * 1.3 + 4, 3)
          - 0.035 * fbm(coastN, wx / 28, wz / 28, 2);

        // The mountain: a sharp cone on a broad base, with spurs down its flanks.
        const dx = wx - px, dz = wz - pz, dp = Math.hypot(dx, dz) / R, phi = Math.atan2(dz, dx);
        const [cs, cw] = T.cone, [sr, sk] = T.shield;
        const cone = cs * Math.exp(-((dp / cw) ** 2)) + (1 - cs) * Math.max(0, 1 - dp / sr) ** sk;
        const spur = ridged(ridgeN, Math.cos(phi) * T.spokes + dp * 2.4, Math.sin(phi) * T.spokes - dp * 1.8, 3);
        const flank = ss(dp, 0.04, 0.16) * (1 - ss(dp, 0.36, 0.62));
        const mountain = Math.max(0, T.peak * cone * (0.92 + 0.08 * fbm(hillN, wx / 50, wz / 50, 2)) + T.ridges * (spur - 0.38) * flank);

        // Coastal plain with hills, and the sea floor: shelf, lagoon, reef, deep.
        const land = 1 - ss(rr, T.coast[0], T.coast[1]);
        const plain = T.lowland + T.hills * fbm(hillN, wx / 42, wz / 42, 4) * ss(land, 0.3, 1);
        const reef = Math.exp(-(((rr - T.reef[0]) / T.reef[1]) ** 2)) * ss(fbm(reefN, wx / 26, wz / 26, 3), -0.3, 0.1);
        let sea = lerp(T.lagoon, T.deep, ss(rr, T.reef[0] + 0.015, 0.99));
        sea = lerp(sea, T.reef[2], reef);
        h[j * r + i] = mountain + lerp(sea, plain, land);
      }
    }
    this.summit.set(0, -Infinity, 0);
    for (let k = 0; k < h.length; k++) if (h[k] > this.summit.y) this.summit.set(H.coord(k % r), h[k], H.coord(Math.floor(k / r)));

    // Layers that follow from the height.
    const G = H.cpu.ground, S = H.cpu.state, e = H.cell;
    const perUnit = T.lapseRate / 1000 * T.metresPerUnit;   // °C cooler per unit of height
    const at = (i, j) => h[THREE.MathUtils.clamp(j, 0, r - 1) * r + THREE.MathUtils.clamp(i, 0, r - 1)];
    for (let j = 0; j < r; j++) {
      for (let i = 0; i < r; i++) {
        const k = j * r + i, x = H.coord(i), z = H.coord(j), hk = h[k];
        const sx = (at(i + 1, j) - at(i - 1, j)) / (2 * e), sz = (at(i, j + 1) - at(i, j - 1)) / (2 * e);
        const slope = Math.hypot(sx, sz), up = 1 / Math.sqrt(1 + slope * slope);
        const n = fbm(soilN, x / 22, z / 22, 3) * 0.5 + 0.5;
        let sed = T.soilDepth * (1 - ss(slope, 0.3, 0.9)) * (1 - ss(hk, 70, 120)) * (0.7 + 0.6 * n);
        sed = Math.max(sed, T.sandDepth * (1 - ss(hk, T.beachTop, T.beachTop + 2.5)) * (1 - ss(slope, 0.5, 1.1)));
        const temp = T.seaLevelTemp - perUnit * Math.max(hk, 0);
        const snow = temp < 0 ? Math.min(1.4, -temp * 0.45) * ss(up, 0.42, 0.62) : 0;
        const veg = ss(hk, V.band[0], V.band[0] + 2.5) * (1 - ss(hk, V.band[1] - 8, V.band[1]))
          * ss(up, V.minUp, V.minUp + 0.04) * ss(sed, 0.25, 0.6) * ss(temp, 1, 3.5) * (0.55 + 0.45 * n);
        G[4 * k] = hk - sed; G[4 * k + 1] = sed; G[4 * k + 2] = 0; G[4 * k + 3] = snow;
        S[4 * k] = 1 - ss(hk, -0.3, 0.9); S[4 * k + 1] = temp; S[4 * k + 2] = veg; S[4 * k + 3] = 0;
      }
    }
    H.upload();
  },

  // One vertex per cell; the vertex shader lifts each to its cell's surface height
  // and takes its normal from the neighbours, so whatever changes the layers on the
  // GPU (erosion, snow) reshapes the mesh with no CPU work and no rebuild. The
  // shadow pass uses the same lift through its own depth material.
  buildMesh() {
    const H = Heightfield, P = Look.palette, T = CONFIG.terrain;
    const geo = new THREE.PlaneGeometry(H.size, H.size, H.res - 1, H.res - 1);
    geo.rotateX(-Math.PI / 2);
    const names = ['sand', 'sandWet', 'soil', 'grass', 'grassDry', 'rock', 'rockDark', 'snow'];
    const uniforms = {
      ...H.uniforms,
      ...Object.fromEntries(names.map(n => ['p_' + n, { value: P[n] }])),
      uTerrainLook: { value: new THREE.Vector4(T.beachTop, T.rockSlope, T.dryGrassAbove, T.wetDarken) },
      uSnowCover: { value: T.snowCover }, uPlantCold: Vegetation.cold,
      uDebug: { value: new THREE.Vector4() },
      p_debugA: { value: P.waterDeep }, p_debugB: { value: P.waterShallow }, p_debugC: { value: P.grass }, p_debugD: { value: P.sun }, p_debugE: { value: P.ember },
      uWetLook: { value: new THREE.Vector3(CONFIG.water.wetGloss, CONFIG.water.wetSheen, CONFIG.water.filmSheen) },
      ...WET_UNIFORMS(),
    };
    const mesh = new THREE.Mesh(geo, Toon.material({
      uniforms,
      vertexPars: HEIGHTFIELD_GLSL,
      vertexMain: TERRAIN_LIFT_GLSL + TERRAIN_NORMAL_GLSL,
      fragmentPars: HEIGHTFIELD_GLSL + SKY_NOISE_GLSL + WET_SHADE_GLSL + TERRAIN_FRAGMENT_PARS(names),
      fragmentMain: TERRAIN_FRAGMENT_MAIN,
      shade: 'wetShade',
    }));
    const depth = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
    depth.onBeforeCompile = shader => {
      Object.assign(shader.uniforms, H.uniforms);
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\n' + HEIGHTFIELD_GLSL)
        .replace('#include <begin_vertex>', '#include <begin_vertex>\n' + TERRAIN_LIFT_GLSL);
    };
    depth.customProgramCacheKey = () => 'terrain-depth';
    mesh.customDepthMaterial = depth;
    mesh.frustumCulled = false;      // its heights live on the GPU, so the CPU bounds would be wrong
    mesh.castShadow = mesh.receiveShadow = true;
    mesh.name = 'terrain';
    return mesh;
  },
};

// Which cell a grid vertex belongs to, and its height there.
const TERRAIN_LIFT_GLSL = /* glsl */`
  ivec2 tCell = ivec2(floor((position.xz / uHeightGrid.x + 0.5) * (uHeightGrid.y - 1.0) + 0.5));
  transformed.y = surfaceCell(tCell);`;

const TERRAIN_NORMAL_GLSL = /* glsl */`
  {
    float e2 = 2.0 * uHeightGrid.x / (uHeightGrid.y - 1.0);
    objectNormal = normalize(vec3(
      surfaceCell(tCell - ivec2(1, 0)) - surfaceCell(tCell + ivec2(1, 0)), e2,
      surfaceCell(tCell - ivec2(0, 1)) - surfaceCell(tCell + ivec2(0, 1))));
  }`;

const TERRAIN_FRAGMENT_PARS = names => names.map(n => `uniform vec3 p_${n};`).join('\n') + /* glsl */`
uniform vec4 uTerrainLook;   // beach top, rock slope, dry grass above, wet darkening
uniform float uSnowCover;    // snow deeper than this hides the ground
uniform vec3 uPlantCold;     // frost now 0…1, ground °C where it starts, where it is full (SNOW)
uniform vec4 uDebug;         // debug overlay: layer (0 off), value at the low end, at the high end (UI)
uniform vec3 p_debugA, p_debugB, p_debugC, p_debugD, p_debugE;
uniform vec3 uWetLook;       // gloss, sheen of fully wet ground, of a film of water (WATER › Wet surfaces)`;

// One palette colour per pixel, chosen from the layers: snow where it lies; bare
// rock where the ground is steep or stripped of sediment (in darker strata on
// cliffs); sand near the sea; grass where vegetation grows (dry upland grass up
// high); soil elsewhere. Wet ground darkens and glosses in two hard steps, and a
// film of water too thin for the water surface mirrors the sky (wetShade). Noise
// wobbles each border so the cells of the grid never show.
const TERRAIN_FRAGMENT_MAIN = /* glsl */`
  vec2 xz = vWorldPos.xz;
  vec4 G = layerAt(uLayerGround, xz), S = layerAt(uLayerState, xz);
  float h = G.r + G.g;
  float up = inverseTransformDirection(N, viewMatrix).y;
  float n = vnoise(xz * 0.09) * 0.75 + vnoise(xz * 0.3 + 7.3) * 0.25 - 0.5;
  bool sand = false;
  if (up < uTerrainLook.y + n * 0.08 || G.g < 0.12 + n * 0.12) {
    float strata = fract(h / 9.0 + n * 0.8);
    albedo = up < uTerrainLook.y - 0.12 && strata < 0.35 || up < uTerrainLook.y - 0.3 ? p_rockDark : p_rock;
  } else if (h < uTerrainLook.x + n * 2.2) {
    albedo = p_sand; sand = true;
  } else if (S.b > 0.3 + n * 0.35) {
    albedo = h > uTerrainLook.z || S.b < 0.38 + n * 0.12 ? p_grassDry : p_grass;   // thin, droughted grass browns
    float frost = uPlantCold.x * smoothstep(uPlantCold.y, uPlantCold.z, S.g);   // a clear cold night's frost
    albedo = mix(albedo, p_snow, 0.6 * toonStep(frost + n * 0.3, 0.45));
  } else {
    albedo = p_soil;
  }
  float w = S.r + n * 0.1;
  float wet = toonStep(w, 0.22) * 0.5 + toonStep(w, 0.6) * 0.5;
  albedo = sand ? mix(p_sand, p_sandWet, wet) : albedo * mix(1.0, uTerrainLook.w, wet);
  float film = toonStep(G.b + n * 0.004, 0.006) * toonStep(up, 0.7);
  gloss = uWetLook.x * max(wet, film);
  wetSheen = max(uWetLook.y * wet, uWetLook.z * film);
  if (G.a > uSnowCover + n * 0.12 && up > 0.38) { albedo = p_snow; gloss = wetSheen = 0.0; }
  // Debug overlay (UI): one layer in eight bands from deep blue (low) to ember (high).
  if (uDebug.x > 0.5) {
    float v = uDebug.x < 1.5 ? G.b : uDebug.x < 2.5 ? G.g : uDebug.x < 3.5 ? S.r : uDebug.x < 4.5 ? G.a : S.g;
    float t = floor(clamp((v - uDebug.y) / (uDebug.z - uDebug.y), 0.0, 1.0) * 7.99) / 7.0;
    albedo = t < 0.25 ? mix(p_debugA, p_debugB, t * 4.0) : t < 0.5 ? mix(p_debugB, p_debugC, t * 4.0 - 1.0)
           : t < 0.75 ? mix(p_debugC, p_debugD, t * 4.0 - 2.0) : mix(p_debugD, p_debugE, t * 4.0 - 3.0);
    gloss = wetSheen = 0.0;
  }`;

// ── Vegetation ──────────────────────────────────────────────────────────────
// Grass tufts and trees, scattered by the Heightfield's vegetation layer and drawn
// as instanced toon meshes that lean in the wind (WIND_GLSL). build() re-places
// them all; it runs for a new island, and whatever moves the ground for good
// (erosion) calls it again after a readback. Between rebuilds each plant follows the
// ground on the GPU (PLANT_LIFT_GLSL), so none floats or sinks while the ground moves.
//
// Grass blades take the ground's normal, so they sit in the same light band as the
// ground under them; they read as grass through their darker roots, lighter tips
// and movement, and gusts lighten the tips as they pass so the wave shows.
// Trees are a trunk and low-poly foliage clumps (round blobs below, stacked cones
// on the upper slopes) with rounded normals so each clump shades as one soft form.

const GRASS_VERTEX_PARS = /* glsl */`
attribute vec2 aBlade;     // per-vertex: sway phase, height along the blade 0…1
uniform float uGrassFlex;
uniform vec3 uPlantCold;   // frost now, ground °C where it starts, where it is full
varying float vBladeH;
varying float vGust;
varying float vWet, vSnow, vFrost, vDry;`;

const GRASS_VERTEX_MAIN = /* glsl */`
 {
  mat3 im = mat3(instanceMatrix);
  float sc = length(im[0]);
  mat3 toLocal = transpose(im) / sc;            // world direction → this tuft's (rotated) frame
  vec2 root = (modelMatrix * vec4(instanceMatrix[3].xyz, 1.0)).xz;
  float h = aBlade.y;
  float gust = windGust(root);
  vec2 w = windAt(root, gust);
  vec2 lean = windLean(w, root, aBlade.x + root.x * 0.07 + root.y * 0.05);
  float l2 = min(dot(lean, lean), 1.5);
  transformed += toLocal * vec3(lean.x, 0.0, lean.y) * (h * h * position.y * uGrassFlex);
  transformed.y *= 1.0 - 0.28 * l2 * h;           // a bent blade is shorter
  vec4 G0 = layerAt(uLayerGround, root);
  transformed.y *= 1.0 - 0.92 * smoothstep(0.02, 0.2, G0.b);   // flattened under standing water
  transformed.y *= 1.0 - smoothstep(0.03, 0.35, G0.a);           // buried under snow
  vec4 S1 = layerAt(uLayerState, root);
  transformed *= smoothstep(0.14, 0.3, S1.b);                      // thinned out where the vegetation has (stripped soil, drought)
  vDry = 1.0 - smoothstep(0.32, 0.5, S1.b);
  float e = uHeightGrid.x / (uHeightGrid.y - 1.0);   // the ground's normal under the tuft, as it is now
  objectNormal = toLocal * normalize(vec3(groundHeight(root - vec2(e, 0.0)) - groundHeight(root + vec2(e, 0.0)), 2.0 * e,
                                          groundHeight(root - vec2(0.0, e)) - groundHeight(root + vec2(0.0, e))));
  vBladeH = h;
  vGust = gust * min(length(w) / uWindGust.w, 1.0);
  vec4 S0 = layerAt(uLayerState, root);
  vWet = S0.r;
  vSnow = G0.a;
  vFrost = uPlantCold.x * smoothstep(uPlantCold.y, uPlantCold.z, S0.g);
 }`;

// Plants on wet ground are wet too: darker, and glossy (in the ground's two steps).
// In the cold, snow on the ground under them (vSnow, depth) and frost (vFrost 0…1).
const PLANT_WET_GLSL = /* glsl */`
uniform vec2 uPlantWet;   // darkening, gloss when fully wet
uniform vec3 uPlantCold;  // frost now 0…1 (SNOW), ground °C where it starts, where it is full
uniform vec3 p_snow;
varying float vWet, vSnow, vFrost;
float plantWet() { return toonStep(vWet, 0.22) * 0.5 + toonStep(vWet, 0.6) * 0.5; }`;

const GRASS_FRAGMENT_PARS = PLANT_WET_GLSL + /* glsl */`
uniform vec3 p_foliageDark, p_grassDry;
varying float vDry;
varying float vBladeH;
varying float vGust;`;

const GRASS_FRAGMENT_MAIN = /* glsl */`
  N = normalize(vViewNormal);                     // both faces take the ground's normal
  inked = false;                                  // blades would scribble ink all over the meadow
  vec3 ground = mix(albedo, p_grassDry, toonStep(vDry, 0.5) * 0.8);   // the ground colour under this tuft, browned in a drought
  vec3 root = mix(ground, p_foliageDark, 0.4);
  vec3 tip = mix(ground, p_grassDry, 0.22 + 0.4 * clamp(vGust, 0.0, 1.0));
  albedo = mix(root, ground, smoothstep(0.0, 0.45, vBladeH));
  albedo = mix(albedo, tip, smoothstep(0.55, 0.95, vBladeH));
  float wet = plantWet();
  albedo *= mix(1.0, uPlantWet.x, wet);
  gloss = uPlantWet.y * wet * vBladeH;
  // Frost whitens the tips; a dusting of snow catches on them.
  float rime = max(toonStep(vFrost, 0.35), 0.7 * toonStep(vSnow, 0.015)) * smoothstep(0.3, 0.75, vBladeH);
  albedo = mix(albedo, p_snow, 0.85 * rime);
  gloss *= 1.0 - rime;`;

const TREE_VERTEX_PARS = /* glsl */`
attribute vec2 aTree;      // per-vertex: height up the tree 0…1, foliage 1 / bark 0
attribute float aVar;      // per-tree: 0…1 variation
attribute float aScorch;   // per-tree: 0 … 1 scorched black by lightning
uniform float uTreeFlex;
varying float vFoliage;
varying float vVar;
varying float vScorch;`;

// A plant stands on the ground as it is now, not as it was when build() placed it
// (erosion moves the ground between rebuilds): lift the instance by the difference.
// `sink` is how far below the ground build() set its root.
const PLANT_LIFT_GLSL = sink => /* glsl */`
  {
    vec3 rootW = (modelMatrix * vec4(instanceMatrix[3].xyz, 1.0)).xyz;
    float sc0 = length(instanceMatrix[0].xyz);
    transformed += transpose(mat3(instanceMatrix)) * vec3(0.0, groundHeight(rootW.xz) - ${sink} - rootW.y, 0.0) / (sc0 * sc0);
  }`;

// Shared by the toon material and the shadow-depth material, so shadows sway too.
const TREE_SWAY_GLSL = /* glsl */`
  {
    mat3 im = mat3(instanceMatrix);
    float sc = length(im[0]);
    mat3 toLocal = transpose(im) / sc;
    vec2 root = (modelMatrix * vec4(instanceMatrix[3].xyz, 1.0)).xz;
    vec2 lean = windLean(root, aVar * 6.2831853);
    float s = length(lean);
    // The whole tree bends from the root, more toward the top…
    transformed += toLocal * vec3(lean.x, 0.0, lean.y) * (aTree.x * position.y * uTreeFlex);
    // …and the foliage flutters in place.
    float t = uWindTime * (3.0 + 2.0 * s);
    transformed += aTree.y * s * 0.14 * vec3(
      sin(t + position.y * 1.3 + aVar * 17.0),
      0.5 * sin(t * 1.3 + position.x * 1.7),
      cos(t * 0.9 + position.z * 1.5 + aVar * 11.0));
  }`;

const TREE_FRAGMENT_PARS = PLANT_WET_GLSL + /* glsl */`
uniform vec3 p_grassDry, p_ink;
varying float vFoliage;
varying float vVar;
varying float vScorch;`;

// The vegetation layer over time (one state pass a sim step): it thickens and greens
// toward what the cell can carry when the ground is moist (after rain), thins and browns
// in long warm dry spells (never below a share of it, the roots survive), and dies back
// where the soil it needs has gone (erosion) or the cell has become sea. What a cell can
// carry: the generator's rule (height band, gentle slope, soil, warmth), patched.
const VEGETATION_GROW_GLSL = /* glsl */`
uniform vec4 uGrow;       // dt; greening per s when moist; browning per s in drought; dying back per s where it cannot grow
uniform vec4 uGrowBand;   // height band low, high; flattest up-component
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 G = layerCell(uLayerGround, c), S = layerCell(uLayerState, c);
  float h = G.r + G.g, dt = uGrow.x, cell = uHeightGrid.x / (uHeightGrid.y - 1.0);
  float up = normalize(vec3(groundHeightCell(c - ivec2(1, 0)) - groundHeightCell(c + ivec2(1, 0)), 2.0 * cell,
                            groundHeightCell(c - ivec2(0, 1)) - groundHeightCell(c + ivec2(0, 1)))).y;
  float can = smoothstep(uGrowBand.x, uGrowBand.x + 2.5, h) * (1.0 - smoothstep(uGrowBand.y - 8.0, uGrowBand.y, h))
            * smoothstep(uGrowBand.z, uGrowBand.z + 0.04, up) * smoothstep(0.25, 0.6, G.g) * smoothstep(1.0, 3.5, S.g);
  float patchy = 0.55 + 0.45 * (vnoise(vec2(c) * 0.09) * 0.7 + vnoise(vec2(c) * 0.23 + 3.1) * 0.3);
  float v = S.b;
  float moist = smoothstep(0.15, 0.4, S.r);
  float drought = (1.0 - smoothstep(0.03, 0.12, S.r)) * smoothstep(10.0, 22.0, S.g) * (1.0 - step(0.02, G.a));
  v += dt * uGrow.y * moist * max(can * patchy - v, 0.0);
  v -= dt * uGrow.z * drought * max(v - 0.3 * can, 0.0);
  v -= dt * uGrow.w * max(v - can, 0.0);
  gl_FragColor = vec4(S.rg, clamp(v == v ? v : 0.0, 0.0, 1.0), S.a);
}`;

const Vegetation = {
  trees: [],            // { x, y, z, height, kind } for systems that need them (lightning, snow)
  group: null,

  init() {
    this.growPass = Heightfield.passMaterial(SKY_NOISE_GLSL + VEGETATION_GROW_GLSL, {
      uGrow: { value: new THREE.Vector4(0, ...CONFIG.vegetation.grow) },
      uGrowBand: { value: new THREE.Vector4(...CONFIG.vegetation.band, CONFIG.vegetation.minUp, 0) },
    });
    Loop.onSim(dt => { this.growPass.uniforms.uGrow.value.x = dt; Heightfield.step('state', this.growPass); });
    this.build(App.rng.fork('vegetation'));
    App.on('seed', rng => this.build(rng.fork('vegetation')));   // runs after the island has rebuilt
    App.on('terrain', () => { for (const t of this.trees) t.y = Heightfield.sample(t.x, t.z); });   // they stand on the ground as it is now
  },

  // 0…1 where plants can grow: the terrain's vegetation layer.
  densityAt(x, z) { return Heightfield.sampleLayer('vegetation', x, z); },

  build(rng) {
    if (this.group) {
      scene.remove(this.group);
      this.group.traverse(o => { o.geometry?.dispose(); o.material?.dispose(); o.customDepthMaterial?.dispose(); });
    }
    this.group = new THREE.Group();
    this.group.name = 'vegetation';
    this.grass = this.buildGrass(rng.fork('grass'));
    this.group.add(this.grass);
    for (const m of this.buildTrees(rng.fork('trees'))) this.group.add(m);
    scene.add(this.group);
  },

  // ── Grass ──
  tuftGeometry(rng) {
    const V = CONFIG.vegetation, pos = [], blade = [], index = [];
    for (let b = 0; b < V.grassBlades; b++) {
      const a = rng.range(0, Math.PI * 2), r = rng.range(0, 0.38);
      const ox = Math.cos(a) * r, oz = Math.sin(a) * r;
      const face = rng.range(0, Math.PI * 2);
      const sx = Math.cos(face), sz = Math.sin(face);              // across the blade
      const lean = rng.range(0.08, 0.35), la = a + rng.range(-0.6, 0.6);
      const lx = Math.cos(la) * lean, lz = Math.sin(la) * lean;     // outward curl at the tip
      const H = rng.range(0.65, 1.0), w = rng.range(0.08, 0.12), phase = rng.range(0, Math.PI * 2);
      const base = pos.length / 3;
      const ring = [[0, 1], [0.5, 0.65]];                           // height fraction, width fraction
      for (const [f, wf] of ring) {
        const cx = ox + lx * f * f, cz = oz + lz * f * f;
        for (const side of [-1, 1]) {
          pos.push(cx + side * sx * w * wf * 0.5, H * f, cz + side * sz * w * wf * 0.5);
          blade.push(phase, f);
        }
      }
      pos.push(ox + lx, H, oz + lz);
      blade.push(phase, 1);
      index.push(base, base + 1, base + 2, base + 1, base + 3, base + 2, base + 2, base + 3, base + 4);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(pos.map((_, i) => i % 3 === 1 ? 1 : 0), 3));
    geo.setAttribute('aBlade', new THREE.Float32BufferAttribute(blade, 2));
    geo.setIndex(index);
    return geo;
  },

  buildGrass(rng) {
    const V = CONFIG.vegetation, P = Look.palette, size = Heightfield.size;
    const patch = valueNoise2D(rng.fork('patches'));
    const cells = Math.floor(size / V.grassCell), spots = [];
    for (let j = 0; j < cells; j++) {
      for (let i = 0; i < cells; i++) {
        const x = (i + rng.next()) * V.grassCell - size / 2, z = (j + rng.next()) * V.grassCell - size / 2;
        const keep = rng.next(), d = this.densityAt(x, z);
        // Patchy: thick meadows, thinner gaps.
        if (d > 0 && keep < d * THREE.MathUtils.smoothstep(patch(x / 28 + 3.1, z / 28 + 7.7), 0.18, 0.5)) spots.push(x, z);
      }
    }

    const count = spots.length / 2;
    const geo = this.tuftGeometry(rng);
    const mat = Toon.material({
      side: THREE.DoubleSide,
      uniforms: {
        ...Heightfield.uniforms, ...Wind.uniforms,
        uGrassFlex: { value: V.grassFlex }, uPlantWet: this.wetUniform(), uPlantCold: this.cold, p_snow: { value: P.snow },
        p_foliageDark: { value: P.foliageDark }, p_grassDry: { value: P.grassDry },
      },
      vertexPars: HEIGHTFIELD_GLSL + SKY_NOISE_GLSL + WIND_GLSL + GRASS_VERTEX_PARS,
      vertexMain: GRASS_VERTEX_MAIN + PLANT_LIFT_GLSL('0.15'),
      fragmentPars: GRASS_FRAGMENT_PARS,
      fragmentMain: GRASS_FRAGMENT_MAIN,
    });
    const mesh = new THREE.InstancedMesh(geo, mat, count);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
    const yAxis = new THREE.Vector3(0, 1, 0);
    for (let k = 0; k < count; k++) {
      const x = spots[2 * k], z = spots[2 * k + 1], h = Heightfield.sample(x, z);
      q.setFromAxisAngle(yAxis, rng.range(0, Math.PI * 2));
      s.setScalar(rng.range(V.grassHeight[0], V.grassHeight[1]));
      m.compose(p.set(x, h - 0.15, z), q, s);
      mesh.setMatrixAt(k, m);
      mesh.setColorAt(k, h > CONFIG.terrain.dryGrassAbove ? P.grassDry : P.grass);   // the ground colour, as the terrain paints it
    }
    mesh.receiveShadow = true;
    mesh.castShadow = false;
    mesh.name = 'grass';
    return mesh;
  },

  // ── Trees ──
  // One tree geometry: trunk plus foliage, non-indexed, with colour and aTree.
  treeGeometry(kind, rng) {
    const P = Look.palette, parts = [];
    const add = (geo, color, foliage, normalFn) => parts.push({ geo: geo.index ? geo.toNonIndexed() : geo, color, foliage, normalFn });
    let top;
    if (kind === 'broad') {
      const trunkH = rng.range(3.5, 5.5);
      add(new THREE.CylinderGeometry(0.35, 0.55, trunkH + 1, 5, 1, true).translate(0, (trunkH + 1) / 2, 0), P.bark, 0);
      const R = rng.range(2.6, 3.4), blobs = rng.int(3, 5);
      const jitter = new Map();
      for (let b = 0; b < blobs; b++) {
        const main = b === 0;
        const r = main ? R : R * rng.range(0.55, 0.8);
        const a = rng.range(0, Math.PI * 2), d = main ? 0 : R * rng.range(0.45, 0.75);
        const c = new THREE.Vector3(Math.cos(a) * d, trunkH + R * (main ? 0.7 : rng.range(0.2, 1.0)), Math.sin(a) * d);
        const geo = new THREE.IcosahedronGeometry(r, 1);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {               // lumpy, but shared corners stay joined
          const key = `${pos.getX(i).toFixed(3)},${pos.getY(i).toFixed(3)},${pos.getZ(i).toFixed(3)}`;
          if (!jitter.has(key)) jitter.set(key, rng.range(0.86, 1.1));
          const f = jitter.get(key);
          pos.setXYZ(i, pos.getX(i) * f, pos.getY(i) * f * 0.82, pos.getZ(i) * f);
        }
        geo.translate(c.x, c.y, c.z);
        const color = new THREE.Color().copy(P.foliage).lerp(P.foliageDark, main ? 0 : rng.range(0.25, 0.55));
        // Rounded normals out from the blob's centre, tipped up so the crown catches the light.
        add(geo, color, 1, (p, out) => out.subVectors(p, c).normalize().add(new THREE.Vector3(0, 0.35, 0)).normalize());
      }
      top = trunkH + R * 1.6;
    } else {
      const trunkH = rng.range(2.2, 3.2), tiers = rng.int(3, 4);
      add(new THREE.CylinderGeometry(0.25, 0.45, trunkH + 1, 5, 1, true).translate(0, (trunkH + 1) / 2, 0), P.bark, 0);
      const R0 = rng.range(3.0, 3.6);
      let y = trunkH;
      for (let t = 0; t < tiers; t++) {
        const r = R0 * (1 - t * 0.22), h = 4.6 * (1 - t * 0.1);
        const geo = new THREE.ConeGeometry(r, h, 7, 1).rotateY(rng.range(0, Math.PI)).translate(0, y + h / 2, 0);
        const color = new THREE.Color().copy(P.foliageDark).lerp(P.foliage, t / tiers * 0.6);
        add(geo, color, 1, (p, out, n) => n.y < -0.9 ? out.copy(n)
          : out.set(p.x, 0, p.z).normalize().multiplyScalar(Math.min(1, Math.hypot(p.x, p.z) * 4)).add(new THREE.Vector3(0, 0.8, 0)).normalize());
        top = y + h;
        y += h * 0.52;
      }
    }

    // Merge into one geometry.
    let total = 0;
    for (const part of parts) total += part.geo.attributes.position.count;
    const pos = new Float32Array(total * 3), nrm = new Float32Array(total * 3), col = new Float32Array(total * 3), tree = new Float32Array(total * 2);
    const p = new THREE.Vector3(), n = new THREE.Vector3(), out = new THREE.Vector3();
    let v = 0;
    for (const part of parts) {
      const gp = part.geo.attributes.position, gn = part.geo.attributes.normal;
      for (let i = 0; i < gp.count; i++, v++) {
        p.fromBufferAttribute(gp, i); n.fromBufferAttribute(gn, i);
        if (part.normalFn) part.normalFn(p, out, n); else out.copy(n);
        p.toArray(pos, 3 * v); out.toArray(nrm, 3 * v); part.color.toArray(col, 3 * v);
        tree[2 * v] = THREE.MathUtils.clamp(p.y / top, 0, 1);
        tree[2 * v + 1] = part.foliage;
      }
      part.geo.dispose();
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.setAttribute('aTree', new THREE.BufferAttribute(tree, 2));
    geo.userData.height = top;
    return geo;
  },

  buildTrees(rng) {
    const V = CONFIG.vegetation, size = Heightfield.size, ss = THREE.MathUtils.smoothstep;
    const forest = valueNoise2D(rng.fork('forest'));
    const kinds = ['broad', 'pine'];
    const spots = { broad: [], pine: [] };
    this.trees = [];
    const cells = Math.floor(size / V.treeCell);
    for (let j = 0; j < cells; j++) {
      for (let i = 0; i < cells; i++) {
        const x = (i + 0.1 + 0.8 * rng.next()) * V.treeCell - size / 2, z = (j + 0.1 + 0.8 * rng.next()) * V.treeCell - size / 2;
        const keep = rng.next();
        const h = Heightfield.sample(x, z);
        if (h < V.treeBand[0] || h > V.treeBand[1]) continue;
        const f = forest(x / V.forestScale + 5.3, z / V.forestScale + 1.9);
        const d = this.densityAt(x, z) * ss(f, 1 - V.forestCover - 0.08, 1 - V.forestCover + 0.08)
          * ss(h, V.treeBand[0], V.treeBand[0] + 4) * (1 - ss(h, V.treeBand[1] - 10, V.treeBand[1]));
        if (keep < d) spots[h > V.pineAbove + rng.range(-6, 6) ? 'pine' : 'broad'].push(x, z);
      }
    }

    const P = Look.palette, meshes = [];
    for (const kind of kinds) {
      const all = spots[kind];
      // Spread the trees of this kind over its variants.
      const byVariant = Array.from({ length: V.treeVariants }, () => []);
      for (let k = 0; k < all.length; k += 2) byVariant[rng.int(0, V.treeVariants - 1)].push(all[k], all[k + 1]);
      for (let vi = 0; vi < V.treeVariants; vi++) {
        const list = byVariant[vi], count = list.length / 2;
        const geo = this.treeGeometry(kind, rng.fork(`${kind}-${vi}`));
        if (!count) { geo.dispose(); continue; }
        const vars = new Float32Array(count);
        geo.setAttribute('aVar', new THREE.InstancedBufferAttribute(vars, 1));
        geo.setAttribute('aScorch', new THREE.InstancedBufferAttribute(new Float32Array(count), 1));   // LIGHTNING sets it
        const uniforms = { ...Wind.uniforms, uTreeFlex: { value: V.treeFlex }, p_grassDry: { value: P.grassDry }, p_ink: { value: P.ink } };
        const mat = Toon.material({
          vertexColors: true,
          uniforms: { ...uniforms, ...Heightfield.uniforms, uPlantWet: this.wetUniform(), uPlantCold: this.cold, p_snow: { value: P.snow } },
          vertexPars: HEIGHTFIELD_GLSL + SKY_NOISE_GLSL + WIND_GLSL + TREE_VERTEX_PARS + '\nvarying float vWet, vSnow, vFrost;',
          vertexMain: TREE_SWAY_GLSL + PLANT_LIFT_GLSL('0.3') + '\n  vFoliage = aTree.y; vVar = aVar; vScorch = aScorch;'
            + '\n  vec2 rootXZ = (modelMatrix * vec4(instanceMatrix[3].xyz, 1.0)).xz;'
            + '\n  vWet = layerAt(uLayerState, rootXZ).r; vSnow = layerAt(uLayerGround, rootXZ).a; vFrost = 0.0;',
          fragmentPars: TREE_FRAGMENT_PARS,
          fragmentMain: /* glsl */`
  albedo = mix(albedo, p_grassDry, vFoliage * vVar * 0.22);
  float wet = plantWet() * mix(1.0, 0.6, vFoliage);   // bark soaks darker than leaves
  albedo *= mix(1.0, uPlantWet.x, wet);
  gloss = uPlantWet.y * wet;
  // Snow lies on the upper sides once it lies on the ground beneath.
  float up = inverseTransformDirection(N, viewMatrix).y;
  float snowy = toonStep(vSnow, 0.04) * toonStep(up + 0.25 * toonStep(vSnow, 0.4), 0.45 + 0.2 * (1.0 - vFoliage));
  albedo = mix(albedo, p_snow, snowy);
  gloss *= 1.0 - snowy;
  // Struck by lightning: charred black, leaves and bark alike.
  albedo = mix(albedo, mix(p_ink, albedo, 0.12), vScorch);`,
        });
        const mesh = new THREE.InstancedMesh(geo, mat, count);
        mesh.customDepthMaterial = this.swayDepthMaterial({ ...uniforms, ...Heightfield.uniforms });
        const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
        const yAxis = new THREE.Vector3(0, 1, 0);
        for (let k = 0; k < count; k++) {
          const x = list[2 * k], z = list[2 * k + 1], h = Heightfield.sample(x, z);
          const scale = rng.range(0.75, 1.3);
          q.setFromAxisAngle(yAxis, rng.range(0, Math.PI * 2));
          m.compose(p.set(x, h - 0.3, z), q, s.setScalar(scale));
          mesh.setMatrixAt(k, m);
          vars[k] = rng.next();
          this.trees.push({ x, y: h, z, height: geo.userData.height * scale, kind, mesh, index: k });
        }
        mesh.castShadow = mesh.receiveShadow = true;
        mesh.name = `trees-${kind}-${vi}`;
        meshes.push(mesh);
      }
    }
    return meshes;
  },

  // Frost on the grass (SNOW sets x): shared by every plant material.
  cold: { value: new THREE.Vector3(0, CONFIG.snow.frost[0], CONFIG.snow.frost[1]) },

  // Wet plants: darkening and gloss at full wetness (a little less than bare ground's).
  wetUniform() {
    return { value: new THREE.Vector2(mix(1, CONFIG.terrain.wetDarken, 0.8), CONFIG.water.wetGloss * 0.5) };
  },

  // The shadow pass draws trees with this, so their shadows sway with them.
  swayDepthMaterial(uniforms) {
    const m = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
    m.onBeforeCompile = shader => {
      Object.assign(shader.uniforms, uniforms);
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\n' + HEIGHTFIELD_GLSL + SKY_NOISE_GLSL + WIND_GLSL + TREE_VERTEX_PARS)
        .replace('#include <begin_vertex>', '#include <begin_vertex>\n' + TREE_SWAY_GLSL + PLANT_LIFT_GLSL('0.3'));
    };
    m.customProgramCacheKey = () => 'tree-sway-depth';
    return m;
  },
};

// ═════════════════════════════════════════════════════════════════════════════
// ATMOSPHERE — the sun and moon, the sim clock (time of day, seasons), the wind,
// and the weather model: temperature with height, humidity and dew point, pressure,
// fronts (and a storm's cold downdraught), orographic cloud and rain, and the day's
// sea and land breezes; and what the air shows (Air): fog, cloud shadows, god rays
// and the rainbow.
// ═════════════════════════════════════════════════════════════════════════════

// ── Celestial: time of day, sun and moon ────────────────────────────────────
// The one shared time-of-day value. Sky, toon lighting and (later) the heating
// of the land all read sunDir / daylight from here. The day/night cycle advances
// it with setTime(); seasons set declination; moonAge sets the moon's phase.
const SYNODIC_MONTH = 29.53;

function initialHour() {
  const q = new URLSearchParams(location.search).get('time') ?? new URLSearchParams(location.hash.slice(1)).get('time');
  const h = parseFloat(q);
  return Number.isFinite(h) ? h : CONFIG.sky.startHour;
}

// Direction of a body with the given hour angle and declination (radians), seen
// from latitude lat, as a world-space unit vector (+x east, −z north, +y up).
function celestialDirection(hourAngle, decl, lat, out) {
  const east = -Math.cos(decl) * Math.sin(hourAngle);
  const north = Math.cos(lat) * Math.sin(decl) - Math.sin(lat) * Math.cos(decl) * Math.cos(hourAngle);
  const up = Math.sin(lat) * Math.sin(decl) + Math.cos(lat) * Math.cos(decl) * Math.cos(hourAngle);
  return out.set(east, up, -north).normalize();
}

const Celestial = {
  hours: 0,                         // local solar time, 0–24
  declination: 0,                   // degrees; the Clock sets it from the season
  moonAge: CONFIG.sky.moonAge,
  sunDir: new THREE.Vector3(),      // unit vectors toward the bodies
  moonDir: new THREE.Vector3(),
  daylight: 1,                      // 0 full night … 1 full day, eased through twilight
  twilight: 0,                      // 1 when the sun is right at the horizon (sunrise/sunset glow)
  moonLit: 1,                       // illuminated fraction of the moon's disc
  starAngle: 0,                     // rotation of the star field about the pole

  setTime(hours) {
    this.hours = ((hours % 24) + 24) % 24;
    this.update();
  },

  update() {
    const rad = THREE.MathUtils.degToRad, ss = THREE.MathUtils.smoothstep;
    const lat = rad(CONFIG.sky.latitude);
    const H = (this.hours - 12) / 24 * Math.PI * 2;
    celestialDirection(H, rad(this.declination), lat, this.sunDir);
    // The moon lags the sun by its age; at full moon it sits opposite the sun's declination.
    const phase = (this.moonAge / SYNODIC_MONTH) * Math.PI * 2;
    celestialDirection(H - phase, rad(this.declination) * Math.cos(phase), lat, this.moonDir);
    this.moonLit = (1 - Math.cos(phase)) / 2;
    const h = this.sunDir.y;
    this.daylight = ss(h, -0.1, 0.12);
    this.twilight = ss(h, -0.2, 0.0) * (1 - ss(h, 0.05, 0.34));
    this.starAngle = -H;
  },
};

// ── Clock: time of day and season ───────────────────────────────────────────
// The sim clock. It runs on simulated seconds (so time speed and pause apply),
// turns the day at CONFIG.clock.dayLength and the year at yearDays, and is the only
// thing that sets Celestial: the hour, the sun's declination for the season (so the
// sun's path is high in summer and low in winter), and the moon's age.
function initialYear() {
  const q = new URLSearchParams(location.search).get('season') ?? new URLSearchParams(location.hash.slice(1)).get('season');
  const C = CONFIG.clock;
  if (q in C.seasons) return C.seasons[q];
  const f = parseFloat(q);
  return Number.isFinite(f) ? ((f % 1) + 1) % 1 : C.startYear;
}

const Clock = {
  hours: initialHour(),             // local solar time, 0–24
  year: initialYear(),              // fraction of the year, 0 = spring equinox
  yearTarget: null,                 // where setSeason() is gliding to

  init() {
    Loop.onSim(dt => this.step(dt));
  },

  step(dt) {
    const C = CONFIG.clock;
    this.hours = (this.hours + dt * 24 / C.dayLength) % 24;
    let y = this.year + dt / (C.dayLength * C.yearDays);
    if (this.yearTarget !== null) {
      const d = this.yearTarget - y - Math.round(this.yearTarget - y);   // the short way round
      y += d * (1 - Math.exp(-dt / C.seasonGlide));
      if (Math.abs(d) < 2e-4) { y = this.yearTarget; this.yearTarget = null; }
    }
    this.year = ((y % 1) + 1) % 1;
    Celestial.moonAge = (Celestial.moonAge + dt / C.dayLength) % SYNODIC_MONTH;
    this.apply();
  },

  apply() {
    Celestial.declination = CONFIG.clock.tilt * Math.sin(this.year * Math.PI * 2);
    Celestial.setTime(this.hours);
  },

  setHour(h) { this.hours = ((h % 24) + 24) % 24; this.apply(); },
  // A season name or a year fraction. The sun's path glides there in a few seconds.
  setSeason(s) { this.yearTarget = typeof s === 'number' ? ((s % 1) + 1) % 1 : CONFIG.clock.seasons[s]; },

  // The season whose middle is nearest.
  get season() {
    let best = 'spring', bd = Infinity;
    for (const [name, c] of Object.entries(CONFIG.clock.seasons)) {
      const d = Math.abs(this.year - c - Math.round(this.year - c));
      if (d < bd) { bd = d; best = name; }
    }
    return best;
  },

  // A climate value (CONFIG.atmosphere.climate[season][key]) blended smoothly
  // between the two seasons either side of today. For an object of weights
  // (fronts) each weight is blended.
  climate(key) {
    const names = Object.keys(CONFIG.clock.seasons), cs = names.map(n => CONFIG.clock.seasons[n]);
    let a = names.length - 1;
    for (let i = 0; i < names.length; i++) if (cs[i] <= this.year) a = i;
    const b = (a + 1) % names.length;
    const span = ((cs[b] - cs[a]) % 1 + 1) % 1, into = ((this.year - cs[a]) % 1 + 1) % 1;
    const t = THREE.MathUtils.smootherstep(into / span, 0, 1);
    const A = CONFIG.atmosphere.climate[names[a]][key], B = CONFIG.atmosphere.climate[names[b]][key];
    if (typeof A === 'number') return A + (B - A) * t;
    if (Array.isArray(A)) return A.map((v, i) => v + (B[i] - v) * t);
    return Object.fromEntries(Object.keys(A).map(k => [k, A[k] + (B[k] - A[k]) * t]));
  },
};
Clock.apply();

// ── Wind ────────────────────────────────────────────────────────────────────
// The island's wind: a 2D vector field over the terrain. The atmosphere sets one
// direction and speed (eased here so they never jump); the field says what the
// ground does to that wind at each point. It is computed on the CPU from the
// Heightfield's mirror, on a coarse grid (CONFIG.wind.field) of flow per m/s:
//  · over ridges and crests, and higher up, it blows faster
//  · on steep ground it loses part of its uphill push and turns along the slope,
//    so it splits round the peak
//  · in the lee of higher ground upwind it slows, and eddies shed there (the curl
//    of slow noise carried downwind, added in WIND_GLSL) make it swirl
//  · forest drags it down
// The field depends on the direction, so it is recomputed a few rows per sim step

    || particleRand(id, uParticleStep, 4u).x < 0.15 * smoothstep(0.3, 3.0, S.a)                 // rain knocks it down
    || kind < 0.5 && (ws < uDustLift.x - 0.5 * uDustLift.z || G.r + G.g < -0.4);              // sand drops, or lands in the sea
  gl_FragColor = gone ? vec4(0.0, 0.0, 0.0, -1.0) : vec4(xz.x, y, xz.y, s.w);
}`;

// Each live particle is a quad stretched from where it was a moment ago to where it
// is now (extrapolated from the last sim step, so it moves smoothly between steps).
const DUST_DRAW_VERTEX = /* glsl */`
attribute vec2 aCell;      // per particle: its texel in the state texture
uniform vec4 uDustDraw;    // seconds since the last sim step, streak seconds, world width, fewest pixels
uniform vec2 uDustView;    // drawing buffer size, pixels
uniform vec3 uSand, uSoil, uCloud, uSunLight, uShadowTint, uSkyColor;
uniform float uSkyBounce;
varying vec3 vDustColor;
varying float vDustAlpha;
void main() {
  vec4 s = texelFetch(tState, ivec2(aCell), 0);
  vDustAlpha = 0.0;
  vDustColor = vec3(0.0);
  gl_Position = vec4(0.0, 0.0, 2.0, 1.0);   // free: beyond the far plane, so nothing is drawn
  if (s.w < 0.0) return;
  float id = particleId(ivec2(aCell)), kind = dustKind(s);
  float age = dustAge(s) + uDustDraw.x, life = dustLife(id, s);
  vec2 v = dustVelocity(windAt(s.xz), kind);
  vec2 xz = s.xz + v * uDustDraw.x;
  vec4 G = layerAt(uLayerGround, xz);
  vec3 head = vec3(xz.x, max(G.r + G.g + G.a, 0.0) + s.y + 0.1, xz.y);
  vec3 tail = head - vec3(v.x, 0.0, v.y) * uDustDraw.y;
  vec4 ch = projectionMatrix * viewMatrix * vec4(head, 1.0), ct = projectionMatrix * viewMatrix * vec4(tail, 1.0);
  if (ch.w < 1.0 || ct.w < 1.0) return;
  vec2 res = 0.5 * uDustView;
  vec2 A = ct.xy / ct.w * res, B = ch.xy / ch.w * res, d = B - A;
  float L = length(d);
  vec2 t = L > 1e-3 ? d / L : vec2(1.0, 0.0);
  float px = uDustDraw.z * projectionMatrix[1][1] * res.y / ch.w;   // its world width in pixels
  float wpx = max(px, uDustDraw.w);
  vec2 P = mix(A - t * wpx * 0.5, B + t * wpx * 0.5, position.x) + vec2(-t.y, t.x) * position.y * wpx * 0.5;
  gl_Position = vec4(P / res * ch.w, ch.z, ch.w);
  // Fade in and out over its life, and fainter (not bigger) once smaller than a pixel or so.
  // Dust thins as it rises.
  vDustAlpha = smoothstep(0.0, 0.5, age) * (1.0 - smoothstep(life - 0.8, life, age)) * clamp(px / uDustDraw.w, 0.4, 1.0)
    * (kind < 0.5 ? 1.0 : 0.75 - 0.4 * smoothstep(2.0, 20.0, s.y));
  // Blown sand is paler than the beach under it (dry grains catching the light), so it shows.
  vec3 albedo = kind < 0.5 ? mix(uSand, uCloud, 0.5) : mix(uSoil, uSand, 0.45);
  vDustColor = max(albedo * uSunLight, albedo * (uShadowTint + uSkyColor * uSkyBounce));
}`;

const DUST_DRAW_FRAGMENT = /* glsl */`
layout(location = 1) out highp vec4 gNormal;
varying vec3 vDustColor;
varying float vDustAlpha;
void main() {
  if (vDustAlpha < 0.01) discard;
  gl_FragColor = vec4(vDustColor, vDustAlpha * 0.85);
  gNormal = vec4(0.5, 0.5, 1.0, 0.0);   // blends away: alpha 0 leaves the normal under it
}`;

const Dust = {
  init() {
    const D = CONFIG.dust, P = Look.palette, L = Look.uniforms;
    this.particles = new GpuParticles(D.size, SKY_NOISE_GLSL + WIND_GLSL + DUST_COMMON_GLSL + DUST_STEP_GLSL, {
      ...Wind.uniforms,
      uDustMove: { value: new THREE.Vector4(D.drift, ...D.mobility, CONFIG.simHz) },
      uDustLife: { value: new THREE.Vector4(...D.life) },
      uDustLift: { value: new THREE.Vector3(...D.threshold, D.ramp) },
      uDustEmit: { value: new THREE.Vector2(...D.emit) },
      uDustBeach: { value: CONFIG.terrain.beachTop },
    });
    this.uniforms = {
      ...Heightfield.uniforms, ...this.particles.uniforms,
      uDustDraw: { value: new THREE.Vector4(0, D.streak, ...D.width) },
      uDustView: { value: Post.size },
      uSand: { value: P.sand }, uSoil: { value: P.soil }, uCloud: { value: P.cloud }, uSunLight: { value: sun.color },
      uShadowTint: L.uShadowTint, uSkyColor: L.uSkyColor, uSkyBounce: L.uSkyBounce,
    };
    const material = new THREE.ShaderMaterial({
      uniforms: this.uniforms,
      vertexShader: HEIGHTFIELD_GLSL + SKY_NOISE_GLSL + WIND_GLSL + GPU_PARTICLE_GLSL + DUST_COMMON_GLSL + DUST_DRAW_VERTEX,
      fragmentShader: DUST_DRAW_FRAGMENT,
      transparent: true, depthWrite: false,
    });
    material.userData.gbuffer = true;
    this.geometry = this.particles.geometry();
    this.mesh = new THREE.Mesh(this.geometry, material);
    this.mesh.frustumCulled = false;
    this.mesh.name = 'dust';
    scene.add(this.mesh);
    Quality.on('particles', f => { this.geometry.instanceCount = Math.floor(this.particles.count * f); });

    this.reseed(App.rng);
    App.on('seed', rng => this.reseed(rng));
    Loop.onSim(() => this.particles.step());
    Loop.onFrame((dt, time, alpha) => { this.uniforms.uDustDraw.value.x = alpha / CONFIG.simHz; });
  },

  reseed(rng) { this.particles.reset(rng.fork('dust').int(0, 65535)); },
};

// ── Atmosphere: the weather model ───────────────────────────────────────────
// A small model of the air over the island, stepped at the sim rate. Its state is
// a handful of island-wide numbers (air-mass temperature, the land's warming,
// relative humidity, pressure, wind speed and direction), each easing toward a
// target so none ever jumps. The rest follows from them:
//  · temperature at any height: sea-level air minus 6.5 °C per km (the layer)
//  · dew point from temperature and humidity (Magnus), and the cloud base: the
//    height where lifted air cools to its dew point, ≈ 125 m per °C between them
//  · cloud only where air is lifted past that base: by the mountain (wind forced
//    over the peak gives a cap cloud and rain on the windward slopes, and a dry,
//    warmer lee) or by a front (a band of lifted air moving downwind)
//  · the day: the sun warms the land and it cools at night; the land–sea
//    difference blows a sea breeze by day and a land breeze by night
//  · the season (from the Clock): mean temperature, humidity and wind, and how
//    often fronts come and of what kind
// Fronts form out of sight upwind, approach (cloud building on the horizon), pass
// (rain or storm) and move off (clearing), so the weather's stages are places on
// a moving front rather than presets. request() steers it for the controls.
// A GPU pass writes the per-cell results into the layers each step: temperature and
// precipitation (with the rain shadow). What the rain does on the ground is WATER's.

// Dew point °C of air at tempC and relative humidity rh (0…1): the Magnus formula.
function dewPoint(tempC, rh) {
  const b = 17.62, c = 243.12, g = Math.log(Math.max(rh, 1e-3)) + b * tempC / (c + tempC);
  return c * g / (b - g);
}

// Per cell: rain from the front overhead, raised on windward slopes, cut in the
// lee of high ground (the rain shadow); temperature from the lapse rate, warmer in
// the lee (foehn). Wetness and vegetation pass through.
// (Init puts the sky's noise and SKY_CLOUD_GLSL ahead of this, for frontRain().)
const ATMOSPHERE_PASS_GLSL = /* glsl */`
uniform vec2 uAirWind;    // unit vector the wind blows toward
uniform vec4 uAirTemp;    // sea-level air over the land °C, over the sea °C, °C cooler per world unit up, foehn warming °C
uniform vec2 uAirRain;    // orographic rain mm/h, km per world unit
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 G = layerCell(uLayerGround, c), S = layerCell(uLayerState, c);
  float h = G.r + G.g;
  vec2 xz = (vec2(c) / (uHeightGrid.y - 1.0) - 0.5) * uHeightGrid.x;
  // How far the ground upwind rises above this cell: air that crossed it has
  // already rained out on the way up, and sinks, drying and warming, in its lee.
  float barrier = 0.0;
  for (int i = 1; i <= 12; i++) {
    float d = float(i) * 12.0;
    barrier = max(barrier, groundHeight(xz - uAirWind * d) - h - d * 0.1);
  }
  float lee = smoothstep(6.0, 40.0, barrier);
  // Ground rising along the wind forces the air up: the windward slopes.
  float rise = (h - groundHeight(xz - uAirWind * 9.0)) / 9.0;
  float lift = clamp(rise * 3.0, 0.0, 1.0) * smoothstep(2.0, 20.0, h);
  float rain = frontRain(xz * uAirRain.y) * (1.0 + 0.6 * lift) * (1.0 - 0.75 * lee) + uAirRain.x * lift * (1.0 - lee);
  float land = smoothstep(-0.5, 2.5, h);
  float temp = mix(uAirTemp.y, uAirTemp.x, land) - uAirTemp.z * max(h, 0.0) + uAirTemp.w * lee * land;
  gl_FragColor = vec4(S.r, temp, S.b, rain);
}`;

// Cloud puffs take two tones, lit white and the blue-violet shadow band. On a near
// white surface the toon mid band comes out greyer than the sky-lit shadow, and
// reads as a stripe across every puff. The lit side is kept a little smaller, so
// the puffs look rounder.
const CLOUD_SHADE_GLSL = /* glsl */`
vec3 cloudShade(vec3 albedo, vec3 N, vec3 V, float gloss) {
  const vec3 LUMA = vec3(0.2126, 0.7152, 0.0722);
  float up = inverseTransformDirection(N, viewMatrix).y * 0.5 + 0.5;
  vec3 col = albedo * (uShadowTint + uSkyColor * uSkyBounce * up) + uShadowTint * dot(albedo, LUMA) * uShadowHue;
  #if NUM_DIR_LIGHTS > 0
    vec3 lit = albedo * directionalLights[0].color;
    float brighter = step(dot(col, LUMA), dot(lit, LUMA));
    col = mix(col, lit, toonStep(dot(N, directionalLights[0].direction), 0.18) * brighter);
  #endif
  return col;
}`;

const Atmosphere = {
  // State: each value eases toward a target every step.
  temp: 14,            // °C, the air mass at sea level, before the land warms or cools it
  landDT: 0,           // °C the air over the land is above the air mass (sun by day, cooling by night)
  humidity: 0.64,      // relative humidity at sea level over the land, 0…1
  pressure: 1014,      // hPa at sea level
  windSpeed: 7,        // m/s, the prevailing wind
  windFrom: 65,        // compass degrees it blows from
  front: null,         // the front on its way or passing, if any (see spawn())
  quiet: 0,            // seconds until the next front forms
  mode: 'auto',        // 'auto', or the weather the controls asked for (see request())
  // From the controls: a temperature offset, and fixed values (null leaves them natural).
  user: { temperature: 0, humidity: null, windSpeed: null, windFrom: null },

  // Derived from the state each step.
  seaLevelTemp: 14,    // °C at sea level over the land
  seaAirTemp: 14,      // °C over the sea
  peakTemp: 0,         // °C at the summit
  dewPoint: 8,         // °C
  cloudBase: 1,        // km: where lifted air cools to its dew point
  freezingLevel: 2,    // km
  breeze: 0,           // m/s onshore: + sea breeze, − land breeze
  capCloud: 0,         // 0…1, cloud forced up over the peak
  oroRain: 0,          // mm/h on the steepest windward slopes
  foehn: 0,            // °C the lee is warmer for the rain it lost
  cover: 0,            // cloud cover over the island, 0…1
  precip: 0,           // mm/h over the middle of the island
  stormK: 0, fogK: 0,  // 0…1, how stormy and how foggy
  outflow: 0,          // 0…1: a storm's cold downdraught passing over
  phase: 'clear',      // stage of the front: clear, building, overcast, rain, storm, clearing
  name: 'clear',       // what the weather is, in words

  init() {
    this.dir = new THREE.Vector2();   // unit vector the wind blows toward
    this.reseed(App.rng);
    App.on('seed', rng => this.reseed(rng));
    const S = Sky.uniforms;
    this.pass = Heightfield.passMaterial(SKY_NOISE_GLSL + SKY_CLOUD_GLSL + ATMOSPHERE_PASS_GLSL, {
      uCloudOffset: S.uCloudOffset, uCloudSeed: S.uCloudSeed, uCloudCover: S.uCloudCover,
      uFront: S.uFront, uFrontCloud: S.uFrontCloud,
      uAirWind: { value: this.dir }, uAirTemp: { value: new THREE.Vector4() },
      uAirRain: { value: new THREE.Vector2() },
    });
    this.capMesh = this.buildCapCloud();

    // ?weather=storm starts there already settled.
    const start = new URLSearchParams(location.search).get('weather') ?? new URLSearchParams(location.hash.slice(1)).get('weather');
    if (start) this.request(start, true);
    this.snap();
    Wind.dir.copy(Wind.target.dir);
    Wind.speed = Wind.target.speed;
    Wind.rebuild();                   // the field for the settled wind

    Loop.onSim(dt => this.step(dt));
    Loop.onFrame((dt, time, alpha) => this.updateCapCloud(Loop.simTime + alpha / CONFIG.simHz));
  },

  reseed(rng) {
    this.rng = rng.fork('weather');
    this.wanderNoise = valueNoise2D(rng.fork('wind-wander'));
    this.blobs = this.makeBlobs(rng.fork('cap-cloud'));
    this.front = null;
    this.quiet = this.rng.range(...Clock.climate('quiet'));
    if (this.mode !== 'auto') this.request(this.mode);
  },

  // Slow noise in −1…1 for the wind's wander; row picks an independent track.
  wander(row) { return this.wanderNoise(Loop.simTime / CONFIG.atmosphere.wander[2], row * 5.3) * 2 - 1; },

  // Steer the weather: 'clear', 'overcast', 'rain', 'storm', 'snow', 'fog', or 'auto'
  // to hand it back to the seasons. Nothing snaps: a front is brought in and held
  // over the island (or sent off) and the air eases toward the new state, unless
  // instant (used once at load).
  request(mode, instant = false) {
    const A = CONFIG.atmosphere, kind = { overcast: 'overcast', rain: 'rain', storm: 'storm', snow: 'rain' }[mode];
    if (!kind && !['clear', 'fog', 'auto'].includes(mode)) return;
    this.mode = mode;
    let f = this.front;
    if (kind) {
      if (!f) { this.spawn(kind, instant ? 0 : A.frontNear); f = this.front; }
      Object.assign(f, { kind, target: A.frontKinds[kind], hold: true, leaving: false });
      if (instant) { f.pos = 0; f.intensity = f.target; }
    } else if (f && mode !== 'auto') {
      Object.assign(f, { hold: false, leaving: true, target: 0 });
      if (instant) this.front = null;
    } else if (f) f.hold = false;
    if (mode === 'auto' && !this.front) this.quiet = Math.min(this.quiet, 20);
  },

  // A new front, upwind of the island. Its kind is drawn by the season's odds.
  spawn(kind, pos = CONFIG.atmosphere.frontStart) {
    const A = CONFIG.atmosphere, r = this.rng;
    if (!kind) {
      const w = Clock.climate('fronts'), names = Object.keys(w);
      kind = names[r.weighted(names.map(n => w[n]))];
    }
    const a = THREE.MathUtils.degToRad(this.windFrom);
    this.front = {
      kind, pos,                                                        // km upwind of the island
      dir: new THREE.Vector2(Math.sin(a), -Math.cos(a)),                // toward where it comes from
      width: r.range(...A.frontWidth) * (kind === 'storm' ? 0.8 : 1),   // squall lines are narrower
      speed: r.range(...A.frontSpeed) * 24 / CONFIG.clock.dayLength,    // km per simulated second
      intensity: pos >= A.frontStart ? A.frontKinds[kind] : 0,
      target: A.frontKinds[kind], hold: false, leaving: false,
    };
  },

  stepFront(dt) {
    const A = CONFIG.atmosphere, f = this.front;
    if (!f) {
      if (this.mode === 'auto' && (this.quiet -= dt) <= 0) this.spawn();
      return;
    }
    f.intensity += (f.target - f.intensity) * (1 - Math.exp(-dt / A.ease.front));
    if (f.hold) f.pos -= THREE.MathUtils.clamp(f.pos, -f.speed * dt, f.speed * dt);   // parks over the island
    else f.pos -= f.speed * dt * (f.leaving ? 2.5 : 1);
    if (f.pos < -A.frontStart || (f.leaving && f.intensity < 0.01)) {
      this.front = null;
      this.quiet = this.rng.range(...Clock.climate('quiet'));
    }
  },

  // Where each state value is heading, given the season, the hour and the front.
  targets() {
    const A = CONFIG.atmosphere, f = this.front, u = this.user, ss = THREE.MathUtils.smoothstep;
    const I = f ? f.intensity : 0;
    // The island's place relative to the front: in the moist, low-pressure air that
    // spreads ahead of it (near), still ahead of it, at its core, or behind it in the cold air.
    const near = f ? Math.exp(-((f.pos / (1.8 * f.width)) ** 2)) : 0;
    const core = f ? Math.exp(-((f.pos / f.width) ** 2)) : 0;
    const ahead = f ? ss(f.pos, 0, f.width) : 0;
    const behind = f ? ss(-f.pos, 0.2 * f.width, f.width) * (1 - ss(-f.pos, 0.6 * A.frontStart, A.frontStart)) : 0;
    const t = {};

    t.temp = Clock.climate('temp') + u.temperature + I * (A.frontWarm * near * ahead - A.frontCold * behind)
      - Math.min(3, 0.12 * this.precip);                       // rain cools the air it falls through
    if (this.mode === 'snow') t.temp = Math.min(t.temp, -1.5 - Math.max(this.landDT, 0));
    if (this.mode === 'fog') t.temp -= 1.5;

    // The land: warmed by the sun through whatever the cloud lets by, cooled at
    // night, most under a clear sky. Slow, so the warmest hour is mid-afternoon.
    const sunUp = Math.max(Celestial.sunDir.y, 0);
    t.landDT = A.heat[0] * Math.pow(sunUp, 0.8) * (1 - 0.7 * this.cover) * (1 - 0.4 * ss(this.precip, 0.3, 4))
      - A.heat[1] * (1 - Celestial.daylight) * (1 - 0.6 * this.cover);

    // Humidity: wetter ahead of a front, drier behind; lower in the warm afternoon,
    // since warmer air holds about 6% more water per °C.
    let rh = Clock.climate('humidity') + I * (0.32 * near - 0.12 * behind);
    if (this.mode === 'clear') rh -= 0.08;
    rh *= Math.exp(-0.06 * this.landDT);
    if (this.mode === 'fog') rh = 0.99;
    if (u.humidity !== null) rh = u.humidity;
    t.humidity = THREE.MathUtils.clamp(rh, 0.1, 1);

    t.pressure = A.pressure + I * (-22 * near + 6 * behind) + 2 * this.wander(3);

    // Wind: the season's prevailing wind, wandering; strongest at a front's core,
    // backing ahead of it and veering behind.
    let speed = Clock.climate('wind') * (1 + A.wander[1] * this.wander(7)) + I * A.frontWind * core;
    let from = A.windFrom + A.wander[0] * this.wander(0) + I * (35 * behind - 20 * near * ahead);
    if (this.mode === 'fog') speed = 1.5;
    if (u.windSpeed !== null) speed = u.windSpeed;
    if (u.windFrom !== null) from = u.windFrom;
    t.windSpeed = Math.max(0, speed);
    t.windFrom = from;
    return t;
  },

  step(dt) {
    const A = CONFIG.atmosphere, E = A.ease;
    this.stepFront(dt);
    const t = this.targets(), k = s => 1 - Math.exp(-dt / s);
    this.temp += (t.temp - this.temp) * k(E.temp);
    this.landDT += (t.landDT - this.landDT) * k(A.heatHours / 24 * CONFIG.clock.dayLength);
    this.humidity += (t.humidity - this.humidity) * k(E.humidity);
    this.pressure += (t.pressure - this.pressure) * k(E.pressure);
    this.windSpeed += (t.windSpeed - this.windSpeed) * k(E.wind);
    const turn = ((t.windFrom - this.windFrom) % 360 + 540) % 360 - 180;   // the short way round
    this.windFrom = ((this.windFrom + turn * k(E.wind)) % 360 + 360) % 360;
    this.derive();
    Air.derive(this);
    this.apply(dt);
  },

  // Straight to the targets, for a settled start.
  snap() {
    for (let i = 0; i < 8; i++) {
      const t = this.targets();
      Object.assign(this, t, { windFrom: ((t.windFrom % 360) + 360) % 360 });
      this.derive();
    }
    this.apply(0);
  },

  // Everything that follows from the state.
  derive() {
    const A = CONFIG.atmosphere, T = CONFIG.terrain, ss = THREE.MathUtils.smoothstep, f = this.front;
    const a = THREE.MathUtils.degToRad(this.windFrom), U = this.windSpeed;
    this.dir.set(-Math.sin(a), Math.cos(a));
    // A storm's cold downdraught: rain-cooled air pouring out along the ground ahead of
    // its core, a squall of cold gusty wind as the leading edge passes.
    this.outflow = f && f.kind === 'storm' ? f.intensity * Math.exp(-(((f.pos - 0.55 * f.width) / (0.3 * f.width)) ** 2)) : 0;
    this.seaLevelTemp = this.temp + this.landDT - A.downdraught[0] * this.outflow;
    this.seaAirTemp = this.temp + 0.15 * this.landDT;          // the sea barely warms or cools in a day
    this.dewPoint = dewPoint(this.seaLevelTemp, this.humidity);
    this.cloudBase = Math.max(0, 0.125 * (this.seaLevelTemp - this.dewPoint));
    this.freezingLevel = Math.max(0, this.seaLevelTemp / T.lapseRate);
    const peakKm = Math.max(Terrain.summit.y, 0) * T.metresPerUnit / 1000;
    this.peakTemp = this.seaLevelTemp - T.lapseRate * peakKm;

    // The front, for the sky and the layers.
    const sf = Sky.front;
    if (f) { sf.dir.copy(f.dir); sf.pos = f.pos; sf.width = f.width; } else sf.pos = 1e3;
    sf.lift = f ? f.intensity * A.frontDepth : 0;
    sf.base = this.cloudBase;
    sf.rain = f ? A.frontRain * Math.pow(f.intensity, 1.5) * ss(this.humidity, 0.5, 0.8) : 0;

    // The mountain: the wind forces air up over the peak (or, when it is light,
    // round it), plus whatever a front overhead is lifting.
    const oroDepth = peakKm * ss(U, 1.5, 9) + 0.5 * this.frontLift(0, 0) - this.cloudBase;
    this.capCloud = ss(oroDepth, 0.3, 2.2);
    this.oroRain = A.oroRain * ss(oroDepth, 1.2, 2.6) * ss(this.humidity, 0.62, 0.88) * ss(U, 2, 10);
    // Air that rained out on the way up comes down the lee warming at the dry rate.
    this.foehn = 3.5 * this.oroRain / A.oroRain;

    Sky.cloudCover = 0.1 + 0.35 * this.capCloud;               // the island's own cloud, trailing downwind
    this.cover = Math.max(Sky.cloudCover, this.frontCover(0, 0));
    this.precip = this.frontRain(0, 0) + 0.5 * this.oroRain;
    this.breeze = A.breeze * 0.85 * this.landDT / (1 + U / 6);   // a strong wind smothers it
    const I = f ? f.intensity : 0;
    this.stormK = ss(I, 0.7, 0.95) * ss(this.precip, 2, 8);
    this.fogK = Math.max(ss(this.humidity, 0.95, 0.99) * (1 - ss(U, 2, 5)), 0.8 * Air.state.valleyFog, 0.8 * Air.state.seaFog);

    // The front's stage, and the weather in words.
    const W = f ? f.width : 1, horizon = 8.3 * CONFIG.sky.cloudPlane;
    const raining = this.precip > 0.3;
