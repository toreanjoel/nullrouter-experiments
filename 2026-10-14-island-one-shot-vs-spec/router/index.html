vec3 decodeNormal(vec4 n) { return normalize(n.xyz * 2.0 - 1.0); }

void main() {
  vec3 col = texture(tColor, vUv).rgb;
  float w = invZ(vUv);
  if (w <= 0.0) { gl_FragColor = vec4(col, 1.0); return; }   // sky: nothing to ink

  vec2 px = 1.0 / uResolution;
  float dist = 1.0 / w;
  float far = smoothstep(uInkRange.x, uInkRange.y, dist);
  float width = mix(uInkWidth.x, uInkWidth.y, far);

  // Depth edges at 1 px, and at 2 px weighted in as the line gets wider than 1 px.
  float k = uEdgeK.x;
  float depthEdge = smoothstep(k, k * 1.6, depthLaplacian(vUv, w, px));
  depthEdge = max(depthEdge, smoothstep(k, k * 1.6, depthLaplacian(vUv, w, px * 2.0)) * clamp(width - 1.0, 0.0, 1.0));

  // Normal edges, one-sided (right and up neighbours) to keep lines a pixel thin.
  vec4 nc = texture(tNormal, vUv);
  float inked = nc.a > 0.6 && nc.a < 0.9 ? 0.0 : 1.0;   // 0.75: a surface that wants no ink
  float normalEdge = 0.0;
  vec3 N = decodeNormal(nc);
  if (nc.a > 0.5) {
    vec4 nr = texture(tNormal, vUv + vec2(px.x, 0.0));
    vec4 nu = texture(tNormal, vUv + vec2(0.0, px.y));
    float e = 0.0;
    if (nr.a > 0.5) e = max(e, 1.0 - dot(N, decodeNormal(nr)));
    if (nu.a > 0.5) e = max(e, 1.0 - dot(N, decodeNormal(nu)));
    normalEdge = smoothstep(uEdgeK.y, uEdgeK.y * 1.5, e) * (1.0 - 0.7 * far);
  }

  // Rim: near side of a silhouette, normal turned away from the sun.
  float rim = 0.0;
  if (nc.a > 0.9 && dot(N, uSunView) < uRim.z) {
    float r = mix(uRim.x, max(uRim.x * 0.4, 1.0), far);
    float behind = 0.0;
    for (int i = 0; i < 8; i++) {
      float a = float(i) * 0.7853982;
      vec2 o = vec2(cos(a), sin(a)) * px * r;
      behind = max(behind, step(invZ(vUv + o), w * 0.88));
    }
    rim = behind * uRim.y * (1.0 - 0.5 * far);
  }

  float edge = max(depthEdge, normalEdge) * inked;
  float alpha = edge * mix(1.0, uInkRange.z, far) * clamp(width, 0.0, 1.0) * (1.0 - smoothstep(uInkCutoff.x, uInkCutoff.y, dist));
  col = mix(col, uSkyColor, rim);
  col = mix(col, uInk, alpha);
  gl_FragColor = vec4(col, 1.0);
}`;

// ── Grade pass ──────────────────────────────────────────────────────────────
// Last in the chain: applies the weather tint to the palette (hue pull, saturation,
// brightness, haze toward a palette colour) and converts to the screen's colour space.
const GRADE_FRAGMENT = /* glsl */`
uniform sampler2D tColor;
uniform vec3 uTint, uHazeColor;
uniform float uSaturation, uBrightness, uHaze;
varying vec2 vUv;
void main() {
  vec3 c = texture(tColor, vUv).rgb;
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  c = mix(vec3(l), c, uSaturation) * uTint * uBrightness;
  c = mix(c, uHazeColor * uBrightness, uHaze);
  gl_FragColor = linearToOutputTexel(vec4(c, 1.0));
}`;

function buildPostChain() {
  const L = CONFIG.look, P = Look.palette;
  const sunView = new THREE.Vector3();
  Post.init();

  Post.add('outline', Post.shader(OUTLINE_FRAGMENT, {
    tColor: { value: null }, tNormal: { value: null }, tDepth: { value: null },
    uResolution: { value: new THREE.Vector2() }, uNear: { value: 0 }, uFar: { value: 0 },
    uInk: { value: P.ink }, uSkyColor: Look.uniforms.uSkyColor, uSunView: { value: sunView },
    uInkRange: { value: new THREE.Vector3(L.inkNear, L.inkFar, L.inkFarAlpha) },
    uInkCutoff: { value: new THREE.Vector2(...L.inkCutoff) },
    uInkWidth: { value: new THREE.Vector2(...L.inkWidth) },
    uEdgeK: { value: new THREE.Vector2(L.depthEdge, L.normalEdge) },
    uRim: { value: new THREE.Vector3(L.rimWidth, L.rimStrength, L.rimFacing) },
  }), {
    update() {
      sunView.subVectors(sun.position, sun.target.position).normalize().transformDirection(camera.matrixWorldInverse);
    },
  });

  const g = Look.grade;
  Post.add('grade', Post.shader(GRADE_FRAGMENT, {
    tColor: { value: null },
    uTint: { value: g.tint }, uHazeColor: { value: P.haze },
    uSaturation: { value: 1 }, uBrightness: { value: 1 }, uHaze: { value: 0 },
  }), {
    update(pass) {
      const u = pass.material.uniforms;
      u.uSaturation.value = g.saturation;
      u.uBrightness.value = g.brightness;
      u.uHaze.value = g.haze;
    },
  });
}

// ═════════════════════════════════════════════════════════════════════════════
// QUALITY — the ladder of levers that keeps the frame rate at 60. Systems read
// their current level with Quality.get(name) or react with Quality.on(name, fn).
// The governor in PERF moves the levers; nothing else should.
// ═════════════════════════════════════════════════════════════════════════════

const Quality = {
  levers: CONFIG.quality.map(q => ({ ...q, index: 0, listeners: [] })),
  lever(name) {
    const l = this.levers.find(l => l.name === name);
    if (!l) throw new Error('Unknown quality lever: ' + name);
    return l;
  },
  get(name) { const l = this.lever(name); return l.levels[l.index]; },
  // Calls fn now with the current value and again whenever the lever moves.
  on(name, fn) { const l = this.lever(name); l.listeners.push(fn); fn(l.levels[l.index]); },
  set(lever, index) {
    lever.index = index;
    const value = lever.levels[index];
    for (const fn of lever.listeners) fn(value);
    App.emit('quality', lever.name, value);
  },
  // Lower the first lever (in ladder order) that still has room.
  lower() {
    const l = this.levers.find(l => l.index < l.levels.length - 1);
    if (!l) return false;
    this.set(l, l.index + 1);
    return true;
  },
  // Raise the last lowered lever, undoing lower() in reverse order.
  raise() {
    const l = [...this.levers].reverse().find(l => l.index > 0);
    if (!l) return false;
    this.set(l, l.index - 1);
    return true;
  },
  tier() { return this.levers.reduce((s, l) => s + l.index, 0); },
  maxTier() { return this.levers.reduce((s, l) => s + l.levels.length - 1, 0); },
};

// Shadow resolution applies to every shadow-casting light in the scene, whoever made it.
Quality.on('shadowSize', size => {
  scene.traverse(obj => {
    if (obj.isLight && obj.castShadow && obj.shadow) {
      obj.shadow.mapSize.set(size, size);
      if (obj.shadow.map) { obj.shadow.map.dispose(); obj.shadow.map = null; }
    }
  });
});
Quality.on('renderScale', () => resize());

// ═════════════════════════════════════════════════════════════════════════════
// PERF — frame-time monitor and quality governor. Records every frame interval,
// reports fps / average / worst / CPU time, and lowers quality as soon as frames
// drop, then probes back upward with exponential backoff once things are smooth.
// ═════════════════════════════════════════════════════════════════════════════

const Perf = {
  size: 240,
  intervals: new Float32Array(240),   // ms between frames
  stamps: new Float64Array(240),      // when each interval ended
  cpu: new Float32Array(240),         // ms spent in our own update + render calls
  head: 0,
  count: 0,
  lastFrame: 0,

  record(now, cpuMs) {
    if (this.lastFrame) {
      const dt = now - this.lastFrame;
      if (dt < 250) {                 // longer gaps are a hidden tab or a debugger, not slowness
        this.intervals[this.head] = dt;
        this.stamps[this.head] = now;
        this.cpu[this.head] = cpuMs;
        this.head = (this.head + 1) % this.size;
        this.count = Math.min(this.count + 1, this.size);
      }
    }
    this.lastFrame = now;
  },
  reset() { this.count = 0; this.lastFrame = 0; },

  // Stats over frames that ended in the last windowMs (all recorded frames if omitted).
  stats(now, windowMs = Infinity) {
    let n = 0, sum = 0, worst = 0, slow = 0, cpu = 0;
    for (let k = 0; k < this.count; k++) {
      const i = (this.head - 1 - k + this.size) % this.size;
      if (now - this.stamps[i] > windowMs) break;
      const dt = this.intervals[i];
      n++; sum += dt; cpu += this.cpu[i];
      if (dt > worst) worst = dt;
      if (dt > CONFIG.slowFrameMs) slow++;
    }
    const avg = n ? sum / n : 0;
    return { frames: n, avgMs: avg, fps: avg ? 1000 / avg : 0, worstMs: worst, cpuMs: n ? cpu / n : 0, slowFraction: n ? slow / n : 0 };
  },
};

const Governor = {
  enabled: true,
  startedAt: performance.now(),
  holdUntil: performance.now() + CONFIG.governor.warmupMs,
  lastRaiseAt: -Infinity,
  backoffMs: CONFIG.governor.raiseBackoffMs,
  lastChangeAt: performance.now(),

  update(now) {
    const g = CONFIG.governor;
    if (!this.enabled || now < this.holdUntil) return;
    const s = Perf.stats(now, g.windowMs);
    if (s.frames < 20) return;        // not enough evidence yet

    if (s.slowFraction > g.lowerIfSlowFraction) {
      // A raise that is followed straight away by a drop was a failed probe: wait longer next time.
      if (now - this.lastRaiseAt < g.windowMs + g.settleMs + 1000) {
        this.backoffMs = Math.min(this.backoffMs * 2, g.raiseBackoffMaxMs);
      }
      if (Quality.lower()) this.changed(now);
    } else if (s.slowFraction < g.raiseIfSlowFraction && now - this.lastChangeAt > this.backoffMs) {
      if (Quality.raise()) { this.lastRaiseAt = now; this.changed(now); }
      else this.lastChangeAt = now;   // already at best: nothing to probe
    }
  },
  changed(now) {
    this.lastChangeAt = now;
    this.holdUntil = now + CONFIG.governor.settleMs;
    Perf.reset();
  },
};

const perfHud = document.getElementById('perf');
let perfHudNext = 0;
function updatePerfHud(now) {
  if (perfHud.hidden || now < perfHudNext) return;
  perfHudNext = now + 250;
  const s = Perf.stats(now, 1000);
  const levers = Quality.levers
    .map(l => `${l.label} ${l.levels[l.index]}`)
    .join(' · ');
  perfHud.textContent =
    `${s.fps.toFixed(0).padStart(3)} fps  ${s.avgMs.toFixed(1)} ms avg  ${s.worstMs.toFixed(1)} worst  cpu ${s.cpuMs.toFixed(1)} ms\n` +
    `quality ${Quality.maxTier() - Quality.tier()}/${Quality.maxTier()}  ${levers}\n` +
    `seed ${App.seed}  ${renderer.domElement.width}×${renderer.domElement.height}\n` +
    Atmosphere.readout();
}
// Backquote toggles the frame-time readout.
window.addEventListener('keydown', e => { if (e.code === 'Backquote') perfHud.hidden = !perfHud.hidden; });

// ═════════════════════════════════════════════════════════════════════════════
// AUDIO — a soundscape generated with the Web Audio API, nothing recorded: filtered
// noise for the wind (pitch and loudness follow the wind speed, swelling in gusts),
// the rain (a hiss that follows how hard it rains, silent for snow) and the surf
// (low swells breaking on the shore, louder in big seas and nearer the coast), and
// thunder for each lightning strike, arriving its distance / 343 m/s after the flash:
// a sharp crack then a roll when close, a low rumble when far. The browser only lets
// sound start after a user gesture, so it starts on the first click; Sound.setMuted()
// (the UI's mute button) silences it.
// ═════════════════════════════════════════════════════════════════════════════

const Sound = {
  ctx: null,
  muted: false,
  started: false,

  init() {
    const start = () => { this.start(); window.removeEventListener('pointerdown', start); window.removeEventListener('keydown', start); };
    window.addEventListener('pointerdown', start);
    window.addEventListener('keydown', start);
    App.on('strike', e => this.thunder(e));
    Loop.onFrame(dt => this.update(dt));
  },

  start() {
    if (this.started) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.started = true;
    const ctx = this.ctx = new AC(), C = CONFIG.audio;
    this.master = ctx.createGain();
    this.master.gain.value = this.muted ? 0 : C.master;
    this.master.connect(ctx.destination);
    // Two seconds of white noise from the seeded generator (no Math.random), looped.
    const rng = App.rng.fork('audio'), len = ctx.sampleRate * 2;
    this.noise = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = this.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = rng.next() * 2 - 1;
    const bed = (type, freq, q) => {
      const src = ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      src.loopStart = 0; src.playbackRate.value = 1;
      const f = ctx.createBiquadFilter();
      f.type = type; f.frequency.value = freq; f.Q.value = q;
      const g = ctx.createGain();
      g.gain.value = 0;
      src.connect(f).connect(g).connect(this.master);
      src.start(0, rng.range(0, 2));
      return { filter: f, gain: g };
    };
    this.wind = bed('bandpass', 400, 0.9);
    this.windHigh = bed('bandpass', 1400, 2.5);   // the whistle in gusts
    this.rain = bed('highpass', 3200, 0.5);
    this.surf = bed('lowpass', 420, 0.7);
    if (ctx.state === 'suspended') ctx.resume();
  },

  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : CONFIG.audio.master, this.ctx.currentTime, 0.05);
  },

  // Each frame: the beds follow the weather where the camera is looking.
  update(dt) {
    if (!this.ctx) return;
    const C = CONFIG.audio, A = Atmosphere, ss = THREE.MathUtils.smoothstep, now = this.ctx.currentTime, k = 0.25;
    const t = CameraRig.target;
    // Wind: the local wind at the view (gusts included), louder and higher as it rises.
    const w = Wind.sample(t.x, t.z);
    const gust = Math.max(0, A.wander(13)) * Wind.gustiness * 0.7;   // gusts come and go
    const U = Math.hypot(w.x, w.y) * (1 + 0.5 * gust);
    this.wind.filter.frequency.setTargetAtTime(C.wind[0] + C.wind[1] * U, now, k);
    this.wind.gain.gain.setTargetAtTime(C.windGain * ss(U, 0.5, 22), now, k);
    this.windHigh.filter.frequency.setTargetAtTime(900 + 60 * U, now, k);
    this.windHigh.gain.gain.setTargetAtTime(C.windGain * 0.35 * ss(U, 9, 25) * (0.4 + gust), now, k);
    // Rain: how hard it rains at the view, as rain (snow falls silently).
    const S = Heightfield.sampleLayer('precipitation', t.x, t.z), T = Heightfield.sampleLayer('temperature', t.x, t.z);
    const liquid = ss(T, 0.5, 1.5);
    this.rain.gain.gain.setTargetAtTime(C.rainGain * ss(S * liquid, 0.2, 25), now, k);
    this.rain.filter.frequency.setTargetAtTime(2600 + 60 * Math.min(S, 30), now, k);
    // Surf: swells breaking every few seconds, bigger with the sea, louder nearer the shore.
    const near = 1 - ss(CameraRig.cur.dist, 120, 700);
    const swell = Math.pow(0.5 + 0.5 * Math.sin(Loop.simTime * Math.PI * 2 / C.surfPeriod), 3);
    this.surf.gain.gain.setTargetAtTime(C.surfGain * (0.35 + 0.65 * near) * (0.3 + 0.7 * swell) * ss(Ocean.waveScale, 0.4, 1.6), now, 0.3);
    this.surf.filter.frequency.setTargetAtTime(300 + 400 * swell, now, 0.3);
  },

  // Thunder for a strike: it leaves now and arrives distance / 343 m/s later. Close:
  // a sharp crack, then a roll; far: a low rumble, quieter and duller with distance.
  thunder(e) {
    if (!this.ctx || !this.noise) return;
    const C = CONFIG.audio, ctx = this.ctx, m = Math.max(e.metres, 50);
    const delay = m / C.soundSpeed, t0 = ctx.currentTime + delay;
    const near = 1 - THREE.MathUtils.smoothstep(m, 600, 4000);
    const loud = C.thunderGain * Math.min(1, 1500 / m + 0.15);
    const voice = (type, freq, start, attack, decay, peak, rate = 1) => {
      const src = ctx.createBufferSource();
      src.buffer = this.noise; src.loop = true; src.playbackRate.value = rate;
      const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
      const g = ctx.createGain(); g.gain.value = 0;
      src.connect(f).connect(g).connect(this.master);
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(peak, start + attack);
      g.gain.setTargetAtTime(0, start + attack, decay / 3);
      src.start(start); src.stop(start + attack + decay * 1.6);
    };
    if (near > 0.05) voice('highpass', 1800, t0, 0.005, 0.35, loud * near * 1.2, 1.4);   // the crack
    const cutoff = 180 + 1400 * near;
    const rolls = 3 + Math.round(3 * (1 - near));
    for (let i = 0; i < rolls; i++) {   // the roll: overlapping rumbles from the far parts of the channel
      const off = i * (0.35 + 0.5 * (1 - near)) * (0.7 + 0.6 * ((i * 0.618) % 1));
      voice('lowpass', cutoff * (1 - 0.1 * i), t0 + 0.05 + off, 0.08 + 0.15 * (1 - near), 1.2 + 2.5 * (1 - near), loud * (0.9 - 0.1 * i), 0.5);
    }
  },
};

// ═════════════════════════════════════════════════════════════════════════════
// UI — the control panel (collapsible, top right): time of day, time speed, season;
// temperature, humidity, wind speed and direction (each humidity/wind control can be
// left on "auto" for the weather model); weather buttons that steer the atmosphere
// toward a state (it eases there, never snaps); the seed with a new-island button,
// reset erosion and the erosion speed; a debug overlay that colours the terrain by one
// layer; and a readout of the air and the frame time. A mute button sits apart from it.
// The panel only calls the systems' own controls (Clock, Loop, Atmosphere, App,
// Erosion, Sound, Terrain's debug uniform); it holds no state of its own.
// ═════════════════════════════════════════════════════════════════════════════

const UI_CSS = `

  font: 12px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; color: #f3efe2; background: rgba(28, 31, 52, 0.84);

const UI = {
  init() {
    const style = document.createElement('style');
    style.textContent = UI_CSS;
    document.head.appendChild(style);
    const root = this.root = document.createElement('div');
    root.id = 'ui';
    root.innerHTML = `
      <header><div>Island controls</div><span>▾</span></header>
      <div class="body">
        <h4>Time</h4>
        ${this.slider('hour', 'Time of day', 0, 24, 0.05)}
        <div class="row"><label>Time speed</label><select data-k="speed">
          <option value="0">paused</option><option value="0.25">¼×</option><option value="0.5">½×</option>
          <option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option>
        </select><output></output></div>
        <div class="row"><label>Season</label><select data-k="season">
          <option value="spring">spring</option><option value="summer">summer</option><option value="autumn">autumn</option><option value="winter">winter</option>
        </select><output></output></div>
        <h4>Weather</h4>
        <div class="buttons" data-k="weather">
          ${['auto', 'clear', 'overcast', 'rain', 'storm', 'snow', 'fog'].map(w => `<button data-w="${w}">${w}</button>`).join('')}
        </div>
        ${this.slider('temperature', 'Temperature', -15, 15, 0.5, '°')}
        ${this.slider('humidity', 'Humidity', 10, 100, 1, '%', true)}
        ${this.slider('windSpeed', 'Wind speed', 0, 30, 0.5, '', true)}
        ${this.slider('windFrom', 'Wind from', 0, 359, 1, '°', true)}
        <h4>Island</h4>
        <div class="row"><label>Seed</label><input type="text" data-k="seed" spellcheck="false"><button data-a="newIsland" title="Make the island for this seed (change the text, or press for a new one)">New</button></div>
        ${this.slider('erosion', 'Erosion speed', 0, 8, 0.25, '×')}
        <div class="buttons"><button data-a="resetErosion">Reset erosion</button><button data-a="pauseErosion">Pause erosion</button></div>
        <h4>Debug</h4>
        <div class="row"><label>Layer</label><select data-k="debug">
          <option value="0">off</option><option value="1">water depth</option><option value="2">sediment</option>
          <option value="3">wetness</option><option value="4">snow</option><option value="5">temperature</option>
        </select><output></output></div>
        <pre data-k="readout"></pre>
      </div>`;
    document.body.appendChild(root);
    this.$ = k => root.querySelector(`[data-k="${k}"]`);
    root.querySelector('header').addEventListener('click', () => {
      root.classList.toggle('collapsed');
      root.querySelector('header span').textContent = root.classList.contains('collapsed') ? '▸' : '▾';
    });
    // Keys typed into the panel are for the panel, not the camera or the HUD toggle.
    root.addEventListener('keydown', e => e.stopPropagation());

    const A = Atmosphere;
    this.bind('hour', v => Clock.setHour(v));
    this.$('speed').addEventListener('change', e => { const v = +e.target.value; Loop.paused = v === 0; if (v) Loop.timeScale = v; });
    this.$('season').addEventListener('change', e => Clock.setSeason(e.target.value));
    this.$('weather').addEventListener('click', e => { const w = e.target.dataset.w; if (w) A.request(w); });
    this.bind('temperature', v => { A.user.temperature = v; });
    this.bind('humidity', v => { A.user.humidity = v / 100; }, () => { A.user.humidity = null; });
    this.bind('windSpeed', v => { A.user.windSpeed = v; }, () => { A.user.windSpeed = null; });
    this.bind('windFrom', v => { A.user.windFrom = v; }, () => { A.user.windFrom = null; });
    this.bind('erosion', v => { Erosion.speed = v; });
    this.$('debug').addEventListener('change', e => this.setDebug(+e.target.value));
    root.querySelector('[data-a=newIsland]').addEventListener('click', () => {
      const field = this.$('seed');
      let seed = field.value.trim();
      if (!seed || seed === App.seed) seed = this.nextSeed();
      field.value = seed;
      App.setSeed(seed);
      history.replaceState(null, '', '#seed=' + encodeURIComponent(seed));
    });
    root.querySelector('[data-a=resetErosion]').addEventListener('click', () => Erosion.reset());
    root.querySelector('[data-a=pauseErosion]').addEventListener('click', e => { Erosion.paused = !Erosion.paused; e.target.classList.toggle('on', Erosion.paused); });

    this.$('seed').value = App.seed;
    this.set('erosion', Erosion.speed);
    this.$('season').value = Object.entries(CONFIG.clock.seasons).reduce((best, [n, v]) =>
      Math.abs(((Clock.year - v + 1.5) % 1) - 0.5) < Math.abs(((Clock.year - CONFIG.clock.seasons[best] + 1.5) % 1) - 0.5) ? n : best, 'spring');

    // The mute button, apart from the panel so it stays at hand when that is folded away.
    const mute = this.mute = document.createElement('button');
    mute.id = 'mute';
    mute.textContent = 'Sound: on';
    mute.title = 'Sound starts with your first click; this mutes it';
    mute.addEventListener('click', () => { Sound.start(); Sound.setMuted(!Sound.muted); mute.textContent = Sound.muted ? 'Sound: off' : 'Sound: on'; });
    document.body.appendChild(mute);

    this.seeds = App.rng.fork('ui-seeds');
    this.next = 0;
    Loop.onFrame(() => this.update());
  },

  // A slider row; with auto, an "auto" box hands the value back to the weather model.
  slider(k, label, min, max, step, unit = '', auto = false) {
    return `<div class="row"><label>${label}</label><input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}">` +
      `<output data-o="${k}" data-unit="${unit}"></output></div>` +
      (auto ? `<div class="row"><span></span><label class="auto" title="Leave it to the weather model"><input type="checkbox" data-auto="${k}" checked> auto</label><span></span></div>` : '');
  },

  bind(k, onInput, onAuto) {
    const el = this.$(k), box = this.root.querySelector(`[data-auto="${k}"]`);
    el.addEventListener('pointerdown', () => { el.dataset.dragging = '1'; });
    el.addEventListener('pointerup', () => { delete el.dataset.dragging; });
    el.addEventListener('input', () => { if (box) box.checked = false; onInput(+el.value); this.show(k, +el.value); });
    if (box) box.addEventListener('change', () => { if (box.checked) onAuto(); else onInput(+el.value); });
  },

  set(k, v) { const el = this.$(k); if (!el.dataset.dragging && document.activeElement !== el) el.value = v; this.show(k, v); },
  show(k, v) {
    const o = this.root.querySelector(`[data-o="${k}"]`);
    if (!o) return;
    o.textContent = k === 'hour' ? `${String(Math.floor(v)).padStart(2, '0')}:${String(Math.floor((v % 1) * 60)).padStart(2, '0')}` : `${(+v).toFixed(Math.abs(v) < 10 && v % 1 ? 1 : 0)}${o.dataset.unit}`;
  },

  nextSeed() {
    const words = ['squall', 'gale', 'lull', 'brine', 'cairn', 'fjell', 'mistral', 'haar', 'scree', 'tarn', 'sirocco', 'shoal', 'ness', 'skerry', 'zephyr', 'tor'];
    return `${this.seeds.pick(words)}-${this.seeds.int(10, 999)}`;
  },

  setDebug(layer) {
    const C = CONFIG.debug, u = Terrain.mesh.material.uniforms.uDebug.value, r = C.ranges[layer] || [0, 1];
    u.set(layer, r[0], r[1], 0);
    Water.mesh.visible = layer === 0;   // the water layer's own colour would hide the overlay
  },

  // Keep the controls showing the state (the weather model moves what is on auto), and
  // the readout current.
  update() {
    const now = performance.now();
    if (now < this.next) return;
    this.next = now + 250;
    const A = Atmosphere, u = A.user;
    this.set('hour', Clock.hours);
    this.set('temperature', u.temperature);
    this.set('humidity', A.humidity * 100);
    this.set('windSpeed', A.windSpeed);
    this.set('windFrom', A.windFrom);
    this.set('erosion', Erosion.speed);
    this.root.querySelectorAll('[data-w]').forEach(b => b.classList.toggle('on', b.dataset.w === A.mode));
    const s = Perf.stats(now, 1000), compass = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(A.windFrom / 45) % 8];
    this.$('readout').textContent =
      `${A.name}\n` +
      `sea level ${A.seaLevelTemp.toFixed(1)} °C   peak ${A.peakTemp.toFixed(1)} °C\n` +
      `humidity ${(A.humidity * 100).toFixed(0)}%   dew point ${A.dewPoint.toFixed(1)} °C\n` +
      `wind ${A.windSpeed.toFixed(1)} m/s from ${compass} (${A.windFrom.toFixed(0)}°)\n` +
      `rain ${A.precip.toFixed(1)} mm/h   tide ${Tide.offset >= 0 ? '+' : ''}${(Tide.offset * CONFIG.terrain.metresPerUnit).toFixed(0)} m\n` +
      `frame ${s.avgMs.toFixed(1)} ms (${s.fps.toFixed(0)} fps), worst ${s.worstMs.toFixed(1)} ms`;
  },
};

// ═════════════════════════════════════════════════════════════════════════════
// MAIN LOOP — fixed-step simulation plus one render per animation frame.
//   Loop.onSim(fn(dt, simTime))    called at CONFIG.simHz, in simulated seconds
//   Loop.onFrame(fn(dt, time, a))  called once per displayed frame; a is the
//                                  fraction between the last two sim steps
//   Loop.timeScale / Loop.paused   scale or stop simulated time (not rendering)
// ═════════════════════════════════════════════════════════════════════════════

const Loop = {
  simHandlers: [],
  frameHandlers: [],
  timeScale: 1,
  paused: false,
  simTime: 0,          // simulated seconds since start (advances in fixed steps only)
  accumulator: 0,
  lastNow: 0,
  onSim(fn) { this.simHandlers.push(fn); },
  onFrame(fn) { this.frameHandlers.push(fn); },

  tick(now) {
    const cpuStart = performance.now();
    const realDt = this.lastNow ? Math.min((now - this.lastNow) / 1000, 0.1) : 0;
    this.lastNow = now;

    const step = 1 / CONFIG.simHz;
    if (!this.paused) this.accumulator += realDt * this.timeScale;
    let steps = 0;
    while (this.accumulator >= step && steps < CONFIG.maxSimStepsPerFrame) {
      for (const fn of this.simHandlers) fn(step, this.simTime);
      this.simTime += step;
      this.accumulator -= step;
      steps++;
    }
    // If we could not keep up, drop the backlog rather than spiralling.
    if (steps === CONFIG.maxSimStepsPerFrame) this.accumulator = Math.min(this.accumulator, step);

    const alpha = this.accumulator / step;
    for (const fn of this.frameHandlers) fn(realDt, now / 1000, alpha);
    renderFrame();

    Perf.record(now, performance.now() - cpuStart);
    Governor.update(now);
    updatePerfHud(now);
  },
};

// One render per frame through the post chain (G-buffer → outline → … → grade).
const renderFrame = () => Post.render();

document.addEventListener('visibilitychange', () => {
  // Coming back from a hidden tab: forget the gap so it is not judged as slowness.
  Loop.lastNow = 0;
  Perf.reset();
  Governor.holdUntil = performance.now() + CONFIG.governor.settleMs;
});

// ── Boot ──
buildPostChain();
Terrain.init();                   // first: the sea and the plants read its layers
Sky.init();
Wind.init();                      // before everything that blows in it (sea, dust, plants)
Ocean.init();
Clock.init();                     // before the atmosphere, so each step sees this step's sun
Atmosphere.init();
Water.init();                     // after the atmosphere, so each step's rain lands from this step's precipitation
Tide.init();                      // after the sea and the water, which it sets the level of
Erosion.init();                   // after the water, so each step erodes with this step's flow
Snow.init();                      // after the water, so meltwater joins next step's flow
Rain.init();
Spray.init();
Dust.init();                      // after the atmosphere and water, so each step lifts grains from this step's layers
Vegetation.init();
CameraRig.init();                 // before Sky's frame hook, so the dome follows this frame's camera
Loop.onFrame((dt, time) => { Sky.update(time); Look.update(dt); });
Sound.init();                     // waits for the first click
UI.init();
Air.init();                       // a post pass before the grade (needs the sky's cloud uniforms)
Lightning.init();                 // after the sky's frame hook: a flash overrides the light the sky just set
Loop.onFrame((dt, time, alpha) => Lightning.frame(alpha));

window.addEventListener('resize', resize);
resize();
renderer.setAnimationLoop(now => Loop.tick(now));

Object.assign(window, { THREE, CONFIG, RNG, App, CAPS, renderer, scene, camera, CameraRig, Quality, Perf, Governor, Loop, Look, Toon, Post, GBuffer, sun, Celestial, Clock, Atmosphere, Sky, Heightfield, Terrain, Ocean, Tide, Water, Erosion, Snow, Lightning, Air, Spray, Sound, UI, Rain, Wind, Dust, Vegetation });
window.__islandReady = true;
</script>
