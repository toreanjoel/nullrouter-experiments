                         + uCoastRate.y * waves * surfZone(h, waves) * bare);
  gl_FragColor = vec4(G.r - rock, max(sed, 0.0) + rock, G.ba);
}`;

const EROSION_RESET_GLSL = /* glsl */`
uniform sampler2D tBase;
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  gl_FragColor = vec4(texelFetch(tBase, c, 0).rg, layerCell(uLayerGround, c).ba);
}`;

const Erosion = {
  speed: CONFIG.erosion.speed,   // geological seconds per sim second
  paused: false,
  waves: 0,                      // 0 calm … 1 storm surf, from the weather
  clock: 0,                      // geological seconds since the last readback
  reading: null,                 // a readback in flight

  init() {
    const E = CONFIG.erosion, H = Heightfield, R = E.repose, tan = d => Math.tan(d * Math.PI / 180);
    const q = new URLSearchParams(location.search).get('erosion') ?? new URLSearchParams(location.hash.slice(1)).get('erosion');
    if (q !== null && Number.isFinite(+q)) this.speed = Math.max(0, +q);
    this.load = { read: H.makeTarget(), write: H.makeTarget() };
    this.slideAxis = H.makeTarget();
    this.slideDiag = H.makeTarget();
    this.base = H.makeTarget();      // the island as generated, for reset()
    this.uniforms = {
      tSusp: { value: this.load.read.texture },
      uErode: { value: new THREE.Vector4(0, E.capacity, E.depthRef, E.maxSpeed) },
      uErodeRate: { value: new THREE.Vector4(...E.dissolve, E.deposit, E.settle) },
      uErodeMisc: { value: new THREE.Vector3(E.minSlope, E.plume, E.film) },
      uSlide: { value: new THREE.Vector4(tan(R.sand), tan(R.soil), tan(R.underwater), tan(R.soil + R.roots) - tan(R.soil)) },
      uSlideRate: { value: new THREE.Vector4(E.slide, CONFIG.terrain.beachTop, E.surf[2], E.stormRate) },
      uCoast: { value: new THREE.Vector4(0, E.surf[0], E.surf[1], E.berm) },
      uCoastRate: { value: new THREE.Vector4(E.rebuild, E.wear, tan(R.rock), E.crumble) },
      uWaves: { value: new THREE.Vector3(0, 1, E.lee) },
    };
    const u = { ...Water.uniforms, ...this.uniforms }, pre = WATER_GLSL + EROSION_GLSL;
    this.exchangeLoad = H.passMaterial(pre + EROSION_LOAD_GLSL, u);
    this.exchangeGround = H.passMaterial(pre + EROSION_GROUND_GLSL, u);
    this.carry = H.passMaterial(pre + EROSION_CARRY_GLSL, u);
    this.slideAxisPass = H.passMaterial(pre + EROSION_SLIDE_GLSL, { ...u, uDiag: { value: 0 } });
    this.slideDiagPass = H.passMaterial(pre + EROSION_SLIDE_GLSL, { ...u, uDiag: { value: 1 } });
    this.settle = H.passMaterial(pre + EROSION_SETTLE_GLSL, {
      ...u, tSlideAxis: { value: this.slideAxis.texture }, tSlideDiag: { value: this.slideDiag.texture },
    });
    this.restore = H.passMaterial(EROSION_RESET_GLSL, { tBase: { value: this.base.texture } });
    this.clear = H.passMaterial('void main() { gl_FragColor = vec4(0.0); }');
    this.capture();
    App.on('seed', () => this.capture());   // after the new island is generated
    Loop.onSim(dt => this.step(dt));
  },

  // Remember the island as it is now (just generated, let come to rest) and start with
  // nothing in suspension.
  capture() {
    const H = Heightfield;
    this.rest();
    H.copy.uniforms.tSrc.value = H.gpu.ground.read.texture;
    H.render(H.copy, this.base);
    for (const t of [this.load.read, this.load.write]) H.render(this.clear, t);
    this.planted = H.data.slice();   // the heights the plants were placed on
    this.clock = 0;
    this.reading = null;             // anything in flight was the old island's
  },

  // The generator leaves some ground steeper than its material can stand; let it slide
  // and crumble to rest (no water, no waves, crumbling fast) before anything is planted,
  // so a calm day does not reshape a new island.
  rest() {
    const H = Heightfield, u = this.uniforms.uCoast.value, r = this.uniforms.uCoastRate.value, e = this.uniforms.uErode.value;
    const keep = [u.x, r.x, r.w, e.x];
    u.x = r.x = 0; r.w = 1; e.x = 0.1;
    for (let i = 0; i < CONFIG.erosion.restSteps; i++) {
      H.render(this.slideAxisPass, this.slideAxis);
      H.render(this.slideDiagPass, this.slideDiag);
      H.step('ground', this.settle);
    }
    [u.x, r.x, r.w, e.x] = keep;
    H.readback();
  },

  // Put the ground back as generated (water and snow stay where they are).
  reset() {
    const H = Heightfield;
    H.step('ground', this.restore);
    for (const t of [this.load.read, this.load.write]) H.render(this.clear, t);
    this.refresh(true);
  },

  swapLoad() {
    [this.load.read, this.load.write] = [this.load.write, this.load.read];
    this.uniforms.tSusp.value = this.load.read.texture;
  },

  step(dt) {
    this.land();
    if (this.paused || !(this.speed > 0)) return;
    const E = CONFIG.erosion, H = Heightfield, A = Atmosphere, u = this.uniforms;
    this.waves = Math.max(A.stormK, THREE.MathUtils.smoothstep(A.windSpeed, ...E.storm));
    u.uCoast.value.x = this.waves;
    u.uWaves.value.x = Wind.dir.x; u.uWaves.value.y = Wind.dir.y;
    u.uErode.value.x = dt * this.speed / E.steps;
    for (let i = 0; i < E.steps; i++) {
      H.render(this.exchangeLoad, this.load.write);   // reads the load and ground as they are…
      H.step('ground', this.exchangeGround);          // …as does this, before the swap below
      this.swapLoad();
      H.render(this.carry, this.load.write);
      this.swapLoad();
      H.render(this.slideAxisPass, this.slideAxis);
      H.render(this.slideDiagPass, this.slideDiag);
      H.step('ground', this.settle);
    }
    this.clock += dt * this.speed;
    if (this.clock >= E.refresh && !this.reading) {
      this.clock = 0;
      this.reading = H.readbackAsync();
      this.reading.steps = 0;
    }
  },

  // The background readback lands a fixed number of sim steps after it was asked for,
  // whatever the frame rate (Heightfield.readbackAsync).
  land() {
    const job = this.reading;
    if (!job || ++job.steps < CONFIG.erosion.readbackSteps) return;
    this.reading = null;
    Heightfield.applyReadback(job.take());
    this.replant();
  },

  // GPU → CPU mirror now (it stalls a little), and re-place the plants.
  refresh(replant = false) {
    Heightfield.readback();
    this.reading = null;
    return this.replant(replant);
  },

  // Re-place the plants once the ground under any of them has moved by more than
  // `replant` (they follow it on the GPU meanwhile, but a gully or a new bar changes
  // where they can stand).
  replant(force = false) {
    const H = Heightfield, S = H.cpu.state;
    let moved = 0;
    for (let k = 0; k < H.data.length; k++)
      if (S[4 * k + 2] > 0.05) moved = Math.max(moved, Math.abs(H.data[k] - this.planted[k]));
    if (force || moved > CONFIG.erosion.replant) {
      Vegetation.build(App.rng.fork('vegetation'));
      this.planted = H.data.slice();
    }
    return moved;
  },
};

// ═════════════════════════════════════════════════════════════════════════════
// SNOW — snow, ice and cold. Snow is the Heightfield's snow layer (ground.a, depth in
// world units); one pair of grid passes a sim step works it:
//  · snowfall: the precipitation layer where the cell's air is below about 1 °C (so
//    it lands on the peak while rain falls on the beach, and the line moves with the
//    weather), settling on ground that faces up, more in the lee (the wind field's
//    lee) and less where it is windswept
//  · sliding: snow on ground steeper than it can hold slides to the lower neighbours
//  · drifting: strong local wind lifts snow off exposed ground (the field's exposure:
//    ridges) and carries it downwind, where it settles in the hollows
//  · melting: above freezing, by the air's warmth and by sunlight on the slope; the
//    meltwater joins the water layer, so a thaw swells the streams and the river
//  · hail: in the strongest storms, in bursts, pellets pile up briefly and melt
// Drawn by others from the layer: the terrain (white over snow), the trees (snow on
// their upper sides), the grass (buried). Below freezing, standing water turns to
// ice (WATER: it stops flowing and is drawn as glossy ice) and on clear cold nights
// frost whitens the grass. Snowflakes and hailstones are GpuParticles like the rain.
// ═════════════════════════════════════════════════════════════════════════════

// Snow each cell sends to its axial neighbours (−x, +x, −z, +z) this step: sliding
// off steep ground, and drifting downwind off exposed ground in strong wind.
const SNOW_MOVE_GLSL = /* glsl */`
uniform vec4 uSnowMove;   // dt, up-component below which snow slides, slide share per s, drift share per s
uniform vec2 uSnowDrift;  // local wind m/s where drifting starts, where it is full
const ivec2 SNOW_OFF[4] = ivec2[4](ivec2(-1, 0), ivec2(1, 0), ivec2(0, -1), ivec2(0, 1));
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 G = layerCell(uLayerGround, c);
  float a = G.a, dt = uSnowMove.x, n = uHeightGrid.y - 1.0;
  if (a <= 1e-5) { gl_FragColor = vec4(0.0); return; }
  float cell = uHeightGrid.x / n;
  vec2 xz = (vec2(c) / n - 0.5) * uHeightGrid.x;
  float h = surfaceCell(c), drop[4], dsum = 0.0, wind[4], wsum = 0.0;
  vec2 w = windAt(xz);
  float U = length(w);
  vec2 dir = U > 1e-3 ? w / U : vec2(0.0);
  for (int i = 0; i < 4; i++) {
    ivec2 q = c + SNOW_OFF[i];
    bool inside = q.x >= 0 && q.y >= 0 && q.x <= int(n) && q.y <= int(n);
    drop[i] = inside ? max(h - surfaceCell(q), 0.0) : 0.0;
    dsum += drop[i];
    wind[i] = inside ? max(dot(dir, vec2(SNOW_OFF[i])), 0.0) : 0.0;
    wsum += wind[i];
  }
  vec3 nrm = normalize(vec3(surfaceCell(c - ivec2(1, 0)) - surfaceCell(c + ivec2(1, 0)), 2.0 * cell,
                            surfaceCell(c - ivec2(0, 1)) - surfaceCell(c + ivec2(0, 1))));
  float slide = a * min(uSnowMove.z * dt, 1.0) * (1.0 - smoothstep(uSnowMove.y - 0.08, uSnowMove.y, nrm.y));
  float exposed = windField(xz).w;
  float drift = a * min(uSnowMove.w * dt, 1.0) * smoothstep(uSnowDrift.x, uSnowDrift.y, U) * exposed;
  float total = slide + drift;
  if (total > a) { slide *= a / total; drift *= a / total; }
  vec4 o;
  for (int i = 0; i < 4; i++) o[i] = (dsum > 0.0 ? slide * drop[i] / dsum : 0.0) + (wsum > 0.0 ? drift * wind[i] / wsum : 0.0);
  gl_FragColor = o;
}`;

// The ground pass: the moves in and out, then snowfall, hail, melt (into the water
// layer); none on the sea.
const SNOW_GROUND_GLSL = /* glsl */`
uniform sampler2D tSnowMove;
uniform vec4 uSnowMove;   // (dt in x)
uniform vec4 uSnowFall;   // depth per s per mm/h of snowfall, facing: up where it starts, where it is full; settling in the lee (extra share)
uniform vec4 uSnowMelt;   // depth per s per °C above freezing, depth per s in full sun, water per unit of snow, deepest
uniform vec4 uSnowSun;    // direction to the sun, xyz; its strength through the cloud
uniform vec2 uHail;       // hail now 0…1 (CPU, the storm's bursts), depth per s per mm/h
vec4 moved(ivec2 c) {
  int n = int(uHeightGrid.y) - 1;
  return c.x < 0 || c.y < 0 || c.x > n || c.y > n ? vec4(0.0) : texelFetch(tSnowMove, c, 0);
}
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 G = layerCell(uLayerGround, c), S = layerCell(uLayerState, c);
  float dt = uSnowMove.x, n = uHeightGrid.y - 1.0, cell = uHeightGrid.x / n;
  vec2 xz = (vec2(c) / n - 0.5) * uHeightGrid.x;
  vec4 o = moved(c);
  float a = G.a - (o.x + o.y + o.z + o.w)
          + moved(c - ivec2(1, 0)).y + moved(c + ivec2(1, 0)).x + moved(c - ivec2(0, 1)).w + moved(c + ivec2(0, 1)).z;
  vec3 nrm = normalize(vec3(groundHeightCell(c - ivec2(1, 0)) - groundHeightCell(c + ivec2(1, 0)), 2.0 * cell,
                            groundHeightCell(c - ivec2(0, 1)) - groundHeightCell(c + ivec2(0, 1))));
  float T = S.g, P = max(S.a, 0.0);
  // Snowfall: below about 1 °C, onto ground facing up, more in the lee, less where windswept.
  float frozen = 1.0 - smoothstep(0.5, 1.5, T);
  vec4 F = windField(xz);
  float settle = smoothstep(uSnowFall.y, uSnowFall.z, nrm.y) * (1.0 + uSnowFall.w * F.z) * (1.0 - 0.5 * F.w);
  a += P * frozen * uSnowFall.x * settle * dt;
  a += P * uHail.x * uHail.y * smoothstep(0.3, 0.6, nrm.y) * dt;
  // Melt: the air above freezing, and the sun on the slope (not in a hard frost).
  float melt = (uSnowMelt.x * max(T, 0.0) + uSnowMelt.y * uSnowSun.w * max(dot(nrm, uSnowSun.xyz), 0.0) * smoothstep(-3.0, 0.0, T)) * dt;
  melt = min(melt, max(a, 0.0));
  a -= melt;
  float g = G.r + G.g, d = G.b;
  if (g < uWaterGrid.y) a = 0.0;   // snow on the sea melts into it
  else d += melt * uSnowMelt.z;
  a = clamp(a == a ? a : 0.0, 0.0, uSnowMelt.w);
  gl_FragColor = vec4(G.rg, d, a);
}`;

// ── Snowflakes and hail ──
// A GpuParticles pool. A free particle tries a spot in the box over the view each
// sim step: it starts as a flake as often as the precipitation layer says it snows
// there, or as a hailstone while the storm's hail lasts. Flakes fall slowly, slanted
// far more than rain (CONFIG.wind.fall.snow) and fluttering, and vanish into the
// snow they land on; hailstones fall fast, bounce and lie for a moment.
// State: x, y, z, and kind · 8192 + the step it started or landed at (w < 0: free).
// Kind 0 a flake, 1 a falling hailstone, 2 a hailstone on the ground.
const SNOW_COMMON_GLSL = /* glsl */`
uniform vec4 uSnowFlake;   // flake fall units/s, flake fall m/s (slant), sim steps per second, hail fall units/s
uniform vec4 uHailBounce;  // first bounce speed units/s, gravity units/s², seconds on the ground, sideways hop
float snowKind(vec4 s) { return floor(s.w / 8192.0); }
float snowAge(vec4 s) { return mod(uParticleStep - mod(s.w, 8192.0), 8192.0) / uSnowFlake.z; }
// Sideways per unit of fall, eased toward about 70° from the vertical.
vec2 snowSlant(vec2 xz, float fall) {
  vec2 sl = windSlant(xz, fall);
  float l = length(sl);
  return l > 1e-4 ? sl * (2.6 * tanh(l / 2.6) / l) : sl;
}
// A flake's velocity: falling and slanting, with a flutter of its own.
vec3 flakeVelocity(vec3 p, float id, float t) {
  vec2 sl = snowSlant(p.xz, uSnowFlake.y);
  float ph = id * 0.37;
  return vec3(sl.x, -1.0, sl.y) * uSnowFlake.x + vec3(sin(t * 1.9 + ph), 0.0, cos(t * 1.6 + ph * 1.3)) * 1.2;
}
// Where a hailstone that landed at p is, age seconds on: two bounces, a little hop.
vec3 hailHop(vec3 p, float id, float age) {
  float v = uHailBounce.x, g = uHailBounce.y, t1 = 2.0 * v / g, t = age, y = 0.0;
  if (t < t1) y = v * t - 0.5 * g * t * t;
  else if (t < 1.5 * t1) { float u = t - t1; y = 0.5 * v * u - 0.5 * g * u * u; }
  float a = id * 2.399;
  return p + vec3(cos(a), 0.0, sin(a)) * uHailBounce.w * min(t / (1.5 * t1), 1.0) + vec3(0.0, max(y, 0.0), 0.0);
}`;

const SNOW_STEP_GLSL = /* glsl */`
uniform vec4 uSnowBox;    // centre x, z; half-width; start height above the ground
uniform vec4 uSnowEmit;   // flake chance per step in heavy snow, heavy mm/h, sea level, hail chance per step now
float snowSurface(vec2 xz) {
  vec4 G = layerAt(uLayerGround, xz);
  return max(G.r + G.g + G.b + G.a, uSnowEmit.z);
}
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  float id = particleId(c), dt = 1.0 / uSnowFlake.z, t = uParticleStep * dt;
  vec4 s = texelFetch(tState, c, 0);
  vec4 FREE = vec4(0.0, 0.0, 0.0, -1.0);
  if (s.w < 0.0) {
    vec4 r = particleRand(id, uParticleStep, 3u);
    vec2 land = uSnowBox.xy + (r.xy * 2.0 - 1.0) * uSnowBox.z;
    vec4 S = layerAt(uLayerState, land);
    float heavy = clamp(S.a / uSnowEmit.y, 0.0, 1.5);
    float flake = uSnowEmit.x * pow(heavy, 1.2) * (1.0 - smoothstep(0.5, 1.5, S.g));
    float hail = uSnowEmit.w * heavy;
    if (r.z >= flake + hail) { gl_FragColor = FREE; return; }
    bool isFlake = r.z < flake;
    float drop = uSnowBox.w * (0.4 + 0.6 * r.w);
    vec2 xz = land - snowSlant(land, isFlake ? uSnowFlake.y : uSnowFlake.w * uSnowFlake.y / uSnowFlake.x) * drop;
    gl_FragColor = vec4(xz.x, snowSurface(land) + drop, xz.y, (isFlake ? 0.0 : 1.0) * 8192.0 + uParticleStep);
    return;
  }
  float kind = snowKind(s);
  if (kind > 1.5) { gl_FragColor = snowAge(s) > uHailBounce.z ? FREE : s; return; }
  vec3 p;
  if (kind < 0.5) p = s.xyz + flakeVelocity(s.xyz, id, t) * dt;
  else { vec2 sl = snowSlant(s.xz, uSnowFlake.w * uSnowFlake.y / uSnowFlake.x); p = s.xyz + vec3(sl.x, -1.0, sl.y) * uSnowFlake.w * dt; }
  float surf = snowSurface(p.xz);
  if (p.y <= surf) { gl_FragColor = kind < 0.5 ? FREE : vec4(p.x, surf, p.z, 2.0 * 8192.0 + uParticleStep); return; }
  vec2 off = abs(p.xz - uSnowBox.xy);
  gl_FragColor = max(off.x, off.y) > 1.6 * uSnowBox.z ? FREE : vec4(p, s.w);
}`;

// Flakes are small soft discs facing the camera (extrapolated between sim steps), hail
// smaller, harder pellets; both lit like the rain: the shadow band with the sky in it,
// the sun through the cloud, and the lightning flash.
const SNOW_DRAW_VERTEX = /* glsl */`
attribute vec2 aCell;
uniform vec4 uSnowDraw;    // seconds since the last sim step, flake size, hail size, fewest pixels
uniform vec2 uSnowView;    // drawing buffer size
uniform vec3 uSnowAlbedo, uHailAlbedo, uSunLight, uShadowTint, uSkyColor, uFlashColor;
uniform float uSkyBounce, uSnowCover;
uniform vec4 uFlash;
varying vec3 vSnowColor;
varying float vSnowAlpha;
varying vec2 vSnowUV;
void main() {
  vec4 s = texelFetch(tState, ivec2(aCell), 0);
  vSnowAlpha = 0.0;
  vSnowColor = vec3(0.0);
  vSnowUV = vec2(0.0);
  gl_Position = vec4(0.0, 0.0, 2.0, 1.0);
  if (s.w < 0.0) return;
  float id = particleId(ivec2(aCell)), kind = snowKind(s), age = snowAge(s) + uSnowDraw.x;
  float t = uParticleStep / uSnowFlake.z + uSnowDraw.x;
  vec3 at;
  if (kind < 0.5) at = s.xyz + flakeVelocity(s.xyz, id, t) * uSnowDraw.x;
  else if (kind < 1.5) { vec2 sl = snowSlant(s.xz, uSnowFlake.w * uSnowFlake.y / uSnowFlake.x); at = s.xyz + vec3(sl.x, -1.0, sl.y) * uSnowFlake.w * uSnowDraw.x; }
  else at = hailHop(s.xyz, id, age);
  vec4 cp = projectionMatrix * viewMatrix * vec4(at, 1.0);
  if (cp.w < 1.0) return;
  vec2 res = 0.5 * uSnowView;
  float size = kind < 0.5 ? uSnowDraw.y : uSnowDraw.z;
  float px = size * projectionMatrix[1][1] * res.y / cp.w;
  float wpx = max(px, uSnowDraw.w);
  vSnowUV = vec2(position.x * 2.0 - 1.0, position.y);
  gl_Position = cp + vec4(vSnowUV * wpx / res * cp.w, 0.0, 0.0);
  vSnowAlpha = (kind < 0.5 ? 0.85 : 1.0) * clamp(px / uSnowDraw.w, 0.35, 1.0) * smoothstep(8.0, 30.0, cp.w);
  if (kind > 1.5) vSnowAlpha *= 1.0 - smoothstep(0.7, 1.0, age / uHailBounce.z);
  vec3 alb = kind < 0.5 ? uSnowAlbedo : uHailAlbedo;
  vec3 col = alb * (uShadowTint + uSkyColor * uSkyBounce);
  col = max(col, alb * uSunLight * (0.75 - 0.35 * uSnowCover));
  float flash = uFlash.w / (1.0 + dot(at - uFlash.xyz, at - uFlash.xyz) / 90000.0);
  vSnowColor = mix(col, uFlashColor, clamp(flash, 0.0, 1.0));
}`;

const SNOW_DRAW_FRAGMENT = /* glsl */`
layout(location = 1) out highp vec4 gNormal;
varying vec3 vSnowColor;
varying float vSnowAlpha;
varying vec2 vSnowUV;
void main() {
  if (vSnowAlpha < 0.01 || dot(vSnowUV, vSnowUV) > 1.0) discard;
  gl_FragColor = vec4(vSnowColor, min(vSnowAlpha, 1.0));
  gNormal = vec4(0.5, 0.5, 1.0, 0.0);
}`;

const Snow = {
  hail: 0,      // 0…1: hail falling now (the strongest storms, in bursts)
  frost: 0,     // 0…1: how much a clear, still night frosts the cold ground (eased)

  init() {
    const C = CONFIG.snow, H = Heightfield, P = Look.palette, L = Look.uniforms, W = CONFIG.water;
    this.moveTarget = H.makeTarget();
    const move = { uSnowMove: { value: new THREE.Vector4(0, C.slide[0], C.slide[1], C.drift[2]) } };
    const pre = SKY_NOISE_GLSL + WIND_GLSL;
    this.movePass = H.passMaterial(pre + SNOW_MOVE_GLSL, {
      ...Wind.uniforms, ...move, uSnowDrift: { value: new THREE.Vector2(C.drift[0], C.drift[1]) },
    });
    this.sunUniform = { value: new THREE.Vector4() };
    this.ground = H.passMaterial(pre + WATER_GLSL + SNOW_GROUND_GLSL, {
      ...Wind.uniforms, ...Water.uniforms, ...move,
      tSnowMove: { value: this.moveTarget.texture },
      uSnowFall: { value: new THREE.Vector4(C.gain, ...C.facing, C.lee) },
      uSnowMelt: { value: new THREE.Vector4(C.melt, C.meltSun, C.water, C.max) },
      uSnowSun: this.sunUniform,
      uHail: { value: new THREE.Vector2(0, C.hail[1]) },
    });

    // Flakes and hail.
    const F = C.flakes, unitsPerMs = CONFIG.rain.fall / CONFIG.wind.fall.rain;
    const common = {
      uSnowFlake: { value: new THREE.Vector4(CONFIG.wind.fall.snow * unitsPerMs, CONFIG.wind.fall.snow, CONFIG.simHz, F.hailFall) },
      uHailBounce: { value: new THREE.Vector4(...F.bounce) },
    };
    this.particles = new GpuParticles(F.size, SKY_NOISE_GLSL + WIND_GLSL + SNOW_COMMON_GLSL + SNOW_STEP_GLSL, {
      ...Wind.uniforms, ...common,
      uSnowBox: { value: new THREE.Vector4(0, 0, 200, F.top) },
      uSnowEmit: { value: new THREE.Vector4(F.emit, F.heavy, Tide.level, 0) },
    });
    this.uniforms = {
      ...this.particles.uniforms,
      uSnowDraw: { value: new THREE.Vector4(0, F.flake, F.hail, F.minPx) },
      uSnowView: { value: Post.size },
      uSnowAlbedo: { value: P.snow }, uHailAlbedo: { value: new THREE.Color().copy(P.ice).lerp(P.snow, 0.5) },
      uSunLight: { value: sun.color },
      uShadowTint: L.uShadowTint, uSkyColor: L.uSkyColor, uSkyBounce: L.uSkyBounce,
      uFlash: L.uFlash, uFlashColor: { value: P.flash }, uSnowCover: { value: 0 },
    };
    const material = new THREE.ShaderMaterial({
      uniforms: this.uniforms,
      vertexShader: SKY_NOISE_GLSL + WIND_GLSL + GPU_PARTICLE_GLSL + SNOW_COMMON_GLSL + SNOW_DRAW_VERTEX,
      fragmentShader: SNOW_DRAW_FRAGMENT,
      transparent: true, depthWrite: false,
    });
    material.userData.gbuffer = true;
    this.geometry = this.particles.geometry();
    this.mesh = new THREE.Mesh(this.geometry, material);
    this.mesh.frustumCulled = false;
    this.mesh.name = 'snowfall';
    scene.add(this.mesh);
    Quality.on('particles', f => { this.geometry.instanceCount = Math.floor(this.particles.count * f); });

    this.reseed(App.rng);
    App.on('seed', rng => this.reseed(rng));
    Loop.onSim(dt => this.step(dt));
    Loop.onFrame((dt, time, alpha) => {
      this.uniforms.uSnowDraw.value.x = alpha / CONFIG.simHz;
      this.uniforms.uSnowCover.value = Atmosphere.cover;
    });
  },

  reseed(rng) { this.particles.reset(rng.fork('snow').int(0, 65535)); },

  step(dt) {
    const C = CONFIG.snow, A = Atmosphere, H = Heightfield, ss = THREE.MathUtils.smoothstep;
    // Hail: only in the strongest storms, and then in bursts.
    this.hail = ss(A.stormK, C.hail[0], 1) * ss(A.precip, 10, 18) * ss(A.wander(11), 0.1, 0.45);
    // Frost: clear, still nights (the ground under a clear sky cools well below the air).
    const frostTarget = (1 - Celestial.daylight) * (1 - ss(A.cover, 0.3, 0.7)) * (1 - ss(A.windSpeed, 4, 9));
    this.frost += (frostTarget - this.frost) * (1 - Math.exp(-dt / C.frostSeconds));
    Vegetation.cold.value.x = this.frost;
    const sunK = ss(Celestial.sunDir.y, -0.02, 0.25) * (1 - 0.8 * A.cover);
    this.sunUniform.value.set(Celestial.sunDir.x, Celestial.sunDir.y, Celestial.sunDir.z, sunK);
    this.ground.uniforms.uHail.value.x = this.hail;
    this.movePass.uniforms.uSnowMove.value.x = dt;
    H.render(this.movePass, this.moveTarget);
    H.step('ground', this.ground);
    // Flakes and hail over the view.
    const F = C.flakes, t = CameraRig.target, u = this.particles.uniforms;
    u.uSnowBox.value.set(t.x, t.z, THREE.MathUtils.clamp(CameraRig.cur.dist * F.area[0], F.area[1], F.area[2]), F.top);
    u.uSnowEmit.value.z = Tide.level;
    u.uSnowEmit.value.w = F.hailEmit * this.hail;
    this.particles.step();
  },

  // Totals over the CPU mirror: snow volume, cells under snow, the deepest.
  stats() {
    const H = Heightfield, n = H.res * H.res, a = H.cell * H.cell;
    let volume = 0, covered = 0, deepest = 0;
    for (let k = 0; k < n; k++) {
      const d = H.get('snow', k);
      volume += d * a;
      if (d > CONFIG.terrain.snowCover) covered++;
      deepest = Math.max(deepest, d);
    }
    return { volume, covered, deepest };
  },
};

// ═════════════════════════════════════════════════════════════════════════════
// LIGHTNING — strikes in storm cloud. How often follows the storm's strength. Each
// picks its point with a weighting toward the tall and exposed (the peak, ridges,
// tall trees, and the open sea), never uniformly. A strike:
//  · grows as a stepped leader: a branching channel that jerks down from the cloud
//    toward its point a step at a time
//  · then the return stroke: the main channel as a bright core with a glow, flickering
//    two or three times as it re-strikes, while the branches fade
//  · lights the whole scene while it lasts: the shadow-casting light swings to the
//    strike and turns white, so hard toon shadows are thrown away from it, and the sky,
//    the rain, snow and wet surfaces flash (Look.uniforms.uFlash)
//  · emits App 'strike' (AUDIO turns it into thunder, delayed by distance / 343 m/s)
//  · on a tree, scorches it black; if the ground under it is dry it smoulders and
//    smokes a while (rain puts it out)
// ═════════════════════════════════════════════════════════════════════════════

// A bolt is instanced segments (a, b world ends; info: core width, order along the
// leader 0…1, 1 on the main channel, 0 on a branch), each a quad facing the camera.
const BOLT_VERTEX = /* glsl */`
attribute vec3 aA, aB;
attribute vec4 aInfo;
uniform vec4 uBolt;        // leader reach 0…1, main channel brightness, branch brightness, glow width ×
uniform vec2 uBoltView;    // drawing buffer size
uniform float uBoltMinPx;
varying vec2 vAcross;      // across the quad −1…1 (x), glow share of the width (y)
varying float vBright;
void main() {
  vBright = 0.0;
  vAcross = vec2(0.0);
  gl_Position = vec4(0.0, 0.0, 2.0, 1.0);
  if (aInfo.y > uBolt.x) return;   // not reached yet
  vBright = aInfo.z > 0.5 ? uBolt.y : uBolt.z;
  if (vBright < 0.003) return;
  vec4 ca = projectionMatrix * viewMatrix * vec4(aA, 1.0), cb = projectionMatrix * viewMatrix * vec4(aB, 1.0);
  if (ca.w < 0.5 || cb.w < 0.5) return;
  vec2 res = 0.5 * uBoltView, A = ca.xy / ca.w * res, B = cb.xy / cb.w * res, d = B - A;
  float L = length(d);
  vec2 t = L > 1e-3 ? d / L : vec2(0.0, 1.0), nrm = vec2(-t.y, t.x);
  vec4 c = mix(ca, cb, position.x);
  float core = max(aInfo.x * projectionMatrix[1][1] * res.y / c.w, uBoltMinPx * (aInfo.z > 0.5 ? 1.0 : 0.6));
  float hw = core * uBolt.w;
  vec2 P = mix(A, B, position.x) + (nrm * position.y + t * (position.x * 2.0 - 1.0)) * hw;   // a little past each end, so joints close
  gl_Position = vec4(P / res * c.w, c.z, c.w);
  vAcross = vec2(position.y, 1.0 / uBolt.w);
}`;

const BOLT_FRAGMENT = /* glsl */`
uniform vec3 uBoltCore, uBoltGlow;
varying vec2 vAcross;
varying float vBright;
void main() {
  float r = abs(vAcross.x);
  float core = 1.0 - step(vAcross.y, r);                          // a hard white core…
  float glow = (1.0 - smoothstep(vAcross.y, 1.0, r)) * 0.55;      // …in a soft glow
  float a = max(core, glow) * vBright;
  if (a < 0.01) discard;
  gl_FragColor = vec4(mix(uBoltGlow, uBoltCore, core) * vBright * (core > 0.5 ? 2.2 : 1.0), a);
}`;

const Lightning = {
  strike: null,       // the strike under way: { at, top, time, strokes[], tree }
  smoulders: [],      // { tree, until, start }
  count: 0,

  init() {
    const C = CONFIG.lightning, P = Look.palette;
    this.max = C.segments;
    const g = new THREE.InstancedBufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute([0, -1, 0, 1, -1, 0, 0, 1, 0, 1, 1, 0], 3));
    g.setIndex([0, 1, 2, 2, 1, 3]);
    this.aA = new THREE.InstancedBufferAttribute(new Float32Array(this.max * 3), 3);
    this.aB = new THREE.InstancedBufferAttribute(new Float32Array(this.max * 3), 3);
    this.aInfo = new THREE.InstancedBufferAttribute(new Float32Array(this.max * 4), 4);
    for (const a of [this.aA, this.aB, this.aInfo]) a.setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('aA', this.aA); g.setAttribute('aB', this.aB); g.setAttribute('aInfo', this.aInfo);
    g.instanceCount = 0;
    this.uniforms = {
      uBolt: { value: new THREE.Vector4() },
      uBoltView: { value: Post.size },
      uBoltMinPx: { value: C.minPx },
      uBoltCore: { value: P.flash }, uBoltGlow: { value: new THREE.Color().copy(P.flash).lerp(P.shadow, 0.35) },
    };
    this.mesh = new THREE.Mesh(g, new THREE.ShaderMaterial({
      uniforms: this.uniforms, vertexShader: BOLT_VERTEX, fragmentShader: BOLT_FRAGMENT,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    }));
    this.mesh.frustumCulled = false;
    this.mesh.renderOrder = 10;
    this.mesh.name = 'lightning';
    scene.add(this.mesh);

    // Smoke from smouldering trees: toon puffs, rising and drifting downwind.
    this.puffMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1),
      Toon.material({ color: new THREE.Color().copy(P.cloudShade).lerp(P.storm, 0.5) }), C.smoke.puffs * C.smoke.most);
    this.puffMesh.frustumCulled = false;
    this.puffMesh.name = 'smoke';
    this.puffMesh.count = 0;
    scene.add(this.puffMesh);

    this.reseed(App.rng);
    App.on('seed', rng => this.reseed(rng));
    App.on('terrain', () => { this.candidates = null; });   // the ground moved: weigh the points again
    Loop.onSim(dt => this.step(dt));
  },

  reseed(rng) {
    this.rng = rng.fork('lightning');
    this.strike = null;
    this.smoulders = [];
    this.candidates = null;
  },

  // Every point a bolt may strike, with its weight: the land by height and by how
  // much it stands above the ground round it (ridges, the peak), the trees by their
  // height and where they stand, and the open sea at a low, even weight.
  weigh() {
    const C = CONFIG.lightning.weights, H = Heightfield, r = H.res, peak = Math.max(Terrain.summit.y, 1);
    const list = [], step = 5, ring = 6;
    for (let j = ring; j < r - ring; j += step) {
      for (let i = ring; i < r - ring; i += step) {
        const k = j * r + i, h = H.data[k];
        if (h < 0.5) continue;
        const around = (H.data[k - ring] + H.data[k + ring] + H.data[k - ring * r] + H.data[k + ring * r]) / 4;
        const w = C.land + C.height * (h / peak) ** 2 + C.ridge * Math.max(h - around, 0);
        list.push({ x: H.coord(i), y: h, z: H.coord(j), w });
      }
    }
    for (const t of Vegetation.trees)
      list.push({ x: t.x, y: t.y + t.height, z: t.z, w: C.tree + C.treeHeight * t.height + C.height * (t.y / peak) ** 2, tree: t });
    const sea = this.rng.fork('sea-points');
    for (let n = 0; n < C.seaPoints; n++) {
      const a = sea.range(0, Math.PI * 2), d = sea.range(0.82, 1.6) * H.size / 2;
      list.push({ x: Math.cos(a) * d, y: Tide.level, z: Math.sin(a) * d, w: C.sea, sea: true });
    }
    this.candidates = list;
  },

  step(dt) {
    const C = CONFIG.lightning, A = Atmosphere;
    const rate = C.rate * Math.pow(A.stormK, 2);
    if (!this.strike && rate > 0 && this.rng.next() < rate * dt) this.begin();
    const s = this.strike;
    if (s && Loop.simTime - s.time > s.end) this.strike = null;
    // Smouldering trees: rain or wet ground puts them out; otherwise they burn down.
    const H = Heightfield;
    this.smoulders = this.smoulders.filter(m => Loop.simTime < m.until && H.sampleLayer('wetness', m.tree.x, m.tree.z) < C.smoke.wetOut);
  },

  // A new strike: its point, its channel and branches, and its strokes.
  begin() {
    const C = CONFIG.lightning, r = this.rng.fork(`strike-${this.count++}`), A = Atmosphere;
    if (!this.candidates) this.weigh();
    const list = this.candidates, at = list[this.rng.weighted(list.map(c => c.w))];
    const top = new THREE.Vector3(at.x + r.range(-25, 25), Math.max(at.y + C.height[0], C.height[1]) + r.range(0, 25), at.z + r.range(-25, 25));
    const end = new THREE.Vector3(at.x, at.y, at.z);
    const segs = [];
    // The main channel: a jagged walk from the cloud to the point.
    const walk = (from, to, branch, depth, orderFrom) => {
      const p = from.clone(), total = Math.max(from.distanceTo(to), 1);
      let order = orderFrom, steps = 0;
      const maxSteps = branch ? r.int(4, 12) : 400;
      while (steps++ < maxSteps && segs.length < this.max) {
        const toward = new THREE.Vector3().subVectors(to, p);
        const left = toward.length();
        const len = r.range(C.step[0], C.step[1]);
        if (!branch && left < len * 1.2) { segs.push([p.clone(), to.clone(), order, 1]); break; }
        toward.normalize();
        const jit = new THREE.Vector3(r.range(-1, 1), r.range(-0.6, 0.3), r.range(-1, 1)).multiplyScalar(C.jag);
        const dir = toward.add(jit).normalize();
        if (branch) dir.y = Math.min(dir.y, -0.25);
        const q = p.clone().addScaledVector(dir, len);
        const next = order + len / total;
        segs.push([p.clone(), q.clone(), order, branch ? 0 : 1]);
        if (depth < 2 && r.next() < C.branch * (branch ? 0.5 : 1) * (1 - 0.6 * order)) {
          const side = new THREE.Vector3(r.range(-1, 1), -r.range(0.6, 1.4), r.range(-1, 1)).normalize();
          walk(q, q.clone().addScaledVector(side, total), true, depth + 1, next);
        }
        p.copy(q);
        order = next;
      }
    };
    walk(top, end, false, 0, 0);
    // Write the segments: core width by kind, order scaled to the main channel's length.
    const mainEnd = Math.max(...segs.filter(sg => sg[3]).map(sg => sg[2]), 1e-3);
    segs.forEach((sg, i) => {
      sg[0].toArray(this.aA.array, 3 * i); sg[1].toArray(this.aB.array, 3 * i);
      this.aInfo.array.set([sg[3] ? C.width : C.width * 0.45, Math.min(sg[2] / mainEnd, 1), sg[3], 0], 4 * i);
    });
    for (const a of [this.aA, this.aB, this.aInfo]) a.needsUpdate = true;
    this.mesh.geometry.instanceCount = segs.length;
    // Strokes: the return stroke when the leader lands, then one or two re-strikes.
    const strokes = [C.leader];
    const n = r.int(2, 3);
    for (let k = 1; k < n; k++) strokes.push(strokes[k - 1] + r.range(C.restrike[0], C.restrike[1]));
    this.strike = { at: end, top, time: Loop.simTime, strokes, end: strokes.at(-1) + C.fade * 4, tree: at.tree, sea: !!at.sea };
    const camDist = camera.position.distanceTo(end) * CONFIG.terrain.metresPerUnit;
    App.emit('strike', { x: end.x, y: end.y, z: end.z, metres: camDist, sea: !!at.sea });
    if (at.tree) this.scorch(at.tree);
  },

  scorch(tree) {
    const C = CONFIG.lightning.smoke, attr = tree.mesh.geometry.attributes.aScorch;
    attr.array[tree.index] = 1;
    attr.needsUpdate = true;
    tree.scorched = true;
    const dry = Heightfield.sampleLayer('wetness', tree.x, tree.z) < C.dry;
    if (dry && this.smoulders.length < C.most)
      this.smoulders.push({ tree, start: Loop.simTime, until: Loop.simTime + this.rng.range(C.seconds[0], C.seconds[1]) });
  },

  // Brightness of the strike t seconds after it began: the leader's faint glow, then
  // each stroke a sharp flash that dies away.
  envelope(t) {
    const s = this.strike, C = CONFIG.lightning;
    let e = 0;
    for (const t0 of s.strokes) if (t >= t0) e = Math.max(e, Math.exp(-(t - t0) / C.fade));
    return e;
  },

  // Each frame, after the sky has aimed the light: the bolt, the flash, the smoke.
  frame(alpha) {
    const C = CONFIG.lightning, P = Look.palette, L = Look.uniforms, u = this.uniforms.uBolt.value;
    const now = Loop.simTime + alpha / CONFIG.simHz, s = this.strike;
    let env = 0;
    if (s) {
      const t = now - s.time;
      const reach = Math.min(Math.floor(t / C.leader * C.leaderSteps) / C.leaderSteps, 1);   // jerks down a step at a time
      env = this.envelope(t);
      const lead = t < C.leader ? 0.35 : 0;
      u.set(reach, Math.max(env, lead), Math.max(env * 0.45, lead * 0.8), C.glow);
      this.mesh.visible = true;
    } else { u.set(0, 0, 0, C.glow); this.mesh.visible = false; }
    L.uFlash.value.set(s ? s.at.x : 0, s ? s.at.y : 0, s ? s.at.z : 0, env);
    if (env > 0.01) {
      // The light swings to the strike: from the channel, white, and strong.
      const mid = new THREE.Vector3().lerpVectors(s.at, s.top, 0.4);
      const dir = mid.sub(CameraRig.target).normalize();
      if (dir.y < 0.15) { dir.y = 0.15; dir.normalize(); }
      sun.position.copy(sun.target.position).addScaledVector(dir, 600);
      const k = Math.min(env, 1);
      sun.color.lerp(new THREE.Color().copy(P.flash).multiplyScalar(C.light), k);
      L.uShadowTint.value.lerp(new THREE.Color().copy(P.flash).multiplyScalar(C.ambient), k);
      const S = Sky.uniforms;
      S.uZenith.value.lerp(P.flash, k * C.sky);
      S.uHorizon.value.lerp(P.flash, k * C.sky);
    }
    this.drawSmoke(now);
  },

  drawSmoke(now) {
    const C = CONFIG.lightning.smoke, m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
    const wind = Wind.dir, U = Wind.speed;
    let n = 0;
    for (const sm of this.smoulders) {
      const t = sm.tree, fade = Math.min((sm.until - now) / 6, 1, (now - sm.start) / 2);
      for (let i = 0; i < C.puffs; i++) {
        const age = ((now - sm.start) / C.rise[1] + i / C.puffs) % 1;   // 0…1 through its rise
        const h = t.y + t.height * 0.8 + age * C.rise[0];
        const drift = age * C.rise[1] * U * C.drift;
        p.set(t.x + wind.x * drift + Math.sin(i * 2.4 + now * 0.7) * 0.6, h, t.z + wind.y * drift + Math.cos(i * 1.7 + now * 0.6) * 0.6);
        const r = C.size * Math.sin(Math.PI * Math.min(age * 1.2, 1)) * (0.6 + 0.8 * age) * Math.max(fade, 0);
        m.compose(p, q, sc.setScalar(Math.max(r, 0)));
        this.puffMesh.setMatrixAt(n++, m);
      }
    }
    this.puffMesh.count = n;
    if (n) this.puffMesh.instanceMatrix.needsUpdate = true;
  },
};

// ═════════════════════════════════════════════════════════════════════════════
// RENDERING — WebGL2 renderer, scene, camera, and the resize logic that keeps the
// drawing buffer near 1080p. Toon materials, outlines, sky and water hang off this.
// ═════════════════════════════════════════════════════════════════════════════

const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: false,                 // the outline post-pass handles edges; MSAA would cost fill rate
  powerPreference: 'high-performance',
  stencil: false,
});
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;   // palette colours must come out exactly as picked
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

// What the GPU can do; the GPU simulations check this before choosing texture formats.
const gl = renderer.getContext();
const CAPS = {
  webgl2: renderer.capabilities.isWebGL2 !== false,
  floatRenderTarget: !!gl.getExtension('EXT_color_buffer_float'),
  floatLinear: !!gl.getExtension('OES_texture_float_linear'),
  maxTextureSize: renderer.capabilities.maxTextureSize,
};

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(CONFIG.camera.fov, 1, CONFIG.camera.near, CONFIG.camera.far);
camera.position.fromArray(CONFIG.camera.position);
camera.lookAt(new THREE.Vector3().fromArray(CONFIG.camera.target));

// ── Camera rig ──────────────────────────────────────────────────────────────
// Orbits the camera round a fixed target on the island. Drag (mouse, pen or one
// finger) turns it, the wheel or a pinch zooms within CONFIG.orbit.distance, and
// after idleSeconds without input it eases into a slow drift round the island.
// It runs per frame on real time, so pausing or speeding up the sim leaves it alone.
// State is yaw/pitch/distance; `goal` is where input wants the view, `cur` chases it.
const CameraRig = {
  target: new THREE.Vector3().fromArray(CONFIG.camera.target),
  goal: { yaw: 0, pitch: 0, dist: 0 },
  cur: { yaw: 0, pitch: 0, dist: 0 },
  spin: { yaw: 0, pitch: 0 },      // fling velocity, radians per second
  idle: 0,                         // seconds since the last input
  drift: 0,                        // 0 … 1, how far the idle drift has eased in
  driftTime: 0,
  pointers: new Map(),

  init() {
    const off = camera.position.clone().sub(this.target);
    const dist = off.length();
    Object.assign(this.goal, { yaw: Math.atan2(off.x, off.z), pitch: Math.asin(off.y / dist), dist });
    this.clampGoal();
    Object.assign(this.cur, this.goal);

    canvas.addEventListener('pointerdown', e => this.down(e));
    canvas.addEventListener('pointermove', e => this.move(e));
    canvas.addEventListener('pointerup', e => this.up(e));
    canvas.addEventListener('pointercancel', e => this.up(e));
    canvas.addEventListener('wheel', e => this.wheel(e), { passive: false });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    Loop.onFrame(dt => this.update(dt));
    this.apply();
  },

  // Any input stops the drift at once and restarts the idle clock.
  wake() { this.idle = 0; this.drift = 0; },

  clampGoal() {
    const O = CONFIG.orbit, d2r = THREE.MathUtils.DEG2RAD;
    this.goal.pitch = THREE.MathUtils.clamp(this.goal.pitch, O.pitch[0] * d2r, O.pitch[1] * d2r);
    this.goal.dist = THREE.MathUtils.clamp(this.goal.dist, O.distance[0], O.distance[1]);
  },

  pinchSpan() {
    const [a, b] = [...this.pointers.values()];
    return Math.hypot(a.x - b.x, a.y - b.y);
  },

  down(e) {
    canvas.focus();
    canvas.setPointerCapture(e.pointerId);
    this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, t: performance.now() });
    if (this.pointers.size === 2) this.span = this.pinchSpan();
    this.spin.yaw = this.spin.pitch = 0;
    this.wake();
  },

  move(e) {
    const p = this.pointers.get(e.pointerId);
    if (!p) return;
    const now = performance.now(), dx = e.clientX - p.x, dy = e.clientY - p.y;
    const dt = Math.max((now - p.t) / 1000, 1 / 240);
    Object.assign(p, { x: e.clientX, y: e.clientY, t: now });
    this.wake();
    if (this.pointers.size === 2) {
      const span = this.pinchSpan();
      if (this.span > 0 && span > 0) { this.goal.dist *= this.span / span; this.clampGoal(); }
      this.span = span;
      return;
    }
    const r = CONFIG.orbit.rotateSpeed;
    this.goal.yaw -= dx * r;
    this.goal.pitch += dy * r;
    this.clampGoal();
    // Remember the drag speed so letting go mid-drag flings the orbit on.
    const k = Math.min(1, dt * 20);
    this.spin.yaw += (-dx * r / dt - this.spin.yaw) * k;
    this.spin.pitch += (dy * r / dt - this.spin.pitch) * k;
  },

  up(e) {
    const p = this.pointers.get(e.pointerId);
    if (!p) return;
    this.pointers.delete(e.pointerId);
    // A pointer that had stopped before release leaves no fling.
    if (performance.now() - p.t > 80 || this.pointers.size) this.spin.yaw = this.spin.pitch = 0;
    this.span = 0;
    this.wake();
  },

  wheel(e) {
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;   // lines / pages → pixels
    const delta = THREE.MathUtils.clamp(e.deltaY * unit, -300, 300);
    this.goal.dist *= Math.exp(delta * CONFIG.orbit.zoomStep);
    this.clampGoal();
    this.wake();
  },

  update(dt) {
    const O = CONFIG.orbit, d2r = THREE.MathUtils.DEG2RAD;
    if (!this.pointers.size) {
      // Fling: carry on turning, slowing down, until it dies out.
      const fade = Math.exp(-O.inertia * dt);
      this.goal.yaw += this.spin.yaw * dt;
      this.goal.pitch += this.spin.pitch * dt;
      this.spin.yaw *= fade; this.spin.pitch *= fade;
      if (Math.abs(this.spin.yaw) + Math.abs(this.spin.pitch) < 1e-3) this.spin.yaw = this.spin.pitch = 0;
      else this.idle = 0;
      this.clampGoal();

      this.idle += dt;
      if (this.idle > O.idleSeconds) {
        this.drift = Math.min(1, this.drift + dt / O.driftRamp);
        this.driftTime += dt;
        // Smoothstep so the drift eases in rather than starting with a jolt.
        const s = this.drift * this.drift * (3 - 2 * this.drift), tau = Math.PI * 2;
        const [p0, pAmp, pPer] = O.driftPitch, [d0, dAmp, dPer] = O.driftDistance;
        const pitch = (p0 + pAmp * Math.sin(this.driftTime * tau / pPer)) * d2r;
        const dist = d0 + dAmp * Math.sin(this.driftTime * tau / dPer + 1.3);
        const pull = 1 - Math.exp(-0.25 * s * dt);   // slow pull toward the drift framing
        this.goal.yaw += O.driftSpeed * s * dt;
        this.goal.pitch += (pitch - this.goal.pitch) * pull;
        this.goal.dist += (dist - this.goal.dist) * pull;
        this.clampGoal();
      }
    }
    const k = 1 - Math.exp(-O.damping * dt);
    for (const key of ['yaw', 'pitch', 'dist']) this.cur[key] += (this.goal[key] - this.cur[key]) * k;
    this.apply();
  },

  apply() {
    const { yaw, pitch, dist } = this.cur, cp = Math.cos(pitch);
    camera.position.set(Math.sin(yaw) * cp, Math.sin(pitch), Math.cos(yaw) * cp).multiplyScalar(dist).add(this.target);
    // Never below the ground or the sea: lift the camera, keep looking at the target.
    const floor = Math.max(Heightfield.sample(camera.position.x, camera.position.z), CONFIG.ocean.level) + CONFIG.orbit.clearance;
    if (camera.position.y < floor) camera.position.y = floor;
    camera.lookAt(this.target);
  },
};

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxPixelRatio);
  const capped = Math.min(dpr, Math.sqrt(CONFIG.maxDrawPixels / (w * h)));
  const ratio = Math.max(0.5, capped * Quality.get('renderScale'));
  renderer.setPixelRatio(ratio);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  App.emit('resize', w, h, ratio);
}

// ── Palette ─────────────────────────────────────────────────────────────────
// The one hand-picked palette (sRGB hex). Every surface, the sky and the ink take
// their colours from here by name; weather never adds colours, it only re-tints
// these through Look.setWeather(). Add a colour here before using it anywhere.
const PALETTE = {
  // sky
  skyZenith: '#3f7fcf', skyHorizon: '#b9def0', skyNight: '#1c2448', sun: '#fff6e0', moon: '#e4e8ff',
  cloud: '#fbf8f0', cloudShade: '#aab2d6',
  // light and line
  shadow: '#7d76cc', ink: '#2c2747', flash: '#e8eeff', ember: '#e8743b',
  // terrain
  sand: '#efd59b', sandWet: '#c4a46b', soil: '#9c6f4b', grass: '#79bf4f', grassDry: '#bcbf5d',
  rock: '#a39fab', rockDark: '#6f6982', snow: '#f6f8ff', ice: '#cfe8f6',
  // foliage
  foliage: '#4d9a44', foliageDark: '#2f6f46', bark: '#6e4a3b',
  // water
  waterShallow: '#44d2c4', waterDeep: '#1e5ba7', foam: '#f3fbff',
  // weather tints (only ever used as tint targets, never painted directly)
  storm: '#5d6679', haze: '#cad6e3',
};

// ── Look ────────────────────────────────────────────────────────────────────
// Shared state of the cel look: palette colours in linear space, the uniforms every
// toon material shares, the sun, and the weather tint that grades the final image.
const Look = {
  palette: Object.fromEntries(Object.entries(PALETTE).map(([k, hex]) => [k, new THREE.Color(hex)])),

  // Shared by reference with every toon material: change .value once, all follow.
  uniforms: {
    uShadowTint: { value: new THREE.Color() },   // colour of the shadow band (blue-violet)
    uSkyColor: { value: new THREE.Color() },     // sky bounce in shadows, and the rim light colour
    uBands: { value: new THREE.Vector4() },      // shadow threshold, lit threshold, mid level, spec threshold
    uSkyBounce: { value: 0 },
    uShadowHue: { value: 0 },
    uFlash: { value: new THREE.Vector4() },     // a lightning flash: world xyz of the strike, brightness 0…1 (LIGHTNING sets it)
  },

  // Weather tints, all expressed as a pull toward a palette colour, so a weather
  // state only ever re-tints the palette. setWeather() blends these by weight.
  TINTS: {
    clear:    { toward: 'sun',        amount: 0.00, saturation: 1.00, brightness: 1.00, haze: 0.00 },
    overcast: { toward: 'haze',       amount: 0.35, saturation: 0.78, brightness: 0.88, haze: 0.06 },
    rain:     { toward: 'storm',      amount: 0.35, saturation: 0.72, brightness: 0.78, haze: 0.08 },
    storm:    { toward: 'storm',      amount: 0.65, saturation: 0.58, brightness: 0.60, haze: 0.05 },
    snow:     { toward: 'skyHorizon', amount: 0.30, saturation: 0.72, brightness: 1.00, haze: 0.10 },
    fog:      { toward: 'haze',       amount: 0.45, saturation: 0.60, brightness: 0.96, haze: 0.32 },
  },
  grade: { tint: new THREE.Color(1, 1, 1), saturation: 1, brightness: 1, haze: 0 },
  gradeTarget: { tint: new THREE.Color(1, 1, 1), saturation: 1, brightness: 1, haze: 0 },
  weather: { clear: 1 },

  // weights: { clear: 0.2, rain: 0.8 } etc. Moves the tint there smoothly, never snaps.
  setWeather(weights) {
    const t = this.gradeTarget, w = new THREE.Color();
    let total = 0;
    for (const v of Object.values(weights)) total += Math.max(0, v);
    if (total <= 0) return;
    t.tint.setRGB(0, 0, 0); t.saturation = t.brightness = t.haze = 0;
    for (const [name, v] of Object.entries(weights)) {
      const preset = this.TINTS[name];
      if (!preset || v <= 0) continue;
      const k = v / total;
      // Pull toward the palette colour with its brightness factored out, so the
      // tint changes hue only and brightness stays a separate, explicit control.
      const target = this.palette[preset.toward];
      const luma = 0.2126 * target.r + 0.7152 * target.g + 0.0722 * target.b;
      w.setRGB(1, 1, 1).lerp(target.clone().multiplyScalar(1 / Math.max(luma, 1e-3)), preset.amount);
      t.tint.r += w.r * k; t.tint.g += w.g * k; t.tint.b += w.b * k;
      t.saturation += preset.saturation * k;
      t.brightness += preset.brightness * k;
      t.haze += preset.haze * k;
    }
    this.weather = { ...weights };
  },

  update(dt) {
    const g = this.grade, t = this.gradeTarget;
    const k = 1 - Math.exp(-dt / CONFIG.look.tintSeconds);
    g.tint.lerp(t.tint, k);
    g.saturation += (t.saturation - g.saturation) * k;
    g.brightness += (t.brightness - g.brightness) * k;
    g.haze += (t.haze - g.haze) * k;
  },
};
{
  const L = CONFIG.look, P = Look.palette, u = Look.uniforms;
  const s = P.shadow;
  u.uShadowTint.value.copy(s).multiplyScalar(L.shadowStrength / Math.max(s.r, s.g, s.b));
  u.uSkyColor.value.copy(P.skyHorizon);
  u.uBands.value.set(L.bandShadow, L.bandLit, L.midLevel, L.specBand);
  u.uSkyBounce.value = L.skyBounce;
  u.uShadowHue.value = L.shadowHue;
  Look.baseShadowTint = u.uShadowTint.value.clone();   // the day value; Sky dims it at night
}

// ── Sun ─────────────────────────────────────────────────────────────────────
// The one shadow-casting light. The toon shader reads its colour and direction
// through three's light uniforms. Sky.update() aims it from Celestial: at the sun
// by day, at the moon by night, recoloured through sunset.
const sun = new THREE.DirectionalLight(Look.palette.sun, 1.0);
sun.position.copy(Celestial.sunDir).multiplyScalar(600);
sun.castShadow = true;
sun.shadow.camera.left = sun.shadow.camera.bottom = -260;
sun.shadow.camera.right = sun.shadow.camera.top = 260;
sun.shadow.camera.near = 10;
sun.shadow.camera.far = 1400;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.6;
scene.add(sun, sun.target);
Look.sun = sun;

// ── Sky dome ────────────────────────────────────────────────────────────────
// A sphere that follows the camera and is drawn first, behind everything, with no
// depth write (so the outline pass still reads it as sky). Its gradient, sunset
// glow, clouds and night colours are all mixes of palette colours chosen on the
// CPU from Celestial each frame. The clouds are a noise layer on a plane high
// above the island, cut into hard lit / mid / shaded bands. SKY_CLOUD_GLSL is
// shared so cloud shadows on the ground can sample the same field later.
const SKY_NOISE_GLSL = /* glsl */`
float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
vec3 hash33(vec3 p3) {
  p3 = fract(p3 * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yxz + 33.33);
  return fract((p3.xxy + p3.yxx) * p3.zyx);
}
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  float a = hash12(i), b = hash12(i + vec2(1.0, 0.0)), c = hash12(i + vec2(0.0, 1.0)), d = hash12(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}`;

// Where the cloud is comes from the atmosphere: a front is a band of lifted air
// moving downwind, and cloud forms wherever it lifts the air past the cloud base
// (the height where the air cools to its dew point). Positions here are km east
// and south of the island; the CPU twins are in Atmosphere.
const SKY_CLOUD_GLSL = /* glsl */`
uniform vec2 uCloudOffset;   // drift, moved by the wind
uniform vec2 uCloudSeed;
uniform float uCloudCover;   // 0 clear … 1 overcast, away from any front
uniform vec4 uFront;         // unit xz vector toward where the front comes from, its distance upwind of the island (km), half-width (km)
uniform vec4 uFrontCloud;    // how high it lifts the air at its core (km), cloud base (km), cloud deck height (km), rain at its core (mm/h)
// Cloud density at a point on the cloud plane (plane units), 0…1.
float cloudField(vec2 p) {
  p = p * vec2(1.0, 1.7) + uCloudOffset + uCloudSeed;   // stretched a little: rows of cloud
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.07 + vec2(1.7, 9.2); a *= 0.5; }
  return s / 0.9375;
}
// How high the front lifts the air over a point.
float frontLift(vec2 km) { float x = (dot(km, uFront.xy) - uFront.z) / uFront.w; return uFrontCloud.x * exp(-x * x); }
// Cloud where the lift passes the cloud base; rain where the cloud above it is deep.
float frontCover(vec2 km) { return smoothstep(0.0, 1.2, frontLift(km) - uFrontCloud.y); }
float frontRain(vec2 km) { return uFrontCloud.w * smoothstep(1.0, 3.0, frontLift(km) - uFrontCloud.y); }
float cloudCoverAt(vec2 km) { return max(uCloudCover, frontCover(km)); }
float cloudThreshold(float cover) { return mix(0.78, 0.2, cover); }`;

const SKY_VERTEX = /* glsl */`
varying vec3 vDir;
void main() {
  vDir = position;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;

const SKY_FRAGMENT = /* glsl */`
layout(location = 1) out highp vec4 gNormal;
uniform vec3 uZenith, uHorizon, uGlow, uSunColor, uMoonColor, uMoonDark;
uniform vec3 uCloudLit, uCloudMid, uCloudShade, uStarColorA, uStarColorB;
uniform vec3 uSunDir, uMoonDir;
uniform vec4 uBodies;        // cos(sun radius), cos(moon radius), sin(moon radius), moon visibility
uniform vec3 uGradient;      // bands, band mix, glow amount
uniform vec4 uStars;         // visibility, cells, density, twinkle
uniform mat3 uStarRot;
uniform float uTime, uStarSeed, uCloudScale;
varying vec3 vDir;
${SKY_NOISE_GLSL}
${SKY_CLOUD_GLSL}

float hardEdge(float x, float edge) {
  float w = fwidth(x) * 0.75 + 1e-5;
  return smoothstep(edge - w, edge + w, x);
}

void main() {
  vec3 d = normalize(vDir);
  float h = d.y;

  // Gradient, horizon to zenith, partly stepped into bands.
  float t = pow(clamp(h, 0.0, 1.0), 0.5);
  float tb = floor(t * uGradient.x + 0.5) / uGradient.x;
  t = mix(t, tb, uGradient.y);
  vec3 col = mix(uHorizon, uZenith, t);
  if (h < 0.0) col = mix(uHorizon, uZenith, 0.15);

  // Sunrise / sunset glow: a banded fan toward the sun, hugging the horizon.
  float toward = dot(normalize(vec3(d.x, 0.0, d.z) + 1e-5), normalize(vec3(uSunDir.x, 0.0, uSunDir.z) + 1e-5)) * 0.5 + 0.5;
  float glow = uGradient.z * toward * toward * (1.0 - smoothstep(0.0, 0.45, max(h, 0.0)));
  glow = floor(glow * 4.0 + 0.5) / 4.0;
  col = mix(col, uGlow, glow);

  // Stars, fixed to the turning celestial sphere: at most one per 3D cell.
  if (uStars.x > 0.001 && h > -0.02) {
    vec3 p = (uStarRot * d) * uStars.y;
    vec3 c = floor(p);
    vec3 r = hash33(c + uStarSeed);
    if (r.x < uStars.z) {
      vec3 sp = normalize(c + 0.25 + 0.5 * hash33(c + 17.31 + uStarSeed)) * uStars.y;
      float dist = length(p - sp);
      float size = mix(0.07, 0.2, r.y * r.y * r.y);
      float aa = length(fwidth(p));   // continuous across cells, unlike fwidth(dist)
      float star = 1.0 - smoothstep(size * 0.5, size + aa, dist);
      float tw = 1.0 - uStars.w * (0.5 + 0.5 * sin(uTime * (1.5 + 4.0 * r.z) + r.y * 40.0));
      col = mix(col, mix(uStarColorA, uStarColorB, r.z), star * tw * uStars.x * smoothstep(-0.02, 0.12, h));
    }
  }

  // Moon: a disc lit on the side that faces the sun, so it shows its phase.
  float cm = dot(d, uMoonDir);
  if (uBodies.w > 0.0 && cm > uBodies.y - 0.01) {
    vec3 right = normalize(cross(uMoonDir, vec3(0.0, 1.0, 0.0)) + vec3(1e-5, 0.0, 0.0));
    vec3 upv = cross(right, uMoonDir);
    vec2 q = vec2(dot(d, right), dot(d, upv)) / uBodies.z;
    vec3 n = right * q.x + upv * q.y - uMoonDir * sqrt(max(1.0 - dot(q, q), 0.0));
    vec3 face = mix(uMoonDark, uMoonColor, hardEdge(dot(n, uSunDir), 0.0));
    col = mix(col, face, hardEdge(cm, uBodies.y) * uBodies.w);
  }

  // Sun: a hard disc and one flat halo ring.
  float cs = dot(d, uSunDir);
  float halo = hardEdge(cs, 1.0 - (1.0 - uBodies.x) * 3.2) * 0.3;
  col = mix(col, mix(uSunColor, uGlow, 0.3), halo * (1.0 - step(h, -0.01)));
  col = mix(col, uSunColor, hardEdge(cs, uBodies.x));

  // Clouds on a plane above the island, shaded in hard bands: lit, mid and shaded,
  // from how much thicker the cloud gets toward the sun and how deep inside it we are.
  // The deck's horizon lies about 8 deck-heights out, so an approaching front shows
  // there first and spreads overhead as it arrives.
  if (h > 0.0) {
    vec2 q = d.xz / (h + 0.12);
    vec2 p = q * uCloudScale;
    float den = cloudField(p);
    float th = cloudThreshold(cloudCoverAt(q * uFrontCloud.z));
    float cover = hardEdge(den, th) * smoothstep(0.0, 0.1, h);
    if (cover > 0.0) {
      vec2 toSun = normalize(uSunDir.xz + 1e-4) * 0.12;
      float ahead = cloudField(p + toSun);
      float shade = (ahead - den) * 3.0 + (den - th) * 1.6;
      vec3 cc = uCloudLit;
      cc = mix(cc, uCloudMid, hardEdge(shade, 0.12));
      cc = mix(cc, uCloudShade, hardEdge(shade, 0.38));
      col = mix(col, cc, cover);
    }
  }

  gl_FragColor = vec4(col, 1.0);
  gNormal = vec4(0.5, 0.5, 1.0, 0.0);   // no normal: no normal-edge ink or rim on the sky
}`;

const Sky = {
  // All set by the atmosphere.
  wind: new THREE.Vector2().fromArray(CONFIG.sky.cloudDrift),   // cloud drift, plane units per second
  cloudCover: CONFIG.sky.cloudCover,                             // cover away from any front
  overhead: CONFIG.sky.cloudCover,                               // cover right above the island, front included
  storm: 0,                                                      // 0…1: darkens the cloud
  front: { dir: new THREE.Vector2(1, 0), pos: 1e3, width: 15, lift: 0, base: 1, rain: 0 },   // see SKY_CLOUD_GLSL

  init() {
    const P = Look.palette, S = CONFIG.sky, c = () => ({ value: new THREE.Color() });
    this.uniforms = {
      uZenith: c(), uHorizon: c(), uGlow: c(), uSunColor: c(), uMoonColor: c(), uMoonDark: c(),
      uCloudLit: c(), uCloudMid: c(), uCloudShade: c(),
      uStarColorA: { value: P.moon }, uStarColorB: { value: P.sun },
      uSunDir: { value: Celestial.sunDir }, uMoonDir: { value: Celestial.moonDir },
      uBodies: { value: new THREE.Vector4() },
      uGradient: { value: new THREE.Vector3(S.bands, S.bandMix, 0) },
      uStars: { value: new THREE.Vector4(0, S.starCells, S.starDensity, S.starTwinkle) },
      uStarRot: { value: new THREE.Matrix3() },
      uTime: { value: 0 }, uStarSeed: { value: 0 }, uCloudScale: { value: S.cloudScale },
      uCloudOffset: { value: new THREE.Vector2() }, uCloudSeed: { value: new THREE.Vector2() },
      uCloudCover: { value: this.cloudCover },
      uFront: { value: new THREE.Vector4() }, uFrontCloud: { value: new THREE.Vector4() },
    };
    this.updateFront();
    const mat = new THREE.ShaderMaterial({
      uniforms: this.uniforms, vertexShader: SKY_VERTEX, fragmentShader: SKY_FRAGMENT,
      side: THREE.BackSide, depthWrite: false, depthTest: false,
    });
    mat.userData.gbuffer = true;
    this.dome = new THREE.Mesh(new THREE.SphereGeometry(100, 48, 24), mat);
    this.dome.name = 'sky';
    this.dome.renderOrder = -1000;
    this.dome.frustumCulled = false;
    this.dome.onBeforeRender = (r, s, cam) => { this.dome.position.copy(cam.position); this.dome.updateMatrixWorld(); };
    scene.add(this.dome);

    this.pole = new THREE.Vector3(0, Math.sin(THREE.MathUtils.degToRad(S.latitude)), -Math.cos(THREE.MathUtils.degToRad(S.latitude)));
    this.rot4 = new THREE.Matrix4();
    this.reseed(App.rng.fork('sky'));
    App.on('seed', rng => this.reseed(rng.fork('sky')));
    Loop.onSim(dt => this.uniforms.uCloudOffset.value.addScaledVector(this.wind, dt));
  },

  reseed(rng) {
    this.uniforms.uStarSeed.value = rng.range(0, 1000);
    this.uniforms.uCloudSeed.value.set(rng.range(-500, 500), rng.range(-500, 500));
    this.uniforms.uCloudOffset.value.set(0, 0);
  },

  // Recolour sky, light and shadow tint from the current time of day.
  update(time) {
    const P = Look.palette, S = CONFIG.sky, u = this.uniforms, ss = THREE.MathUtils.smoothstep;
    Celestial.update();
    const day = Celestial.daylight, glow = Celestial.twilight;
    const sunH = Celestial.sunDir.y, moonH = Celestial.moonDir.y;
    const night = 1 - day;

    u.uZenith.value.copy(P.skyNight).lerp(P.skyZenith, day);
    u.uHorizon.value.copy(P.skyNight).lerp(P.skyZenith, 0.3).lerp(P.skyHorizon, day);
    u.uGlow.value.copy(P.ember).lerp(P.sun, 0.25);
    u.uGradient.value.z = glow * 0.85;
    u.uSunColor.value.copy(P.sun).lerp(P.ember, glow * 0.6);
    u.uMoonColor.value.copy(P.moon);
    u.uMoonDark.value.copy(u.uZenith.value).lerp(P.moon, 0.12);
    u.uBodies.value.set(
      Math.cos(THREE.MathUtils.degToRad(S.sunSize)),
      Math.cos(THREE.MathUtils.degToRad(S.moonSize)),
      Math.sin(THREE.MathUtils.degToRad(S.moonSize)),
      mix(0.55, 1, night) * ss(moonH, -0.02, 0.02),
    );

    // Clouds: white with a sunset blush by day, moonlit grey-blue by night.
    const nightLit = new THREE.Color().copy(P.skyNight).lerp(P.moon, 0.22);
    u.uCloudLit.value.copy(P.cloud).lerp(P.ember, glow * 0.45).lerp(nightLit, night);
    u.uCloudShade.value.copy(P.cloudShade).lerp(P.skyNight, night * 0.8);
    // Storm cloud: darker bases, greyer tops.
    u.uCloudShade.value.lerp(P.ink, this.storm * 0.45);
    u.uCloudLit.value.lerp(P.cloudShade, this.storm * 0.4);
    u.uCloudMid.value.copy(u.uCloudLit.value).lerp(u.uCloudShade.value, 0.5);
    this.updateFront();

    u.uStars.value.x = ss(-sunH, 0.05, 0.2) * (1 - this.overhead * 0.8);
    u.uStarRot.value.setFromMatrix4(this.rot4.makeRotationAxis(this.pole, Celestial.starAngle));
    u.uTime.value = time;

    // The one light: the sun by day (warming through sunset), the moon by night.
    const sunI = ss(sunH, -0.03, 0.08);
    if (sunH > -0.03 || moonH <= 0) {
      sun.position.copy(Celestial.sunDir);
      sun.color.copy(P.ember).lerp(P.sun, ss(sunH, 0.02, 0.35)).multiplyScalar(sunI);
    } else {
      const moonI = S.moonLight * Celestial.moonLit * ss(moonH, 0.0, 0.12) * ss(-sunH, 0.03, 0.12);
      sun.position.copy(Celestial.moonDir);
      sun.color.copy(P.moon).multiplyScalar(moonI);
    }
    sun.position.multiplyScalar(600).add(sun.target.position);

    // Shadow band and sky bounce follow the sky: dimmer and bluer at night.
    const amb = mix(S.nightAmbient, 1, day);
    const nightHue = P.skyNight.clone().multiplyScalar(1 / Math.max(P.skyNight.r, P.skyNight.g, P.skyNight.b));
    Look.uniforms.uShadowTint.value.copy(Look.baseShadowTint)
      .multiply(new THREE.Color(1, 1, 1).lerp(nightHue, night * 0.45)).multiplyScalar(amb);
    Look.uniforms.uSkyColor.value.copy(u.uHorizon.value).lerp(u.uGlow.value, glow * 0.3);
  },

  updateFront() {
    const u = this.uniforms, f = this.front;
    u.uCloudCover.value = this.cloudCover;
    u.uFront.value.set(f.dir.x, f.dir.y, f.pos, Math.max(f.width, 1e-3));
    u.uFrontCloud.value.set(f.lift, f.base, CONFIG.sky.cloudPlane, f.rain);
  },
};
const mix = (a, b, t) => a + (b - a) * t;

// ── Toon material ───────────────────────────────────────────────────────────
// Every lit surface uses Toon.material(). Light is quantised into hard bands; the
// shadow band is the albedo times a blue-violet tint plus sky bounce, so shadows
// stay coloured instead of greying out. Hooks let other sections bend vertices
// (sway, waves) and choose the albedo (terrain layers, wetness) without forking
// the lighting:
//   vertexPars / vertexMain     — may change `transformed` and `objectNormal`
//   fragmentPars / fragmentMain — may change `albedo`, `gloss` (0…1) and `N`
//   shade — name of a GLSL function with toonShade's signature, defined in
//           fragmentPars, that replaces the lighting (the sea uses this)
// The shader also writes its view-space normal to the G-buffer for the outlines.

const TOON_VERTEX = /* glsl */`
#include <common>
#include <color_pars_vertex>
#include <shadowmap_pars_vertex>
varying vec3 vViewNormal;
varying vec3 vViewPos;
varying vec3 vWorldPos;
/*VERTEX_PARS*/
void main() {
  #include <color_vertex>
  #include <beginnormal_vertex>
  #include <begin_vertex>
  /*VERTEX_MAIN*/
  #include <defaultnormal_vertex>
  #include <project_vertex>
  #include <worldpos_vertex>
  #include <shadowmap_vertex>
  vec4 wp = vec4(transformed, 1.0);
  #ifdef USE_INSTANCING
    wp = instanceMatrix * wp;
  #endif
  vWorldPos = (modelMatrix * wp).xyz;
  vViewNormal = normalize(transformedNormal);
  vViewPos = -mvPosition.xyz;
}`;

// The banded lighting, usable on its own by any shader that includes the light chunks.
const TOON_SHADE_GLSL = /* glsl */`
uniform vec3 uShadowTint;
uniform vec3 uSkyColor;
uniform vec4 uBands;
uniform float uSkyBounce;
uniform float uShadowHue;

float toonStep(float x, float edge) {
  float w = fwidth(x) * 0.75 + 1e-4;   // hard band, antialiased to about one pixel
  return smoothstep(edge - w, edge + w, x);
}

vec3 toonShade(vec3 albedo, vec3 N, vec3 V, float gloss) {
  float up = inverseTransformDirection(N, viewMatrix).y * 0.5 + 0.5;
  // Shadow band: albedo filtered by the blue-violet tint, plus sky bounce on
  // upward faces, plus a little pure tint in proportion to the albedo's
  // brightness, which pulls the hue cool without greying it.
  float luma = dot(albedo, vec3(0.2126, 0.7152, 0.0722));
  vec3 col = albedo * (uShadowTint + uSkyColor * uSkyBounce * up) + uShadowTint * luma * uShadowHue;
  vec3 spec = vec3(0.0);
  #if NUM_DIR_LIGHTS > 0
    DirectionalLight dl;
    #if defined( USE_SHADOWMAP ) && NUM_DIR_LIGHT_SHADOWS > 0
      DirectionalLightShadow dls;
    #endif
    #pragma unroll_loop_start
    for (int i = 0; i < NUM_DIR_LIGHTS; i++) {
      dl = directionalLights[ i ];
      float sh = 1.0;
      #if defined( USE_SHADOWMAP ) && ( UNROLLED_LOOP_INDEX < NUM_DIR_LIGHT_SHADOWS )
        dls = directionalLightShadows[ i ];
        sh = receiveShadow ? getShadow( directionalShadowMap[ i ], dls.shadowMapSize, dls.shadowIntensity, dls.shadowBias, dls.shadowRadius, vDirectionalShadowCoord[ i ] ) : 1.0;
      #endif
      float x = max(dot(N, dl.direction), 0.0) * sh;
      float level = toonStep(x, uBands.x) * uBands.z + toonStep(x, uBands.y) * (1.0 - uBands.z);
      // Lit bands show the palette colour under this light. A light dimmer than the
      // shadow band (sun near the horizon, moon) never darkens it.
      vec3 lit = albedo * dl.color;
      float brighter = step(dot(col, vec3(0.2126, 0.7152, 0.0722)), dot(lit, vec3(0.2126, 0.7152, 0.0722)));
      col = mix(col, lit, level * brighter);
      if (gloss > 0.0) {
        vec3 H = normalize(dl.direction + V);
        float s = pow(max(dot(N, H), 0.0), mix(12.0, 160.0, gloss)) * sh;
        spec += dl.color * toonStep(s, uBands.w) * gloss;
      }
    }
    #pragma unroll_loop_end
  #endif
  return col + spec * 0.7;
}`;

const TOON_FRAGMENT = /* glsl */`
layout(location = 1) out highp vec4 gNormal;
#include <common>
#include <packing>
#include <color_pars_fragment>
#include <bsdfs>
#include <lights_pars_begin>
#include <shadowmap_pars_fragment>
uniform vec3 diffuse;
uniform float opacity;
uniform float uGloss;
varying vec3 vViewNormal;
varying vec3 vViewPos;
varying vec3 vWorldPos;
${TOON_SHADE_GLSL}
/*FRAGMENT_PARS*/
void main() {
  vec3 albedo = diffuse;
  #if defined( USE_COLOR ) || defined( USE_INSTANCING_COLOR )
    albedo *= vColor.rgb;
  #endif
  float gloss = uGloss;
  bool inked = true;   // fragmentMain may clear this to keep ink and rim off a surface (grass)
  vec3 N = normalize(vViewNormal);
  #ifdef DOUBLE_SIDED
    N *= gl_FrontFacing ? 1.0 : -1.0;
  #endif
  /*FRAGMENT_MAIN*/
  vec3 V = normalize(vViewPos);
  gl_FragColor = vec4(/*SHADE*/(albedo, N, V, gloss), opacity);
  gNormal = vec4(N * 0.5 + 0.5, inked ? 1.0 : 0.75);
}`;

const Toon = {
  // opts: color (palette name, hex or THREE.Color), vertexColors, gloss, side,
  // transparent, uniforms, vertexPars, vertexMain, fragmentPars, fragmentMain, shade.
  material(opts = {}) {
    const uniforms = THREE.UniformsUtils.merge([
      THREE.UniformsLib.lights,
      { diffuse: { value: new THREE.Color(1, 1, 1) }, opacity: { value: opts.opacity ?? 1 }, uGloss: { value: opts.gloss ?? 0 } },
    ]);
    Object.assign(uniforms, Look.uniforms, opts.uniforms || {});
    if (opts.color !== undefined) {
      const c = opts.color;
      uniforms.diffuse.value.copy(c instanceof THREE.Color ? c : (Look.palette[c] ?? new THREE.Color(c)));
    }
    const m = new THREE.ShaderMaterial({
      uniforms,
      lights: true,
      vertexColors: !!opts.vertexColors,
      side: opts.side ?? THREE.FrontSide,
      transparent: !!opts.transparent,
      vertexShader: TOON_VERTEX
        .replace('/*VERTEX_PARS*/', opts.vertexPars || '')
        .replace('/*VERTEX_MAIN*/', opts.vertexMain || ''),
      fragmentShader: TOON_FRAGMENT
        .replace('/*FRAGMENT_PARS*/', opts.fragmentPars || '')
        .replace('/*FRAGMENT_MAIN*/', opts.fragmentMain || '')
        .replace('/*SHADE*/', opts.shade || 'toonShade'),
    });
    m.userData.gbuffer = true;   // already writes its own normals
    return m;
  },
};

// ── G-buffer ────────────────────────────────────────────────────────────────
// The scene renders into two colour targets at once: lit colour, and view-space
// normal (alpha 1 = "this pixel has a real normal"; 0.75 = real normal, but draw
// no ink or rim on it, used by grass). Toon materials write both.
// Any other material found in the scene is patched to write a neutral normal with
// alpha 0, so it gets depth outlines but no normal outlines, and so transparent
// effects blend away to nothing in the normal target.
const GBuffer = {
  patched: new WeakSet(),
  patch(material) {
    if (material.userData.gbuffer || this.patched.has(material)) return;
    this.patched.add(material);
    const prevCompile = material.onBeforeCompile;
    const prevKey = material.customProgramCacheKey();
    material.onBeforeCompile = function (shader, r) {
      prevCompile.call(this, shader, r);
      shader.fragmentShader = 'layout(location = 1) out highp vec4 gNormal;\n' +
        shader.fragmentShader.replace(/void\s+main\s*\(\s*(void)?\s*\)\s*\{/, m => m + '\n\tgNormal = vec4(0.5, 0.5, 1.0, 0.0);');
    };
    material.customProgramCacheKey = () => prevKey + '|gbuffer';
    material.needsUpdate = true;
  },
  patchScene(root) {
    root.traverseVisible(o => {
      if (!o.material) return;
      if (Array.isArray(o.material)) o.material.forEach(m => this.patch(m));
      else this.patch(o.material);
    });
  },
};

// ── Post-process chain ──────────────────────────────────────────────────────
// EffectComposer-style: the scene renders once into the G-buffer (colour, normal,
// depth), then full-screen passes run in order, ping-ponging between two targets;
// the last enabled pass draws to the screen. Every pass material may declare any
// of these uniforms and they are filled in automatically:
//   tColor (previous pass output), tNormal, tDepth, uResolution, uNear, uFar
// Post.add(name, material, { before: 'grade' }) inserts a pass; 'grade' stays last.
const FULLSCREEN_VERTEX = /* glsl */`
varying vec2 vUv;
void main() { vUv = position.xy * 0.5 + 0.5; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

const Post = {
  passes: [],
  size: new THREE.Vector2(),

  init() {
    renderer.getDrawingBufferSize(this.size);
    const { x: w, y: h } = this.size;
    this.gbuffer = new THREE.WebGLRenderTarget(w, h, { count: 2, type: THREE.HalfFloatType });
    this.gbuffer.textures[0].name = 'gColor';
    this.gbuffer.textures[1].name = 'gNormal';
    this.gbuffer.textures[1].type = THREE.UnsignedByteType;
    this.gbuffer.depthTexture = new THREE.DepthTexture(w, h);
    this.gbuffer.depthTexture.type = THREE.UnsignedIntType;
    this.pingPong = [0, 1].map(() => new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType, depthBuffer: false }));

    const tri = new THREE.BufferGeometry();
    tri.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-1, -1, 0, 3, -1, 0, -1, 3, 0]), 3));
    this.quad = new THREE.Mesh(tri);
    this.quad.frustumCulled = false;
    this.quadCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    App.on('resize', () => this.setSize());
  },

  setSize() {
    renderer.getDrawingBufferSize(this.size);
    const { x: w, y: h } = this.size;
    this.gbuffer.setSize(w, h);
    for (const t of this.pingPong) t.setSize(w, h);
  },

  shader(fragmentShader, uniforms = {}) {
    return new THREE.ShaderMaterial({
      uniforms, vertexShader: FULLSCREEN_VERTEX, fragmentShader,
      depthTest: false, depthWrite: false,
    });
  },

  add(name, material, { before, update } = {}) {
    const pass = { name, material, enabled: true, update };
    const at = before ? this.passes.findIndex(p => p.name === before) : -1;
    if (at >= 0) this.passes.splice(at, 0, pass); else this.passes.push(pass);
    return pass;
  },
  get(name) { return this.passes.find(p => p.name === name); },

  render() {
    GBuffer.patchScene(scene);
    renderer.setRenderTarget(this.gbuffer);
    renderer.render(scene, camera);

    const active = this.passes.filter(p => p.enabled);
    let read = this.gbuffer.textures[0];
    active.forEach((pass, i) => {
      const u = pass.material.uniforms;
      if (u.tColor) u.tColor.value = read;
      if (u.tNormal) u.tNormal.value = this.gbuffer.textures[1];
      if (u.tDepth) u.tDepth.value = this.gbuffer.depthTexture;
      if (u.uResolution) u.uResolution.value.copy(this.size);
      if (u.uNear) u.uNear.value = camera.near;
      if (u.uFar) u.uFar.value = camera.far;
      if (pass.update) pass.update(pass);
      const target = i === active.length - 1 ? null : this.pingPong[i % 2];
      this.quad.material = pass.material;
      renderer.setRenderTarget(target);
      renderer.render(this.quad, this.quadCamera);
      if (target) read = target.texture;
    });
  },
};

// ── GPU particles ───────────────────────────────────────────────────────────
// A pool of size² particles whose state lives in a float texture, one texel each,
// stepped at the sim rate by a full-texture pass and drawn as instanced quads that
// read their state in the vertex shader, so the CPU never touches a particle.
// The update pass is a Heightfield.passMaterial (so it sees the layers) with
// GPU_PARTICLE_GLSL ahead of the system's own main(), which reads its particle with
// texelFetch(tState, ivec2(gl_FragCoord.xy), 0) and writes the new state. By
// convention w < 0 is a free particle (reset() frees them all). geometry() gives
// quads (position.x 0 tail … 1 head, position.y −1 … 1 across) with aCell, the
// particle's texel; set its instanceCount to draw fewer. Randomness comes from
// particleRand(), an integer hash of the particle, a number (a step) and the seed.
const GPU_PARTICLE_GLSL = /* glsl */`
uniform sampler2D tState;
uniform float uParticleSeed;   // a whole number, from the seed
uniform float uParticleStep;   // sim steps since reset, mod 8192
uint pcgHash(uint v) {
  uint s = v * 747796405u + 2891336453u;
  uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u;
  return (w >> 22u) ^ w;
}
// Four repeatable random numbers in 0…1 for particle id, a whole number n and a salt.
vec4 particleRand(float id, float n, uint salt) {
  uint h = pcgHash(uint(id) * 7u + salt + pcgHash(uint(n) + pcgHash(uint(uParticleSeed))));
  uint a = pcgHash(h), b = pcgHash(a), c = pcgHash(b);
  return vec4(uvec4(h, a, b, c)) / 4294967295.0;
}
float particleId(ivec2 c) { return float(c.y * textureSize(tState, 0).x + c.x); }`;

class GpuParticles {
  constructor(size, stepGlsl, uniforms = {}) {
    this.size = size;
    this.count = size * size;
    const target = () => new THREE.WebGLRenderTarget(size, size, {
      type: Heightfield.type, format: THREE.RGBAFormat,
      minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
      depthBuffer: false, generateMipmaps: false,
    });
    this.read = target();
    this.write = target();
    this.uniforms = { tState: { value: this.read.texture }, uParticleSeed: { value: 0 }, uParticleStep: { value: 0 }, ...uniforms };
    this.pass = Heightfield.passMaterial(GPU_PARTICLE_GLSL + stepGlsl, this.uniforms);
    this.clear = Heightfield.passMaterial('void main() { gl_FragColor = vec4(0.0, 0.0, 0.0, -1.0); }');
    this.steps = 0;
  }

  // Free every particle; seed is a whole number.
  reset(seed) {
    for (const t of [this.read, this.write]) Heightfield.render(this.clear, t);
    this.steps = 0;
    this.uniforms.uParticleSeed.value = seed;
    this.uniforms.uParticleStep.value = 0;
    this.uniforms.tState.value = this.read.texture;
  }

  step() {
    Heightfield.render(this.pass, this.write);
    [this.read, this.write] = [this.write, this.read];
    this.uniforms.tState.value = this.read.texture;
    this.steps++;
    this.uniforms.uParticleStep.value = this.steps % 8192;
  }

  geometry() {
    const g = new THREE.InstancedBufferGeometry(), cells = new Float32Array(this.count * 2);
    g.setAttribute('position', new THREE.Float32BufferAttribute([0, -1, 0, 1, -1, 0, 0, 1, 0, 1, 1, 0], 3));
    g.setIndex([0, 1, 2, 2, 1, 3]);
    for (let k = 0; k < this.count; k++) { cells[2 * k] = k % this.size; cells[2 * k + 1] = Math.floor(k / this.size); }
    g.setAttribute('aCell', new THREE.InstancedBufferAttribute(cells, 2));
    g.instanceCount = this.count;
    return g;
  }
}

// ── Outline pass ────────────────────────────────────────────────────────────
// Ink lines from two edge detectors: the Laplacian of inverse depth (zero on any
// flat plane, so grazing terrain stays clean; positive only on the near side of a
// silhouette, so lines are one-sided) and the change in normal between neighbours.
// Width and strength fall off with distance so far terrain doesn't turn to noise.
// The same pass draws the rim light: pixels just inside a silhouette whose normal
// faces away from the sun take a thin band of sky colour.
const OUTLINE_FRAGMENT = /* glsl */`
#include <packing>
uniform sampler2D tColor;
uniform sampler2D tNormal;
uniform sampler2D tDepth;
uniform vec2 uResolution;
uniform float uNear, uFar;
uniform vec3 uInk, uSkyColor, uSunView;
uniform vec3 uInkRange;    // near distance, far distance, far alpha
uniform vec2 uInkCutoff;   // ink fades out completely between these distances
uniform vec2 uInkWidth;    // px near, px far
uniform vec2 uEdgeK;       // depth threshold, normal threshold
uniform vec3 uRim;         // width px, strength, facing threshold
varying vec2 vUv;

float invZ(vec2 uv) {
  float d = texture(tDepth, uv).x;
  return d >= 1.0 ? 0.0 : -1.0 / perspectiveDepthToViewZ(d, uNear, uFar);
}
float depthLaplacian(vec2 uv, float w, vec2 o) {
  float s = invZ(uv + vec2(o.x, 0.0)) + invZ(uv - vec2(o.x, 0.0))
          + invZ(uv + vec2(0.0, o.y)) + invZ(uv - vec2(0.0, o.y));
  return (4.0 * w - s) / w;
}
